iz-opt'><input type='radio' name='q3' value='1'> 单色等差数列<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 零和子集<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 大独立集<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：Littlewood–Offord 问题<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 步长全为 1 时，带符号和的最大重数是什么量级？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 2^d/√d<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 2^d/d<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> d<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> √d<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Esséen 集中不等式依赖步长的哪个量？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 步长的最大值<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 步长的平方和<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 步长的个数<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 步长的乘积<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 随机 Bernoulli 矩阵奇异的概率是什么量级？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 2^{-n}<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> n^{-1}<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> (1/2+o(1))^n<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 1/n²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：关联几何<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> n 个顶点的平面简单图最多有多少条边（n≥3）？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 3n−6<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 2n−3<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> n²/2<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 4n−8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Szemerédi–Trotter 定理中关联上界的指数是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 2/3<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 3/4<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 1/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 实数域上的和积估计主要借助什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 组合零点定理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> Stepanov 方法<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 关联几何<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 超图移除引理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：代数方法<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 组合零点定理成立需要什么条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 任意环，系数非零<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 域，且最高次项系数非零<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> 域，且所有系数非零<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 整环，常数项非零<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Erdős–Heilbronn 猜想给出的受限和集下界是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 两倍集合大小<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> min(p, 2|A|−3)<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> |A|+|A|<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 四倍集合大小减三<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Stepanov 方法的核心依据是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 零点数不超过多项式次数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 次数不超过零点数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 所有系数为零<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 域必须是无限的<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：k=3 的 Szemerédi 定理<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Szemerédi 定理的结论是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 正上密度的整数集含任意长的等差数列<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 稠密集合至少含一个 3 项等差数列<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> 随机集合含等差数列<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 所有整数集含等差数列<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 密度增量策略为什么一定会终止？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> N 是有限的<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 密度每次增加，且有上界 1<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 偏差会自动消失<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> Bohr 集越来越大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 证明 k=3 的 Szemerédi 定理使用的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> Gowers 范数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 超图移除引理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 线性傅立叶分析<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 转移原理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> k 项等差数列由哪个阶的 Gowers 范数控制？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> k−1 阶<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> k 阶<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> k+1 阶<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 2 阶<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 硬障碍指的是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 线性相位<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 真正的高阶结构，如多项式相位或低维 GAP<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 随机噪声<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 可以忽略的小偏差<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Green–Tao 定理证明中的核心技术是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 密度增量<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 正则引理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 转移原理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> Stepanov 方法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：和集中的长等差数列<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本章关于长等差数列的结论针对哪个对象？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> A 本身<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> lA<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> A−A<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> A 的补集<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 完全序列的定义是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 每项可以重复使用<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 每项最多用一次就能表示所有足够大的整数<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 密度大于 1/2<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 一定含长等差数列<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 本章结论与 Szemerédi 定理在长度上的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 两者都是对数级<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 两者都是幂次级<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 本章幂次级，Szemerédi 是对数级<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 本章线性，Szemerédi 是幂次<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='加性集'>加性集 — 交换群里的一个有限非空子集，讨论和集时必须带上环境群 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='和集 a+b'>和集 A+B — 所有 a+b（a∈A，b∈B）组成的集合 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='差集 a−b'>差集 A−B — 所有 a−b 组成的集合，比和集更对称 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='小倍增'>小倍增 — σ 接近 1，集合几乎对加法封闭 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='随机集'>随机集 — 倍增常数接近最大值，加法关系稀少 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='广义等差数列 gap'>广义等差数列 GAP — 起点加若干方向的整数系数组合，形如 a+[0,N₁]v₁+… <span class=glossary-ref>（第 3 章：加性几何）<\/span><\/li><li data-term='真 gap'>真 GAP — 元素个数达到 ∏(N_i+1) 上界、不发生塌缩的 GAP <span class=glossary-ref>（第 3 章：加性几何）<\/span><\/li><li data-term='真化'>真化 — 换方向或升维，把非真 GAP 变成真 GAP 的操作 <span class=glossary-ref>（第 3 章：加性几何）<\/span><\/li><li data-term='加性能量 e(a,b)'>加性能量 E(A,B) — 满足 a+b=a&#x27;+b&#x27; 的四元组个数 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='覆盖引理'>覆盖引理 — 和集小则存在小骨架，使整个集合被骨架加差集覆盖 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='bsg 定理'>BSG 定理 — 能量大则存在大子集，其和集只比自身大常数倍 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='对称集'>对称集 — 满足 A=−A 的集合 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='部分和集'>部分和集 — 集合在某个方向上投影得到的和集，用来控制不平衡性 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='特征'>特征 — 群到单位圆的同态，满足 ξ(x+y)=ξ(x)ξ(y) <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='傅立叶系数 â(ξ)'>傅立叶系数 Â(ξ) — A 在频率 ξ 上的投影，衡量偏差 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='卷积定理'>卷积定理 — 卷积的傅立叶变换等于各自变换的乘积 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='bohr 集'>Bohr 集 — 在若干频率上同时接近 1 的元素集合 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='(p) 常数'>(p) 常数 — 衡量群里 p 元和为零的偏离程度的参数 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='bh[g] 集'>Bh[g] 集 — 每种和最多有 g 种表示的集合，Sidon 是 g=1 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='分离集'>分离集 — 元素之间没有短小整数线性关系的集合 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='e-变换'>e-变换 — 保持和集不增、把集合整理得更对称的操作 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='freiman 同态'>Freiman 同态 — 保持 a₁+a₂=a₃+a₄ 这类加法关系的映射 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='无挠'>无挠 — 群里没有满足 mx=0（m&gt;0）的非零元素 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='万能环境群'>万能环境群 — 使 A 的所有加法关系都保持的最大环境群 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='turán 定理'>Turán 定理 — n 顶点 e 边的图，独立集至少 n²/(2e+n) <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='sidon 集'>Sidon 集 — 所有两两和互不相同的集合 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='ramsey 定理'>Ramsey 定理 — 足够大的完全图染色后必有大单色团 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='van der waerden 定理'>van der Waerden 定理 — 足够长的染色区间必有单色等差数列 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='plünnecke 不等式'>Plünnecke 不等式 — 一次和集膨胀率小，则多次和集膨胀率也受控 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='littlewood–offord 问题'>Littlewood–Offord 问题 — 带符号和最多能重复多少次 <span class=glossary-ref>（第 7 章：Littlewood–Offord 问题）<\/span><\/li><li data-term='集中函数'>集中函数 — 随机和落在某点的概率上界 <span class=glossary-ref>（第 7 章：Littlewood–Offord 问题）<\/span><\/li><li data-term='esséen 不等式'>Esséen 不等式 — 集中度受步长平方和控制的估计 <span class=glossary-ref>（第 7 章：Littlewood–Offord 问题）<\/span><\/li><li data-term='关联'>关联 — 点落在线上的一次计数 <span class=glossary-ref>（第 8 章：关联几何）<\/span><\/li><li data-term='交叉数'>交叉数 — 图在平面上绘制时边与边的交叉次数 <span class=glossary-ref>（第 8 章：关联几何）<\/span><\/li><li data-term='网格分解'>网格分解 — 把平面切成格子以控制点线关系的方法 <span class=glossary-ref>（第 8 章：关联几何）<\/span><\/li><li data-term='组合零点定理'>组合零点定理 — 次数与最高项系数控制格点上是否存在非零点 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='受限和集'>受限和集 — 禁止同元素相加得到的和集 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='davenport 常数'>Davenport 常数 — 任意 k 个元素都有非空零和子集的最小 k <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='kemnitz 猜想'>Kemnitz 猜想 — Davenport 常数在平面格点上的版本，猜想值 4n−3 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='stepanov 方法'>Stepanov 方法 — 用&quot;零点数不超过次数&quot;反推集合大小 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='分圆域'>分圆域 — 有理数域添加单位根得到的扩域 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='密度增量'>密度增量 — 无 AP 时在子结构上密度变高，迭代至矛盾的策略 <span class=glossary-ref>（第 10 章：k=3 的 Szemerédi 定理）<\/span><\/li><li data-term='提升'>提升 — 把区间里的集合搬到循环群里处理的技术 <span class=glossary-ref>（第 10 章：k=3 的 Szemerédi 定理）<\/span><\/li><li data-term='正则引理'>正则引理 — 任意大图可分成常数多块，使块间近似随机 <span class=glossary-ref>（第 10 章：k=3 的 Szemerédi 定理）<\/span><\/li><li data-term='gowers 范数 u^k'>Gowers 范数 U^k — 2^k 个变量上的平均，衡量 k 阶均匀性 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='硬障碍'>硬障碍 — 真正的高阶结构，如多项式相位或低维 GAP <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='软障碍'>软障碍 — 线性相位造成的表面偏差，可除掉相位消除 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='gowers 逆定理'>Gowers 逆定理 — 范数大则存在低次多项式相位解释偏差 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='超图移除引理'>超图移除引理 — 删少量边即可破坏全部完全子超图 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='转移原理'>转移原理 — 先用稠密均匀模型证明，再搬回稀疏集合 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='完全序列'>完全序列 — 每项最多用一次就能表示所有足够大整数的序列 <span class=glossary-ref>（第 12 章：和集中的长等差数列）<\/span><\/li><li data-term='次完全序列'>次完全序列 — 允许有限项数的完全性版本 <span class=glossary-ref>（第 12 章：和集中的长等差数列）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<p>这本书真正可迁移的东西不是定理，是八套反复出现的证明套路。每套都写清&quot;什么时候想起来用它&quot;。<\/p>\n<h2>框架 1：随机方法的四层递进<\/h2>\n<p><strong>何时用<\/strong>：要证&quot;存在一个对象满足性质 P&quot;，但显式构造很难。<\/p>\n<p><strong>怎么做<\/strong>：随机生成对象，把&quot;失败&quot;定义成坏事件。按需要的精度选工具：<\/p>\n<ol><li>\n只想知道&quot;有没有&quot;——算坏事件个数的期望，小于 1 就存在。\n<\/li><li>\n想排除&quot;集中在零附近&quot;——加方差，用 P(X&gt;0) ≥ (EX)²/E(X²)。\n<\/li><li>\n要指数小的尾部——对 e^{tX} 用 Markov，再对 t 优化。\n<\/li><li>\n坏事件之间有依赖——度小用局部引理，度大但边少用 Janson。\n<\/ol>\n<p><strong>作者的做法<\/strong>：先算期望定位量级，再决定要不要上二阶或指数。不要一上来就 Chernoff。<\/p>\n<h2>框架 2：局部化<\/h2>\n<p><strong>何时用<\/strong>：整个集合太大，直接分析无从下手。<\/p>\n<p><strong>怎么做<\/strong>：用覆盖引理找一个大小受控的骨架 A&#x27;，把原集合写成骨架加差集的平移。之后所有操作都在骨架上做，误差用 K 来控制。<\/p>\n<p><strong>反模式<\/strong>：把骨架当成原集合的结构。骨架只是坐标，原集合可以比它乱得多。<\/p>\n<h2>框架 3：能量转换<\/h2>\n<p><strong>何时用<\/strong>：已知&quot;表示次数很多&quot;，想推出&quot;存在结构好的子集&quot;。<\/p>\n<p><strong>怎么做<\/strong>：把表示次数写成能量，用柯西不等式建立与和集大小的关系，再用 BSG 转成子集结构。损失的部分用&quot;子集仍占常数比例&quot;来兜住。<\/p>\n<p><strong>关键判断<\/strong>：BSG 天生要损失子集。如果结论需要覆盖整个 A，就不能只用它，得配合覆盖引理或 e-变换。<\/p>\n<h2>框架 4：结构定理落地<\/h2>\n<p><strong>何时用<\/strong>：已经知道倍增常数小，想要 A 的具体形状。<\/p>\n<p><strong>怎么做<\/strong>：先用 e-变换整理成对称、极小，再分有挠/无挠。无挠套 Freiman 得 GAP，有挠先分离挠部分。最后检查 GAP 是否真，非真就真化。<\/p>\n<p><strong>常见断点<\/strong>：GAP 不真时体积估计全错，真化这一步不能跳。<\/p>\n<h2>框架 5：换到频率空间<\/h2>\n<p><strong>何时用<\/strong>：问题涉及&quot;和中点&quot;&quot;重复表示&quot;&quot;等差结构&quot;。<\/p>\n<p><strong>怎么做<\/strong>：把集合的指示函数做傅立叶变换。卷积变乘法，能量变四阶矩。偏差大就找 Bohr 集，把偏差翻译成子结构上的密度。<\/p>\n<p><strong>边界<\/strong>：线性傅立叶只能看一阶结构，k≥4 的等差数列必须换 Gowers 范数。<\/p>\n<h2>框架 6：双重计数<\/h2>\n<p><strong>何时用<\/strong>：有两类对象（点与线、集合与和），想估它们的关联总数。<\/p>\n<p><strong>怎么做<\/strong>：一种方式按&quot;每个对象连多少&quot;数，另一种按&quot;结构约束&quot;数，两个结果必须相等，于是得到不等式。几何里还要加上交叉数这个额外约束。<\/p>\n<p><strong>反模式<\/strong>：只数一遍。双重计数的力量全在&quot;两种数法给出不同表达式&quot;。<\/p>\n<h2>框架 7：多项式化<\/h2>\n<p><strong>何时用<\/strong>：在有限域上，组合条件难以直接计数。<\/p>\n<p><strong>怎么做<\/strong>：把&quot;某种组合不存在&quot;写成多项式在格点上取零，用次数上界和系数非零推出矛盾。或者反过来，构造一个零点很多的多项式，用&quot;零点 ≤ 次数&quot;限制集合大小。<\/p>\n<p><strong>前提<\/strong>：必须是域。整环上零点数可以超过次数。<\/p>\n<h2>框架 8：密度增量<\/h2>\n<p><strong>何时用<\/strong>：要证&quot;正密度集合必含某种结构&quot;。<\/p>\n<p><strong>怎么做<\/strong>：假设不含，用傅立叶或高阶范数找到偏差，把偏差转成某个 Bohr 集/子结构上密度增加，迭代。密度有上界 1，所以迭代次数有限，最终矛盾。<\/p>\n<p><strong>量化要点<\/strong>：每步增量只依赖当前密度，不依赖 N。这是界能写出来的原因。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要和集大小估计，先看 σ：σ 小用结构定理，σ 大用傅立叶。\n<\/li><li>\n要存在性，先用随机方法；构造不出来不是失败，是这类问题的常态。\n<\/li><li>\n要处理 k≥4 的等差数列，别试线性傅立叶，直接上 Gowers。\n<\/li><li>\n稀疏集合（如素数）别直接套 Szemerédi，先做转移。\n<\/li><li>\n有限域上的组合问题，优先想能不能写成多项式。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把&quot;存在&quot;当&quot;构造&quot;<\/strong>。概率方法给的是存在性，很多情形没有已知算法。\n<\/li><li>\n<strong>把&quot;子集结构&quot;当&quot;整体结构&quot;<\/strong>。BSG、逆 Littlewood–Offord 都只保证大多数。\n<\/li><li>\n<strong>把&quot;界很松&quot;当&quot;方法错了&quot;<\/strong>。Ramsey、Szemerédi 的界本来就巨大，能证存在就算成功。\n<\/li><li>\n<strong>在非域上套零点定理<\/strong>。这是最常见的硬错误。\n<\/li><li>\n<strong>忽略真化<\/strong>。GAP 不真时，所有基于体积的计数都会失效。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>记号<\/h2>\n<table><thead><tr><th>记号<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>A+B<\/td><td>{a+b : a∈A, b∈B}<\/td><\/tr><tr><td>A−B<\/td><td>{a−b : a∈A, b∈B}<\/td><\/tr><tr><td>kA<\/td><td>A+A+…+A（k 次）<\/td><\/tr><tr><td>σ[A]<\/td><td>\\<\/td><td>A+A\\<\/td><td>/\\<\/td><td>A\\<\/td><td><\/td><\/tr><tr><td>E(A,B)<\/td><td>满足 a+b=a&#x27;+b&#x27; 的四元组个数<\/td><\/tr><tr><td>Â(ξ)<\/td><td>Σ_{a∈A} ξ(a)，傅立叶系数<\/td><\/tr><tr><td>d(A,B)<\/td><td>log(\\<\/td><td>A−B\\<\/td><td>/√(\\<\/td><td>A\\<\/td><td>\\<\/td><td>B\\<\/td><td>))<\/td><\/tr><tr><td>U^k<\/td><td>Gowers k 阶范数<\/td><\/tr><tr><td>I(P,L)<\/td><td>点集 P 与线集 L 的关联数<\/td><\/tr><\/tbody><\/table>\n<h2>核心不等式<\/h2>\n<table><thead><tr><th>名称<\/th><th>内容<\/th><th>用在哪<\/th><\/tr><\/thead><tbody><tr><td>平凡下界<\/td><td>\\<\/td><td>A+B\\<\/td><td>≥ \\<\/td><td>A\\<\/td><td>+\\<\/td><td>B\\<\/td><td>−1（ℤ 中）<\/td><td>一维估计<\/td><\/tr><tr><td>柯西-能量<\/td><td>E(A,B) ≥ \\<\/td><td>A\\<\/td><td>²\\<\/td><td>B\\<\/td><td>²/\\<\/td><td>A+B\\<\/td><td><\/td><td>能量与和集互推<\/td><\/tr><tr><td>Ruzsa 三角<\/td><td>d(A,C) ≤ d(A,B)+d(B,C)<\/td><td>距离传递<\/td><\/tr><tr><td>Ruzsa 覆盖<\/td><td>\\<\/td><td>A+B\\<\/td><td>≤K\\<\/td><td>B\\<\/td><td>⟹ A ⊂ A&#x27;+B−B，\\<\/td><td>A&#x27;\\<\/td><td>≤K<\/td><td>局部化<\/td><\/tr><tr><td>Plünnecke<\/td><td>\\<\/td><td>A+B\\<\/td><td>≤K\\<\/td><td>B\\<\/td><td>⟹ \\<\/td><td>kA+lB\\<\/td><td>≤K^{k+l}\\<\/td><td>B\\<\/td><td><\/td><td>多次和集<\/td><\/tr><tr><td>Brunn–Minkowski<\/td><td>\\<\/td><td>A+B\\<\/td><td>^{1/d} ≥ \\<\/td><td>A\\<\/td><td>^{1/d}+\\<\/td><td>B\\<\/td><td>^{1/d}<\/td><td>凸体体积<\/td><\/tr><tr><td>Parseval<\/td><td>Σ\\<\/td><td>f\\<\/td><td>²=(1/\\<\/td><td>Z\\<\/td><td>)Σ\\<\/td><td>f̂\\<\/td><td>²<\/td><td>能量守恒<\/td><\/tr><tr><td>能量-傅立叶<\/td><td>E(A,A)=Σ\\<\/td><td>Â(ξ)\\<\/td><td>⁴<\/td><td>谱估计<\/td><\/tr><tr><td>Esséen<\/td><td>sup P(Σεv=x) ≤ C/√(Σ\\<\/td><td>v\\<\/td><td>²)<\/td><td>集中度<\/td><\/tr><tr><td>Turán<\/td><td>独立集 ≥ n²/(2e+n)<\/td><td>无和集<\/td><\/tr><tr><td>交叉数<\/td><td>交叉 ≥ m−3n+6（n≥3）<\/td><td>关联几何<\/td><\/tr><tr><td>S-T<\/td><td>I(P,L) ≲ \\<\/td><td>P\\<\/td><td>^{2/3}\\<\/td><td>L\\<\/td><td>^{2/3}+\\<\/td><td>P\\<\/td><td>+\\<\/td><td>L\\<\/td><td><\/td><td>点线关联<\/td><\/tr><\/tbody><\/table>\n<h2>常数与界<\/h2>\n<table><thead><tr><th>量<\/th><th>值或量级<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>最大无和子集（[1,n]）<\/td><td>⌈n/3⌉<\/td><td>奇数构造可达<\/td><\/tr><tr><td>秩 d 长度 N 的 GAP 体积<\/td><td>(N+1)^d<\/td><td>真时等于元素数<\/td><\/tr><tr><td>小倍增精确刻画阈值<\/td><td>σ&lt;2 或 σ&lt;3<\/td><td>视群结构而定<\/td><\/tr><tr><td>LO 集中度（步长全 1）<\/td><td>~2^d/√d<\/td><td>二项式系数峰值<\/td><\/tr><tr><td>随机 Bernoulli 矩阵奇异率<\/td><td>(1/2+o(1))^n<\/td><td>逆 LO 证明<\/td><\/tr><tr><td>Szemerédi k=3 定量界<\/td><td>log log N 起，改进到 (log N)^c<\/td><td>逐步优化<\/td><\/tr><\/tbody><\/table>\n<h2>证明路线速查<\/h2>\n<table><thead><tr><th>要证什么<\/th><th>首选工具<\/th><th>备选<\/th><\/tr><\/thead><tbody><tr><td>存在某对象<\/td><td>一阶矩<\/td><td>二阶矩、LLL<\/td><\/tr><tr><td>和集小 ⟹ 结构<\/td><td>覆盖引理 + Freiman<\/td><td>e-变换<\/td><\/tr><tr><td>表示多 ⟹ 结构<\/td><td>能量 + BSG<\/td><td>图论连通性<\/td><\/tr><tr><td>有偏差 ⟹ 子结构密度高<\/td><td>傅立叶 + Bohr 集<\/td><td>高阶范数<\/td><\/tr><tr><td>正密度 ⟹ 长 AP<\/td><td>密度增量<\/td><td>遍历、正则引理<\/td><\/tr><tr><td>稀疏集合 ⟹ 长 AP<\/td><td>转移原理<\/td><td>——<\/td><\/tr><tr><td>有限域组合下界<\/td><td>组合零点定理<\/td><td>Stepanov<\/td><\/tr><\/tbody><\/table>\n<h2>三个最常搞混的点<\/h2>\n<ul><li>\n<strong>和集小 ≠ 集合是等差数列<\/strong>：也可能是子群、陪集、低秩 GAP。\n<\/li><li>\n<strong>偏差大 ≠ 有等差数列<\/strong>：只说明偏向某频率，形状可能复杂。\n<\/li><li>\n<strong>能量大 ≠ 整个集合规整<\/strong>：只保证存在大子集规整。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
