quot;等价于&quot;某个顶点度数很高&quot;。图论工具处理的就是这些度数、连通性、独立集的问题。<\/p>\n<h3>概念 2：Turán 定理与无和集<\/h3>\n<p>Turán 定理：n 个顶点、e 条边的图，独立集至少有 n²/(2e+n) 个顶点。<\/p>\n<p>应用方式：把&quot;禁止出现的和&quot;作为边。若 A 是无和集（A 中不存在 x+y=z），要构造尽量大的无和子集。把 {1,...,n} 里所有满足 x+y=z 的 (x,z) 连边，得到一个图，独立集就是无和集。代入 e 的估计就得到&quot;最大无和集至少 n/3&quot;这类结论。<\/p>\n<p><strong>要点<\/strong>：Turán 给的是下界，构造用的是&quot;取最大独立集&quot;，不需要显式写出来。<\/p>\n<h3>概念 3：Sidon 集与独立集<\/h3>\n<p>Sidon 集指所有两两和 a+b（a≤b）互不相同。它等价于说&quot;把和当边时图里没有长度为 2 的重复路径&quot;。<\/p>\n<p>Sidon 集的大小上界约为 √n（在 [1,n] 里），这个界可以用计数直接得到，也可以用图论里的&quot;三角形个数&quot;来证。<\/p>\n<h3>概念 4：Ramsey 与 van der Waerden<\/h3>\n<p>Ramsey 定理：给足够大的完全图的边染 r 种颜色，必有一种颜色包含一个大小给定的单色团。<\/p>\n<p>van der Waerden 定理：把足够长的整数区间染成 r 种颜色，必有一种颜色包含任意长的等差数列。<\/p>\n<p>两者的关系是&quot;结构版本的抽屉原理&quot;：颜色数固定、长度固定，只要区间足够长，单色结构必然出现。第 6.3 节用 Ramsey 定理给出 van der Waerden 的一个证明。<\/p>\n<p><strong>注意<\/strong>：这些定理给的是&quot;存在&quot;，界通常巨大（Ackermann 级别），不能直接用于定量估计。<\/p>\n<h3>概念 5：用连通性证明 BSG<\/h3>\n<p>BSG 定理要证&quot;能量大 ⟹ 存在大子集使和集小&quot;。图论版本的思路：<\/p>\n<ol><li>\n把 A、B 之间的&quot;和关系&quot;建成一个二分图，边表示 a+b 落在某个小集合里。\n<\/li><li>\n能量大意味着边多。\n<\/li><li>\n边多的图要么有一个度数很高的顶点，要么有一块稠密的子图。\n<\/li><li>\n稠密子图里可以抽出大的匹配或连通块，对应到 A&#x27;、B&#x27;。\n<\/li><li>\n连通性保证 A&#x27;+B&#x27; 被少数几个平移覆盖，于是和集小。\n<\/ol>\n<p>这条证明的好处是&quot;只看边数，不看加法细节&quot;，因此可以推广到非交换群。<\/p>\n<h3>概念 6：Plünnecke 不等式<\/h3>\n<p>Plünnecke 的结果大致是：若 |A+B| ≤ K|B|，则对任意正整数 k、l，<\/p>\n<p>|kA + lB| ≤ K^{k+l} |B|。<\/p>\n<p>其中 kA 表示 A 的 k 重和集。它把&quot;一次相加的膨胀率&quot;控制住，就自动控制了多次相加的膨胀率。<\/p>\n<p>和 BSG 的区别：BSG 是&quot;能量大 ⟹ 找子集&quot;，是逆向的、要损失子集；Plünnecke 是&quot;一次小 ⟹ 多次也小&quot;，是正向的、不损失集合。两者配合使用：先用 Plünnecke 控制多次和集，再用 BSG 从能量反推结构。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[加法关系] --&gt; B[二分图]\n    B --&gt; C[度数]\n    B --&gt; D[独立集]\n    B --&gt; E[连通性]\n    C --&gt; F[表示次数]\n    D --&gt; G[无和集与Sidon集]\n    E --&gt; H[BSG证明]\n    B --&gt; I[Plunnecke不等式]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把加性关系想成&quot;社交网络&quot;。两个人如果能凑出某个和，就连一条边。无和集就是&quot;互不相连的一群人&quot;（独立集）；表示次数多就是&quot;某人是社交中心&quot;（高度数顶点）；BSG 就是说&quot;如果网络里的边特别多，必然有一块小圈子内部联系极密&quot;。<\/p>\n<p><strong>失效边界<\/strong>：社交网络是有向、带权、随时间变化的，这里的图是静态简单图。<\/p>\n<p><strong>实例<\/strong>：A = {1,2,...,n}，把 x+y=z 的 (x,z) 连边。顶点 z 的度数约等于&quot;z 有多少种拆分&quot;，最大约 n/2。用 Turán 定理估独立集，e 约 n²/4（每个 z 有 O(z) 种拆分，求和约 n²/4），代入得独立集 ≥ n²/(2e+n) ≈ n²/(n²/2) ≈ 2，这个下界太弱——实际最大无和集是 ⌈n/2⌉ 个奇数。这说明 Turán 是通用工具，具体问题上还要挑更好的图或者更细的计数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Turán 定理给出的界总是紧的。它只保证存在，界经常很松。\n<\/li><li>\n别以为 Ramsey 定理能给出可用的定量界。它的界增长极快，实际证明里只用来保证存在。\n<\/li><li>\n别以为 Plünnecke 和 BSG 是一回事。前者不损失集合，后者必须损失到子集。\n<\/li><li>\n别以为图论方法只适用于离散集合。它也能处理连续群，只要能把关系离散化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nTurán 定理的独立集下界公式是什么？（答案：n²/(2e+n)；解析：由平均度数推出存在大独立集的经典估计。）\n<\/li><li>\n为什么 Plünnecke 不等式里指数是 k+l？（答案：每多一层和集就多乘一次膨胀率 K；解析：|kA+lB| 相当于做了 k+l 次&quot;加 B&quot;的操作。）\n<\/li><li>\nBSG 的图论证明里，为什么要找&quot;连通块&quot;而不只是&quot;匹配&quot;？（答案：连通性才能保证子集的和被少数平移覆盖；解析：匹配只保证配对，不保证整体结构。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图是加法关系的&quot;骨架&quot;，独立集对应无和集。\n<\/li><li>\nRamsey 与 van der Waerden 是存在性工具，界不可用。\n<\/li><li>\nBSG 逆向、Plünnecke 正向，配合使用。\n<\/li><li>\n度数大 ⟹ 表示次数多 ⟹ 能量大。\n<\/ul>", "ch07": "<h1>第 7 章：Littlewood–Offord 问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1、4 章；线性代数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清 Littlewood–Offord 问题在问什么：子集和最多能重复多少次\n<\/li><li>\n用 Sperner 定理和傅立叶两种方法给出集中上界\n<\/li><li>\n叙述 Esséen 集中不等式，知道它为什么只依赖步长的平方和\n<\/li><li>\n解释随机 Bernoulli 矩阵为什么大概率可逆，以及逆 Littlewood–Offord 在其中的作用\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>给 d 个步长 v₁,...,v_d，考虑所有 2^d 个带符号和；Littlewood–Offord 问这些和最多能挤到多密，逆问题问如果挤得很密，步长必须长什么样。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题设定<\/h3>\n<p>取 v₁,...,v_d ∈ Z，考虑 2^d 个和<\/p>\n<p>ε₁v₁ + ... + ε_dv_d，ε_i ∈ {−1, +1}。<\/p>\n<p>如果步长都是 1，和只取 −d, −d+2, ..., d 共 d+1 个值，平均每个值有 2^d/(d+1) 个表示，集中度约 2^d/d。<\/p>\n<p>如果步长是 2 的幂，每个和都唯一，集中度为 1。<\/p>\n<p>前者是&quot;最集中&quot;的极端，后者是&quot;最分散&quot;的极端。Littlewood–Offord 要给出前者到底能多集中。<\/p>\n<h3>概念 2：组合方法（Sperner）<\/h3>\n<p>把每个子集对应到 {1,...,d} 的子集。若所有步长非零且互不相同（或者满足一定的&quot;无短关系&quot;条件），可以证明最大重数不超过 C(2d,d) 量级，也就是约 2^d/√d。<\/p>\n<p><strong>直觉<\/strong>：要让两个不同的符号向量给出同一个和，必须有 Σ δ_i v_i = 0，其中 δ_i ∈ {−2,0,2}。步长越&quot;独立&quot;，这种关系越少。<\/p>\n<p>Sperner 定理在这里的作用是：把&quot;和为定值&quot;的族看成反链，反链大小受组合数控制。<\/p>\n<h3>概念 3：傅立叶方法<\/h3>\n<p>集中度可以写成概率形式：随机取 ε_i，问 P(Σ ε_i v_i = x) 最大是多少。用傅立叶展开，这个概率等于<\/p>\n<p>(1/|Z|) Σ_ξ ∏ cos(2π ξ(v_i)/|Z|)。<\/p>\n<p>要估这个式子，就要控制连乘积的衰减。步长越&quot;分散&quot;，cos 因子衰减越快，概率越小。这条路线给出的是&quot;依赖步长分布&quot;的界，比纯组合方法更细。<\/p>\n<h3>概念 4：Esséen 集中不等式<\/h3>\n<p>Esséen 的结果给出集中函数的上界，形式大致是<\/p>\n<p>sup_x P(Σ ε_i v_i = x) ≤ C / √(Σ |v_i|²)。<\/p>\n<p>它只依赖步长的平方和，不依赖步长之间的具体关系。这条不等式在随机矩阵、概率论里用得很广。<\/p>\n<p><strong>为什么只依赖平方和？<\/strong> 因为带符号和的方差就是 Σ|v_i|²，集中度不会超过&quot;方差给出的上限&quot;太多。这是&quot;用二阶矩控制集中&quot;的典型。<\/p>\n<h3>概念 5：逆 Littlewood–Offord<\/h3>\n<p>正向问&quot;最多能多集中&quot;，逆向问&quot;如果集中度很大，步长必须满足什么&quot;。<\/p>\n<p>结论大致是：若存在 x 使 P(Σ ε_i v_i = x) 很大，则绝大部分 v_i 落在一个低秩 GAP 里（除去少数例外）。这和 Freiman 定理的形状完全平行：集中度大 ⟺ 步长有加性结构。<\/p>\n<p>证明思路：先用 Esséen 得到&quot;方差不能太大&quot;，再用傅立叶/组合方法把&quot;集中&quot;翻译成&quot;步长之间的整数关系多&quot;，最后套用 Freiman 型结构定理。<\/p>\n<h3>概念 6：随机 Bernoulli 矩阵<\/h3>\n<p>一个 n×n 的 0-1 随机矩阵，元素独立、取 1 的概率 1/2。它奇异的概率有多大？<\/p>\n<p>如果两列相同，就奇异。两列相同的概率是 2^{−n}，列对数是 n²，所以&quot;有相同列&quot;的概率约 n²2^{−n}，很小。但奇异还有别的成因，比如某列是其他列的整系数组合。<\/p>\n<p>用逆 Littlewood–Offord 可以证明：奇异概率大约是 (1/2 + o(1))^n 量级。思路是&quot;若矩阵奇异，则存在非零整数向量 x 使 Ax=0，即若干列的和为零，这正是一个集中事件&quot;。<\/p>\n<h3>概念 7：二次 Littlewood–Offord<\/h3>\n<p>把线性关系换成二次型：问 ε_i 的二次表达式集中到什么程度。这类问题出现在随机二次型、图谱理论里。结论的形式和线性情形类似，但&quot;结构&quot;变成了&quot;低秩二次型&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[步长向量] --&gt; B[带符号和]\n    B --&gt; C[最大重数]\n    C --&gt; D[组合方法 Sperner]\n    C --&gt; E[傅立叶方法]\n    C --&gt; F[Esséen 不等式]\n    C --&gt; G[逆问题]\n    G --&gt; H[步长落在低秩GAP]\n    H --&gt; I[随机矩阵奇异概率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把 2^d 个符号向量想成 2^d 个人，每人的&quot;存款&quot;是 Σ ε_i v_i。问最多有多少人存款相同。步长像面额：如果面额都是 1 元，存款值只有 d+1 种，人挤得很厉害；如果面额是 1,2,4,8,...，每人存款都不同。<\/p>\n<p><strong>失效边界<\/strong>：现实货币是离散且有限的，数学里的群可以是任意交换群。<\/p>\n<p><strong>实例<\/strong>：d = 3，步长 1,1,1。可能的和是 −3,−1,1,3，各出现 1,3,3,1 次，最大重数 3 = C(3,1)。d = 3，步长 1,2,4，八个和是 ±1±2±4，全部不同，最大重数 1。<\/p>\n<p>这个对比说明&quot;步长的整数关系&quot;直接决定集中度。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Esséen 不等式对所有步长都紧。步长全相同时它给出的界可能偏松，但量级正确。\n<\/li><li>\n别以为逆 Littlewood–Offord 能刻画全部步长。它只能保证&quot;绝大多数&quot;落在 GAP 里，少数例外可以很乱。\n<\/li><li>\n别以为随机矩阵奇异只由&quot;列相同&quot;造成。列之间的整数线性组合才是主因，这正是需要用逆定理的地方。\n<\/li><li>\n别以为这个问题只和概率有关。它的证明大量使用加性组合的结构定理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n步长全为 1 时，最大重数是多少量级？（答案：约 2^d/√d；解析：二项式系数 C(d,k) 的最大值在中间，约 2^d/√d。）\n<\/li><li>\nEsséen 不等式依赖步长的什么量？（答案：平方和 Σ|v_i|²；解析：它本质上是方差控制的集中不等式。）\n<\/li><li>\n随机 Bernoulli 矩阵奇异的概率为什么是指数小？（答案：奇异意味着列之间存在非平凡整数关系，这是集中事件，概率指数小；解析：用逆 Littlewood–Offord 把&quot;奇异&quot;转化为&quot;步长集中在低秩结构&quot;，再估概率。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n集中度大 ⟺ 步长有整数关系 ⟺ 落在低秩 GAP。\n<\/li><li>\n组合方法给组合数界，傅立叶方法给依赖分布的界，Esséen 给方差界。\n<\/li><li>\n正问题是&quot;最多多集中&quot;，逆问题是&quot;集中则步长如何&quot;。\n<\/ul>", "ch08": "<h1>第 8 章：关联几何<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2 章；一点平面几何与图论\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用&quot;画图时的交叉数&quot;解释 Szemerédi–Trotter 定理的来源\n<\/li><li>\n写出点线关联上界，并用它推出一个和积估计\n<\/li><li>\n说清&quot;网格分解&quot;为什么能把几何问题降成组合计数\n<\/li><li>\n知道这套方法在实数域、有限域里的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>点上、线上、圆上的关联数量受几何约束；把关联数用两种方式各数一遍（双重计数），就能得到和积问题所需的下界。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：关联<\/h3>\n<p>一个点落在一条线上，叫一次关联。给定点集 P 和线集 L，记 I(P,L) 为关联的总次数。<\/p>\n<p>最平凡的上界是 |P||L|，但那太松。真正的问题是：点和线的数量固定时，关联最多能有多少？<\/p>\n<h3>概念 2：交叉数与欧拉公式<\/h3>\n<p>把图画在平面上，边与边之间的交叉次数有下界：若图有 n 个顶点、m 条边、n≥3，则交叉数至少是 m − 3n + 6。<\/p>\n<p>来源是欧拉公式：平面图的边数不超过 3n−6，超过的部分必须靠交叉&quot;塞&quot;进去。<\/p>\n<p>这条不等式看起来只是拓扑事实，但它是 Szemerédi–Trotter 证明的起点：把&quot;点—线&quot;关联画成图，关联多就意味着边多，边多就意味着交叉多；而交叉本身又可以用&quot;两条线最多交一次&quot;来数，于是得到矛盾或上界。<\/p>\n<h3>概念 3：Szemerédi–Trotter 定理<\/h3>\n<p>对平面上的点集 P 和线集 L，<\/p>\n<p>I(P,L) ≲ |P|^{2/3}|L|^{2/3} + |P| + |L|。<\/p>\n<p>这个界在量级上是最优的：构造取&quot;n×n 网格点 + 所有水平、垂直、斜率有理的线&quot;，可以得到接近这个上界的关联数。<\/p>\n<p><strong>为什么是 2/3 次方？<\/strong> 因为交叉数下界是线性的，而&quot;每条线穿过多少点&quot;与&quot;每两条线的交叉&quot;之间存在二次关系，优化后指数落在 2/3。<\/p>\n<h3>概念 4：用关联推和积<\/h3>\n<p>Erdős–Szemerédi 的和积猜想是：对实数集 A，<\/p>\n<p>max(|A+A|, |A·A|) ≳ |A|^{1+δ}，<\/p>\n<p>δ 是一个正常数。直观上，加法结构和乘法结构不能同时很强。<\/p>\n<p>用关联几何证明的思路：把 A 的元素画在坐标轴上，考虑&quot;斜率为 1 的线&quot;与&quot;乘积相同的双曲线&quot;。若 |A+A| 很小，说明很多点对的和相同，也就是很多点落在同一条斜线 y = c − x 上；若 |A·A| 也很小，说明很多点对落在同一条双曲线 xy = c 上。线与线的交点数受 Szemerédi–Trotter 控制，两者冲突。<\/p>\n<p>这条路线给出的是 δ 很小的定量版本，但已经是&quot;初等&quot;证明里最强的之一。<\/p>\n<h3>概念 5：网格分解与不同距离问题<\/h3>\n<p>网格分解（cell decomposition）是把平面切成若干格子，每个格子里&quot;点—线&quot;关系近似规整。切分的粗细由关联数决定：关联少就切得粗，关联多就切得细。<\/p>\n<p>用它处理不同距离问题：n 个点的不同距离个数至少是多少？平面上的经典结果是 n/√(log n) 量级，网格分解给出的是这个问题的组合版本。<\/p>\n<h3>概念 6：其他域上的和积<\/h3>\n<p>实数域靠&quot;序&quot;和&quot;凸性&quot;，有限域没有序，只能靠多项式方法（第 9 章）和傅立叶。有限域上的和积估计通常形如 |A+A|·|A·A| ≳ |A|^{2+c}，证明用组合零点定理或者 Stepanov 方法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[点线关联] --&gt; B[画成图]\n    B --&gt; C[交叉数下界]\n    C --&gt; D[Szemeredi-Trotter]\n    D --&gt; E[和积估计]\n    D --&gt; F[不同距离]\n    D --&gt; G[网格分解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把点想成钉子，线想成橡皮筋。钉子多、橡皮筋少时，每根皮筋要串很多钉子，但皮筋之间必然频繁交叉。交叉的次数是&quot;几何账单&quot;，关联数不能超过账单允许的量。<\/p>\n<p><strong>失效边界<\/strong>：三维空间里两条直线可以不相交也可以异面，交叉数的下界不再成立，需要换成别的几何工具。<\/p>\n<p><strong>实例<\/strong>：取 3×3 的网格点，P 有 9 个点。取所有水平线和垂直线，L 有 6 条，每条穿 3 个点，I = 18。代入公式：9^{2/3}·6^{2/3} ≈ 4.33·3.30 ≈ 14.3，加上 9+6 后界更松，18 在界内。<\/p>\n<p>这个例子说明公式里的 |P|+|L| 项在小规模时占主导。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Szemerédi–Trotter 只对平面成立。它有高维推广，但形式会变。\n<\/li><li>\n别以为关联上界能直接给出强和积结论。它给的是 δ 很小的版本，强版本需要更精细的工具。\n<\/li><li>\n别以为交叉数下界对所有图都成立。n≥3 且是简单图才成立，重边、自环要单独处理。\n<\/li><li>\n别以为有限域情形可以照搬实数域证明。&quot;序&quot;在有限域里不存在，必须换成代数方法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n平面图 n 个顶点最多有多少条边？（答案：3n−6，n≥3；解析：欧拉公式给出面数上界，再由每个面至少三条边推出。）\n<\/li><li>\nSzemerédi–Trotter 的 2/3 指数从哪里来？（答案：交叉数下界与关联上界的优化；解析：把每条线的关联数记为 d，交叉数约 Σd²，与 m−3n 比较后优化。）\n<\/li><li>\n为什么和积问题需要几何工具？（答案：加法结构对应斜线，乘法结构对应双曲线，冲突体现在交点数；解析：两种结构不能同时让关联数很小。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n关联 = 点落在线上；双重计数是核心手法。\n<\/li><li>\n交叉数下界 m−3n+6 来自欧拉公式。\n<\/li><li>\nS-T 界：|P|^{2/3}|L|^{2/3}+|P|+|L|。\n<\/li><li>\n实数域靠几何，有限域靠代数。\n<\/ul>", "ch09": "<h1>第 9 章：代数方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2、4 章；多项式与有限域基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n叙述组合零点定理，并说明&quot;系数非零&quot;这个条件为什么关键\n<\/li><li>\n用零点定理证明一个受限和集的大小下界\n<\/li><li>\n区分 Davenport 常数与 Kemnitz 猜想在问什么\n<\/li><li>\n解释 Stepanov 方法怎么把&quot;存在性&quot;变成&quot;多项式次数估计&quot;\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>在域上，加性集合可以看成多项式的零点集；用&quot;多项式的零点数受次数控制&quot;这一条，就能把组合问题变成次数比较。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：组合零点定理<\/h3>\n<p>设 F 是域，P 是 n 元多项式，次数不超过 Σ t_i，且 P 中 x₁^{t₁}...x_n^{t_n} 这一项的系数不为零。若 S₁,...,S_n 是 F 的子集且 |S_i| &gt; t_i，则存在 x_i ∈ S_i 使 P(x₁,...,x_n) ≠ 0。<\/p>\n<p><strong>直觉<\/strong>：如果 P 在所有格点 S₁×...×S_n 上都取零，那么它的&quot;最高次项&quot;必须被压掉，而系数非零恰好禁止这件事。<\/p>\n<p><strong>为什么条件这么严？<\/strong> 因为这是&quot;插值&quot;的精确版：在 |S_i| 个点上取零，相当于要求 P 被这些点定义的理想整除，次数不够就做不到。<\/p>\n<h3>概念 2：受限和集<\/h3>\n<p>受限和集是指形如 A ⊕ B = {a+b : a∈A, b∈B, a≠b} 的集合（禁止同元素相加）。<\/p>\n<p>Erdős–Heilbronn 猜想断言：在 ℤ/pℤ 里，|A ⊕ A| 至少是 min(p, 2|A|−3)。用组合零点定理可以给出 p 较大时的证明：构造一个多项式，它在所有&quot;和&quot;上取零，再用&quot;最高次项系数非零&quot;导出矛盾。<\/p>\n<p><strong>思路细节<\/strong>：把&quot;和不在某个集合里&quot;翻译成多项式在格点上非零，再数格点数量，与次数比较。<\/p>\n<h3>概念 3：Snevily 猜想<\/h3>\n<p>Snevily 猜想说：在奇特征的循环群里，给定两个大小相同的集合 A、B，存在一个置换 π 使所有 a+π(a) 互不相同。<\/p>\n<p>它等价于&quot;存在一个无重复的匹配&quot;。组合零点定理可以处理其中一部分情形（A、B 是区间或者有特殊结构时）。<\/p>\n<h3>概念 4：有限域与 Davenport 常数<\/h3>\n<p>Davenport 常数 D(G) 是最小的 k，使得 G 里任意 k 个元素（允许重复）都有一个非空子集和为 0。<\/p>\n<p>对 ℤ/nℤ，D = n。对 (ℤ/nℤ)^d，D 约为 n(1+log n)。这个常数在零和问题、代数数论里都出现。<\/p>\n<p>Kemnitz 猜想是它的二维版本：在 ℤ/nℤ 的平面格点里，最小的 k 使任意 k 个点都有子集和为零（模 n），猜想值是 4n−3。<\/p>\n<h3>概念 5：Stepanov 方法<\/h3>\n<p>要证&quot;某个集合很大&quot;，直接数很难。Stepanov 的办法是：构造一个次数不太高的多项式，它在集合的每个点上取零，然后用&quot;零点数 ≤ 次数&quot;反推集合大小上界（或下界）。<\/p>\n<p>它和零点定理是&quot;一枚硬币的两面&quot;：零点定理从&quot;非零&quot;推&quot;存在格点&quot;，Stepanov 从&quot;处处为零&quot;推&quot;次数必须大&quot;。<\/p>\n<h3>概念 6：分圆域与不确定性原理<\/h3>\n<p>分圆域是有理数域添加单位根得到的扩域，它的代数结构对应循环群的傅立叶分析。书里用它处理&quot;有限域上的加法结构&quot;。<\/p>\n<p>不确定性原理在这里的形式是：一个函数和它的傅立叶变换不能同时&quot;集中&quot;。离散版本就是&quot;集合小 ⟹ 谱大&quot;，与第 4 章的偏差分析同源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[多项式零点] --&gt; B[组合零点定理]\n    B --&gt; C[受限和集]\n    B --&gt; D[Snevily猜想]\n    E[零点数不超过次数] --&gt; F[Stepanov方法]\n    F --&gt; G[有限域和积]\n    H[分圆域] --&gt; I[不确定性原理]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多项式像一张&quot;有限次起伏的布&quot;，零点就是布贴到地面的位置。次数低，布起伏的次数少，贴地点就少。组合零点定理说：如果布在格点上全部贴地，而它本可以起伏到更高，说明它是&quot;假贴地&quot;，必有某个格点没贴。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只在一维直觉上成立，多维时&quot;次数&quot;要把每个变量的次数加起来。<\/p>\n<p><strong>实例<\/strong>：p = 7，A = {0,1,3} ⊂ ℤ/7ℤ。受限和 A ⊕ A = {1,3,4,0+?}：允许的组合是 0+1=1, 0+3=3, 1+3=4, 3+1=4, 1+0=1, 3+0=3，实际集合 {1,3,4}，大小 3。而 2|A|−3 = 3，正好达到下界。<\/p>\n<p>这个例子说明 Erdős–Heilbronn 的界在小集合时可以很紧。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为组合零点定理对任意环成立。它需要域，整环上&quot;零点数 ≤ 次数&quot;不总成立。\n<\/li><li>\n别以为系数非零是技术细节。去掉它，定理立刻变假，因为可以构造出在所有格点上为零但次数很低的例子。\n<\/li><li>\n别以为 Davenport 常数就是&quot;元素个数&quot;。它问的是&quot;任意 k 个元素&quot;，包括重复，和集合大小无关。\n<\/li><li>\n别以为 Stepanov 方法只能给上界。它常常被用来证明&quot;集合不能太小&quot;，方向取决于你把零点放在哪一侧。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n组合零点定理中，为什么要 |S_i| &gt; t_i？（答案：格点数量要超过次数上界，才能保证存在非零点；解析：若 |S_i| ≤ t_i，多项式可以在整个格点上取零而不违反次数限制。）\n<\/li><li>\nErdős–Heilbronn 猜想的值是多少？（答案：min(p, 2|A|−3)；解析：这是受限和集在 ℤ/pℤ 中的经典猜想下界。）\n<\/li><li>\nStepanov 方法的核心不等式是什么？（答案：零点数不超过多项式的次数；解析：这是域上多项式最基本的性质，方法就是把它反过来用。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n零点定理：次数 + 系数非零 ⟹ 格点上存在非零点。\n<\/li><li>\n受限和集与零和问题都靠多项式构造。\n<\/li><li>\nStepanov 用&quot;零点 ≤ 次数&quot;反推集合大小。\n<\/li><li>\n有限域没有序，只能靠代数。\n<\/ul>", "ch10": "<h1>第 10 章：k=3 的 Szemerédi 定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>预估学时<\/strong>：14 小时 | <strong>前置<\/strong>：第 4 章；第 2 章；一点测论\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n复述 Szemerédi 定理：正上密度的整数集包含任意长的等差数列\n<\/li><li>\n说清&quot;密度增量&quot;策略：假设没有 3 项等差数列，推出密度在某个子结构上变大\n<\/li><li>\n解释小挠情形与整数情形的分工\n<\/li><li>\n知道傅立叶方法在这里的角色，以及它为什么只能处理 k=3\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若 A 没有 3 项等差数列，则 A 在某个 Bohr 集上的密度必然比原来高；不断把密度往上推，最后超过 1，矛盾。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定理与历史<\/h3>\n<p>Szemerédi 定理：正整数集的子集 A 若有正上密度，则 A 包含任意长的等差数列。<\/p>\n<p>k=3 的情形最早由 Roth 在 1953 年用傅立叶方法证明。k=4 要等到 1969 年，Szemerédi 用了复杂的组合论证；一般 k 在 1975 年完成。<\/p>\n<p><strong>为什么 k=3 特别？<\/strong> 因为 3 项等差数列的结构可以用&quot;一个频率的偏差&quot;完全捕捉：a, a+d, a+2d 三项，中间项是两端的中点。傅立叶系数能直接检测这种&quot;中点关系&quot;。<\/p>\n<h3>概念 2：密度增量策略<\/h3>\n<p>假设 A ⊂ [1,N] 没有 3 项等差数列，密度为 δ。<\/p>\n<p>第一步：用傅立叶分析证明，若 A 没有 3 项等差数列，则存在一个频率 ξ 使 |Â(ξ)| 明显大（否则 A 太&quot;随机&quot;，必然出现等差数列）。<\/p>\n<p>第二步：把&quot;偏差大&quot;翻译成&quot;存在一个 Bohr 集 B，A 在 B 上的密度至少是 δ + c(δ)&quot;。<\/p>\n<p>第三步：把 B 当成新的环境（它是一个低维 GAP），在里面重新开始。<\/p>\n<p>第四步：每次密度至少增加 c(δ)，而密度不超过 1，所以迭代次数有界。迭代到尺度小于常数时，直接检查有限情形，矛盾。<\/p>\n<p><strong>关键点<\/strong>：每一步密度增量只依赖当前密度，不依赖 N。这是&quot;定量证明&quot;能给出显式界的原因。<\/p>\n<h3>概念 3：小挠情形<\/h3>\n<p>先在有限群 ℤ/Nℤ 里做，N 不大或者挠很小。这时 Bohr 集就是低维子群，密度增量可以直接算。<\/p>\n<p>&quot;小挠&quot;指群里没有太小的子群，避免 A 整个落在小子群里导致密度虚高。处理后可以假设群&quot;足够分散&quot;。<\/p>\n<h3>概念 4：整数情形<\/h3>\n<p>把 [1,N] 里的 A 通过&quot;提升&quot;（lifting）搬到 ℤ/Nℤ 或者一个大的循环群里。提升的技巧是把区间分成若干段，每段对应一个同余类。<\/p>\n<p>提升的好处是把&quot;区间&quot;变成&quot;群&quot;，坏处是密度会被稀释，需要在参数上补偿。<\/p>\n<h3>概念 5：定量界<\/h3>\n<p>Roth 的原始证明给出的是 log log N 量级的界；后来的改进把它推进到 (log N)^c 量级。Gowers 对 k≥4 给出了更差的界，但仍是显式的。<\/p>\n<p><strong>这些界意味着什么？<\/strong> 它们说明&quot;只要 N 足够大，任何密度为正的集合都必然含 3 项等差数列&quot;，但&quot;足够大&quot;可能大到无法实际检验。<\/p>\n<h3>概念 6：遍历论证<\/h3>\n<p>Furstenberg 用遍历理论重证了 Szemerédi 定理：把集合的平移看成动力系统，等差数列对应&quot;回归&quot;（recurrence）。这条路线不给出定量界，但结构清晰，后来发展出&quot;遍历方法&quot;这一整套工具。<\/p>\n<p>书里给出的是&quot;有限版本&quot;的遍历论证，用测论语言重述密度增量。<\/p>\n<h3>概念 7：正则引理与 Szemerédi 的组合证明<\/h3>\n<p>Szemerédi 正则引理：任意大的图都可以分成常数多块，块内边密度近似一致，块间近似随机。它是&quot;把图变得像随机图&quot;的工具。<\/p>\n<p>Szemerédi 的原始证明用它把集合分解成&quot;结构化部分 + 随机部分&quot;，结构化部分含等差数列，随机部分用计数处理。这条路线后来被推广成&quot;超图移除引理&quot;，是第 11 章的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[假设无三项AP] --&gt; B[傅立叶偏差]\n    B --&gt; C[Bohr集上密度增加]\n    C --&gt; D[迭代]\n    D --&gt; E[密度超过1 矛盾]\n    F[整数提升] --&gt; C\n    G[正则引理] --&gt; H[组合证明]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：想象你在一个池塘里捞鱼，假设&quot;没有三条鱼排成等距&quot;。每捞一次，你发现某个小区域里鱼的比例更高，于是把注意力集中到那个小区域再捞。区域越来越小，鱼的比例越来越高，最后超过 100%，说明假设不成立。<\/p>\n<p><strong>失效边界<\/strong>：池塘是有限的，而定理里的 N 可以任意大；类比里&quot;区域&quot;是空间，定理里是 Bohr 集（频率空间）。<\/p>\n<p><strong>实例<\/strong>：取 A 为 [1,10] 里的 {1,2,4,5,7,8,10}，密度 0.7。它含 3 项等差数列吗？1,4,7 是；2,5,8 是。取一个刻意避开等差数列的集合，比如 {1,2,4,8}（密度 0.4），没有 3 项等差数列。但 N 再大一些，这种&quot;稀疏构造&quot;就维持不住了。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为密度增量每步增加一个固定常数。增量依赖当前密度 δ，δ 越大概率增量越小。\n<\/li><li>\n别以为傅立叶方法能直接推到 k≥4。三项等差数列是&quot;中点关系&quot;，可以用一个频率检测；四项及以上需要高阶结构。\n<\/li><li>\n别以为遍历论证给出了可用界。它只证存在，不给定量估计。\n<\/li><li>\n别以为正则引理只用于图论。它是&quot;分解结构&quot;的通用工具，在加性组合里也有对应版本。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSzemerédi 定理的结论是什么？（答案：正上密度的整数集包含任意长的等差数列；解析：注意是&quot;任意长&quot;，不是某个固定长度。）\n<\/li><li>\n密度增量策略为什么能终止？（答案：密度每次至少增加 c(δ)，且有上界 1；解析：迭代次数由 δ 决定，与 N 无关。）\n<\/li><li>\n为什么 k=3 可以用傅立叶，k=4 不行？（答案：3 项 AP 是两点中点关系，线性相位可检测；4 项需要二阶结构；解析：Gowers 范数 U^3 才能捕捉 4 项 AP。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n定理：正密度 ⟹ 任意长 AP。\n<\/li><li>\n策略：无 AP ⟹ 有偏差 ⟹ Bohr 集上密度增加 ⟹ 迭代矛盾。\n<\/li><li>\n界是显式的但很弱。\n<\/li><li>\nk=3 用线性傅立叶，k≥4 要换工具。\n<\/ul>", "ch11": "<h1>第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★★ | <strong>预估学时<\/strong>：16 小时 | <strong>前置<\/strong>：第 4、10 章；一点高阶傅立叶\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 Gowers 范数 U^k 的定义，说明它为什么是&quot;高阶傅立叶&quot;\n<\/li><li>\n区分&quot;硬障碍&quot;和&quot;软障碍&quot;，知道它们分别对应什么结构\n<\/li><li>\n说清超图移除引理在证明中的位置\n<\/li><li>\n解释 Green–Tao 定理与本章的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性傅立叶只能看见&quot;一个方向上的偏差&quot;，k≥4 的等差数列需要 k−1 阶的均匀性；Gowers 范数就是衡量&quot;高阶均匀性&quot;的尺子。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么线性傅立叶不够<\/h3>\n<p>3 项等差数列 a, a+d, a+2d 的核心是&quot;a 和 a+2d 的中点是 a+d&quot;，这是一条线性关系，一个频率就能检测。<\/p>\n<p>4 项等差数列 a, a+d, a+2d, a+3d 涉及&quot;二阶差分&quot;：相邻差相同。要检测这种&quot;差分的差分&quot;，需要二阶的相位，也就是 Gowers 范数 U^3。<\/p>\n<p>更一般地，k 项等差数列需要 U^{k−1}。<\/p>\n<h3>概念 2：Gowers 范数<\/h3>\n<p>对函数 f: Z → ℂ，U^k 范数定义为<\/p>\n<p>‖f‖_{U^k}^{2^k} = 对 x, h₁,...,h_k 求平均，f(x) 与 f(x+h₁)...f(x+h₁+...+h_k) 的乘积的复共轭组合。<\/p>\n<p>这个定义看起来吓人，但结构很清楚：k=1 时它就是普通的 L² 范数；k=2 时它等价于傅立叶系数的四阶矩；k 越大，检测的是&quot;越高阶的差分&quot;。<\/p>\n<p><strong>直觉<\/strong>：U^k 小 ⟹ 函数在所有 k 阶结构上都&quot;均匀&quot; ⟹ 不含 k+1 项等差数列。<\/p>\n<h3>概念 3：硬障碍与软障碍<\/h3>\n<p>&quot;障碍&quot;指让函数在 U^k 范数下不小的结构。<\/p>\n<ul><li>\n<strong>硬障碍<\/strong>：真正的高阶结构，比如函数落在一个低维 GAP 上，或者是一个多项式相位 e(P(x))。这类障碍必须被&quot;识别&quot;出来，才能继续做密度增量。\n<\/li><li>\n<strong>软障碍<\/strong>：不是真正的结构，只是傅立叶系数在少数频率上偏大，比如函数带了一个线性相位。这类障碍可以通过&quot;除掉相位&quot;消除。\n<\/ul>\n<p>Gowers 逆定理说：U^k 范数大 ⟹ 函数可以被一个&quot;低复杂度的多项式相位&quot;解释。这是本章最深的定理，证明用了超图移除和复杂的组合论证。<\/p>\n<h3>概念 4：Gowers 逆定理<\/h3>\n<p>粗略表述：若 ‖f‖_{U^k} 明显大于随机水平，则存在一个次数不超过 k−1 的多项式相位 φ，使得 f 与 e(φ) 的相关性很大。<\/p>\n<p>也就是说，<strong>高阶均匀性失败，必然有一个低次多项式在&quot;作怪&quot;<\/strong>。这解释了为什么 k 项等差数列的结构总是&quot;多项式型&quot;的。<\/p>\n<h3>概念 5：超图移除引理<\/h3>\n<p>超图是&quot;边可以是任意大小子集&quot;的图。超图移除引理说：若一个超图包含很多&quot;完全子超图&quot;（比如所有 k+1 元组），则可以删掉少量边把所有完全子超图都破坏掉。<\/p>\n<p>它在证明里的作用：把&quot;函数在某个结构上不平&quot;转化为&quot;存在一个超图，其完全子图数量异常&quot;，再用移除引理得到矛盾。<\/p>\n<h3>概念 6：遍历方法与无限版本<\/h3>\n<p>和 k=3 一样，k&gt;3 也有遍历版本。Furstenberg–Katznelson 用遍历理论证明了高维版本的 Szemerédi 定理。这条路线不给出定量界，但把&quot;等差数列&quot;与&quot;动力系统的回归&quot;对应起来，启发了后来的很多工作。<\/p>\n<h3>概念 7：素数中的等差数列<\/h3>\n<p>Green–Tao 定理（2004）：素数集包含任意长的等差数列。<\/p>\n<p>素数集的密度是 0，Szemerédi 定理不能直接用。证明的思路是：<\/p>\n<ol><li>\n用一个&quot;伪随机&quot;的权重函数模拟素数（筛法）。\n<\/li><li>\n证明这个权重函数在 Gowers 范数下是均匀的（相对某个稠密模型）。\n<\/li><li>\n对稠密模型用 Szemerédi 定理，再把结论搬回素数。\n<\/ol>\n<p>这就是&quot;转移原理&quot;（transference principle）：先在一个稠密、均匀的模型里证，再转移到稀疏集合。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[线性傅立叶] --&gt; B[只能看 k=3]\n    B --&gt; C[Gowers范数 U^k]\n    C --&gt; D[硬障碍]\n    C --&gt; E[软障碍]\n    D --&gt; F[Gowers逆定理]\n    F --&gt; G[多项式相位]\n    G --&gt; H[超图移除]\n    H --&gt; I[Szemeredi k&gt;3]\n    I --&gt; J[Green-Tao 素数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：U^1 像用放大镜看一条线的&quot;整体斜率&quot;，U^2 像看&quot;斜率的变化率&quot;，U^3 像看&quot;变化率的变化率&quot;。k 越大，看的层次越深，越能发现&quot;看起来随机、其实有高阶规律&quot;的结构。<\/p>\n<p><strong>失效边界<\/strong>：放大镜类比只给一维直觉，实际 U^k 是 2^k 个变量的平均，维度随 k 指数增长。<\/p>\n<p><strong>实例<\/strong>：取 f 是区间上的指示函数。它的 U^2 范数反映傅立叶系数的四阶矩，也就是 A+A 的表示次数；U^3 范数反映 4 项等差数列的密度。一个集合可以在 U^2 下均匀（没有线性偏差），但在 U^3 下不均匀（含很多 4 项等差数列），这正是 k=4 需要新工具的原因。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Gowers 范数是&quot;傅立叶系数的简单推广&quot;。它是高阶的平均，计算复杂度随 k 指数增长。\n<\/li><li>\n别以为逆定理给出了完整刻画。它只说&quot;存在一个多项式相位&quot;，不保证唯一，也不保证次数最优。\n<\/li><li>\n别以为 Green–Tao 直接用了 Szemerédi 定理。素数密度为零，必须先做转移。\n<\/li><li>\n别以为 k 越大证明只是&quot;更难一点&quot;。难度是指数级增长的，定量界也急剧变差。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nk 项等差数列需要哪个阶的 Gowers 范数？（答案：U^{k−1}；解析：k 项 AP 对应 k−1 阶差分结构。）\n<\/li><li>\n硬障碍和软障碍的区别是什么？（答案：硬障碍是真正的高阶结构，软障碍只是线性相位造成的形式偏差；解析：软障碍可以除掉相位消除，硬障碍必须识别。）\n<\/li><li>\nGreen–Tao 定理的核心技术是什么？（答案：转移原理，用稠密均匀模型模拟素数；解析：素数密度为零，不能直接套 Szemerédi。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性傅立叶管 k=3，k≥4 要 U^{k−1}。\n<\/li><li>\nU^k 小 ⟹ 高阶均匀 ⟹ 含长 AP。\n<\/li><li>\n逆定理：不均匀 ⟹ 有低次多项式相位。\n<\/li><li>\n素数靠转移原理。\n<\/ul>", "ch12": "<h1>第 12 章：和集中的长等差数列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2、4、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清&quot;和集比原集合更有结构&quot;这句话的定量含义\n<\/li><li>\n解释为什么 lA 随 l 增大，越来越像等差数列\n<\/li><li>\n区分完全序列与次完全序列\n<\/li><li>\n知道这些结果在 Waring 问题里的用法\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>A+A 一定比 A 更&quot;规整&quot;；重复相加的次数越多，得到的 lA 里包含的等差数列越长，长到只依赖 A 的密度和 l，而不依赖 A 的具体形状。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：和集的&quot;结构增益&quot;<\/h3>\n<p>第 4 章已经给出一个结论：若 A 没有明显的傅立叶偏差，则 lA 很快填满整个群。<\/p>\n<p>本章把这个现象量化：即使 A 有偏差，只要 |A| 相对群足够大，lA 里也一定含长等差数列。<\/p>\n<p><strong>为什么？<\/strong> 因为加法是&quot;平滑&quot;运算：两个集合相加，重复的表示会被合并，结果是&quot;值域变宽但结构更密&quot;。重复多次，A 的局部不规则性被平均掉，剩下的只有全局的等差结构。<\/p>\n<h3>概念 2：主要结论的形状<\/h3>\n<p>定理大意：若 A ⊂ [1,N] 且 |A| ≥ αN，则对适当的 l，lA 包含长度至少 N^{c(α, l)} 的等差数列。<\/p>\n<p>长度是幂次的，不是对数的。这和 Szemerédi 定理形成对比：Szemerédi 处理的是 A 本身，只能保证长度极短（log 级别）；和集把长度提升到幂次级别。<\/p>\n<p><strong>代价<\/strong>：结论说的是 lA，不是 A。lA 比 A 大得多，里面的大部分元素不是 A 的元素。<\/p>\n<h3>概念 3：完全序列与次完全序列<\/h3>\n<p>一个序列 a₁ &lt; a₂ &lt; ... 是完全的，指每个足够大的整数都能表示成若干项之和（每项最多用一次）。次完全序列允许&quot;每个整数都能表示，但项数有界&quot;。<\/p>\n<p>完全性的判定和&quot;部分和序列的密度&quot;有关：如果部分和集合在区间里足够密，就能覆盖所有整数。<\/p>\n<p><strong>例子<\/strong>：2 的幂序列是次完全的（二进制表示），但不是完全的（只能表示到某个范围，因为每项最多一次，和有限）。<\/p>\n<h3>概念 4：证明的骨架<\/h3>\n<p>证明分三步：<\/p>\n<ol><li>\n把 A 的加法结构&quot;摊平&quot;：用傅立叶或者组合方法找一个大的子集 A&#x27;，它在某个 GAP 里分布均匀。\n<\/li><li>\n在 A&#x27; 上构造长等差数列：用 GAP 的坐标把等差数列变成&quot;每个坐标上的等差数列&quot;，再用多维的 Szemerédi 或者直接构造。\n<\/li><li>\n把 A&#x27; 里的等差数列&quot;提升&quot;回 lA：用多次相加把坐标差补齐。\n<\/ol>\n<p>第三步是技术核心：需要保证补差用的元素仍在 A 里，且用的次数受 l 控制。<\/p>\n<h3>概念 5：与 Waring 问题的联系<\/h3>\n<p>Waring 问题问：每个正整数能否表示成至多 s 个 k 次幂之和。<\/p>\n<p>用和集的语言：令 A 是 k 次幂的集合，问 sA 是否覆盖所有整数。本章的长等差数列结果给出&quot;lA 含长等差数列&quot;，再配合&quot;局部覆盖&quot;和&quot;周期性&quot;论证，可以推出 Waring 型结论。<\/p>\n<p>书里用这套工具重新证明了&quot;薄基&quot;的存在性（第 1 章已经用概率方法给过一次）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; B[A+A]\n    B --&gt; C[lA]\n    C --&gt; D[长等差数列]\n    D --&gt; E[Waring型结论]\n    F[完全序列] --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把 A 想成一把沙子，A+A 是把沙子筛一遍，lA 是反复筛。每筛一次，粗细颗粒被分开，剩下的越来越均匀。最后得到的不是原来的沙子，而是一堆&quot;按粒径排好&quot;的沙堆。<\/p>\n<p><strong>失效边界<\/strong>：筛沙子会丢失物质，和集不会；类比只能说明&quot;越来越规整&quot;，不能说明&quot;元素变多&quot;。<\/p>\n<p><strong>实例<\/strong>：A = {0,1,...,n−1}。A+A = [0,2n−2]，2A+A = [0,3n−3]，kA = [0,kn−k]，本身就是等差数列，长度随 k 线性增长。<\/p>\n<p>再取 A = {0,1,2,4,5,6,...}（去掉 3 的倍数），A+A 里会出现更长的连续段，因为不同的表示把缺口填上了。这就是&quot;结构增益&quot;的最直观例子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 lA 含长等差数列就意味着 A 也有。lA 大得多，结论不能反推回 A。\n<\/li><li>\n别以为完全序列等价于&quot;密度大&quot;。完全性是关于&quot;能否表示每个整数&quot;，和密度不是一回事。\n<\/li><li>\n别以为这套结果只是 Waring 问题的工具。它也是&quot;和集结构&quot;的一般理论，对很多加性问题有用。\n<\/li><li>\n别以为长度界可以做到线性。幂次界的指数依赖密度和 l，通常很小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n为什么 lA 比 A 更容易含长等差数列？（答案：多次相加把局部不规则性平均掉，值域变宽且结构更密；解析：重复表示的合并使结果更规整。）\n<\/li><li>\n完全序列和次完全序列的区别是什么？（答案：完全序列每项最多用一次就能表示所有足够大的整数，次完全允许有限项数；解析：二进制表示是次完全但不是完全。）\n<\/li><li>\n本章结论与 Szemerédi 定理的主要差别是什么？（答案：本章说的是 lA，长度是幂次级；Szemerédi 说的是 A 本身，长度是 log 级；解析：和集提升了结构强度。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加法是平滑运算，lA 越大越规整。\n<\/li><li>\n结论：lA 含幂次长度的等差数列。\n<\/li><li>\n完全性看&quot;能否表示所有整数&quot;，不看密度。\n<\/li><li>\nWaring 问题是这套工具的直接应用。\n<\/ul>", "c01": "<h1>加性集与和集<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 0、2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>加性集是一对 (A, Z)：Z 是交换群，A 是 Z 的有限非空子集；和集 A+B 是所有 a+b 的集合。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是全书的原子概念。所有&quot;结构强弱&quot;的判断，最终都落在 |A+B| 与 |A|、|B| 的比较上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; C[A+B]\n    B[集合B] --&gt; C\n    C --&gt; D[大小比较]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>同一个集合放在不同的环境群里，和集可以完全不同。{1,2,3} 在整数里 A+A 有 5 个元素，在模 3 群里只有 3 个。所以讨论和集必须先说清群。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 A+B 的大小只由 |A|、|B| 决定。它主要由两者的加法关系决定。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 0 章<\/td><td>定义<\/td><td>加性集必须带环境群<\/td><\/tr><tr><td>第 2 章<\/td><td>估计<\/td><td><\/td><td>A+B<\/td><td>小会牵动<\/td><td>A−B<\/td><td><\/td><\/tr><tr><td>第 12 章<\/td><td>迭代<\/td><td>lA 越大越规整<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">倍增常数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>\n<\/ul>", "c02": "<h1>倍增常数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>σ[A] = |A+A| / |A|，衡量 A 在加法下膨胀了多少倍。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书的结构温度计。σ 接近 1 说明 A 几乎对加法封闭；σ 接近 |A| 说明 A 在加法上接近随机。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[sigma 接近1] --&gt; B[子群或陪集]\n    A --&gt; C[sigma 小于3]\n    C --&gt; D[子群加小扰动]\n    C --&gt; E[低秩GAP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>σ 小到什么程度决定能推出什么结构：σ&lt;2 或 &lt;3 时可以完全刻画；σ=O(log|A|) 时靠 Freiman 定理给出 GAP；σ=|A|^ε 时只能给近似子群。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 σ 小就是等差数列。低秩 GAP、子群加扰动都满足小 σ，形状比等差数列宽。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>定义与估计<\/td><td>σ 控制各类和集<\/td><\/tr><tr><td>第 5 章<\/td><td>逆向<\/td><td>σ 小 ⟹ 低秩结构<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Ruzsa 距离<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Freiman 同态与 GAP<\/a>\n<\/ul>", "c03": "<h1>Ruzsa 距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>d(A,B) = log( |A−B| / √(|A||B|) )，是加性集之间的一个度量。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;和集小&quot;转成&quot;两个集合在度量意义下很近&quot;，于是可以用三角不等式在多个集合之间传递信息。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[A与B接近] --&gt; B[差集小]\n    B --&gt; C[三角不等式]\n    C --&gt; D[传递结构]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>选差集而不是和集，是因为差集有对称性，且 A−A 总包含 0，度量性质更好证。d=0 只说明 |A−B| 达到 √(|A||B|)，不说明两个集合相等。<\/p>\n<h2>常见误解<\/h2>\n<p>别把它当普通距离。它是对数尺度，且只反映大小，不反映元素位置。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>度量构造<\/td><td>三角不等式成立<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">倍增常数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">覆盖引理<\/a>\n<\/ul>", "c04": "<h1>加性能量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>E(A,B) = #{(a,b,a&#x27;,b&#x27;) : a+b = a&#x27;+b&#x27;}，数&quot;同一个和有多少种表示&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>能量是&quot;和集小&quot;的定量版本。能量大意味着表示密集，进而意味着存在大子集结构好（BSG）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[能量大] --&gt; B[表示多]\n    B --&gt; C[和集小]\n    C --&gt; D[BSG]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>下界 E ≥ |A|²|B|²/|A+B| 由柯西不等式得到。傅立叶形式 E(A,A) = Σ|Â(ξ)|⁴，把能量和谱的集中程度挂钩。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为能量大等于整个集合结构好。BSG 只能保证一个大子集结构好，少数例外元素可以很乱。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>定义<\/td><td>能量与和集互为表里<\/td><\/tr><tr><td>第 4 章<\/td><td>傅立叶<\/td><td>E = Σ<\/td><td>Â<\/td><td>⁴<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">BSG 定理<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">傅立叶系数<\/a>\n<\/ul>", "c05": "<h1>覆盖引理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若 |A+B| ≤ K|B|，则存在 A&#x27; ⊂ A，|A&#x27;| ≤ K，使 A 被 A&#x27;+B−B 覆盖（Ruzsa 版本）。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;整个集合&quot;的问题降成&quot;骨架&quot;的问题，是几乎所有结构证明的第一步。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[和集小] --&gt; B[骨架A&#x27;]\n    B --&gt; C[平移覆盖]\n    C --&gt; D[局部化]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>覆盖不是相等：A 可能比骨架大得多，只是每个元素都能写成 a&#x27;+b−b&#x27; 的形式。这样后续只需控制骨架，代价是引入差集。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为骨架就是 A 的结构。骨架可能仍然很复杂，覆盖只是给了个&quot;坐标系统&quot;。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>Ruzsa 覆盖<\/td><td>骨架大小为 K<\/td><\/tr><tr><td>第 5 章<\/td><td>Chang 覆盖<\/td><td>谱意义下的覆盖<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Ruzsa 距离<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">BSG 定理<\/a>\n<\/ul>", "c06": "<h1>Balog–Szemerédi–Gowers 定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2、6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若加性能量接近最大，则存在 A&#x27;⊂A、B&#x27;⊂B，两者只损失常数因子，且 |A&#x27;+B&#x27;| 只比 |B&#x27;| 大常数倍。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;能量大 ⟹ 有结构&quot;的转换器，全书使用频率最高的工具之一。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[能量大] --&gt; B[大子集A&#x27;]\n    A --&gt; C[大子集B&#x27;]\n    B --&gt; D[和集小]\n    C --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>证明有两条路线：一条用图论（二分图的连通性），一条用依赖随机变量。结论里的&quot;常数倍&quot;依赖初始的 K，通常增长很快。<\/p>\n<h2>常见误解<\/h2>\n<p>别指望它给出整个 A 的结构。它天生要损失子集，这是定理的形式决定的。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>陈述<\/td><td>能量转结构<\/td><\/tr><tr><td>第 6 章<\/td><td>图论证明<\/td><td>连通性抽取<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>、Plünnecke 不等式（见第 6 章）\n<\/ul>", "c07": "<h1>Freiman 同态与广义等差数列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Freiman 同态是保持加法关系 a₁+a₂=a₃+a₄ 的映射；GAP 是 a + [0,N₁]·v₁ + ... + [0,N_d]·v_d 形式的集合。<\/p>\n<h2>为什么重要<\/h2>\n<p>Freiman 定理的结论就是&quot;小倍增集合落在低秩 GAP 里&quot;，而 Freiman 同态是把不同外观的集合统一起来的工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[小倍增] --&gt; B[Freiman定理]\n    B --&gt; C[低秩GAP]\n    C --&gt; D[真化]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>GAP 的秩是方向个数，体积上界是 ∏(N_i+1)。真 GAP 指元素个数达到上界，非真会塌缩，需要真化才能做计数。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 GAP 的秩等于环境群维数。秩可以远小于维数，这是结构压缩的关键。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>定义<\/td><td>体积与真化<\/td><\/tr><tr><td>第 5 章<\/td><td>结构定理<\/td><td>小倍增 ⟹ GAP<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">倍增常数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">覆盖引理<\/a>\n<\/ul>", "c08": "<h1>傅立叶系数与线性偏差<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Â(ξ) = Σ_{a∈A} ξ(a) 是 A 在频率 ξ 上的投影；Â(ξ) 大就说 A 在该频率上有线性偏差。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把加法问题转成频率问题：卷积变乘法，能量变系数的四阶矩。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; B[傅立叶系数]\n    B --&gt; C[卷积定理]\n    C --&gt; D[和集估计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>Parseval 给出能量守恒，卷积定理给出 (1_A * 1_B)̂ = Â·B̂。偏差大意味着 A 在某个圆周相位上分布不均，通常对应一条等差结构。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为偏差大就一定有等差数列。偏差只说明&quot;偏向某频率&quot;，结构形状可能更复杂。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>基础<\/td><td>卷积与 Parseval<\/td><\/tr><tr><td>第 10 章<\/td><td>密度增量<\/td><td>无 AP ⟹ 有偏差<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Bohr 集<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>\n<\/ul>", "c09": "<h1>Bohr 集<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4、10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>B(Δ,ρ) = {x : 对所有 ξ∈Δ，|ξ(x)−1| ≤ ρ}，是若干频率上同时接近 1 的元素的集合。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;多频率偏差&quot;对应的几何结构，也是密度增量论证里&quot;密度变高的那个子结构&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[频率集合] --&gt; B[Bohr集]\n    B --&gt; C[子群或低维GAP]\n    C --&gt; D[密度增量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>在循环群里，Bohr 集可以看成&quot;多条同余条件的交集&quot;。它的&quot;维数&quot;由频率集合的大小决定，体积由半径 ρ 和频率结构共同决定。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 Bohr 集一定等于 GAP。两者在特定条件下对应，一般只是&quot;低复杂度的子群&quot;。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>定义<\/td><td>与 GAP 对偶<\/td><\/tr><tr><td>第 10 章<\/td><td>增量<\/td><td>密度在 Bohr 集上增加<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">傅立叶系数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Szemerédi 正则引理<\/a>\n<\/ul>", "c10": "<h1>Littlewood–Offord 集中<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>给 d 个步长，问 2^d 个带符号和最多能有多少个相同；逆问题问若很多相同，步长必须长什么样。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;加法关系密集&quot;翻译成&quot;步长落在低秩结构里&quot;，是随机矩阵奇异概率估计的关键。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[步长向量] --&gt; B[带符号和]\n    B --&gt; C[最大重数]\n    C --&gt; D[逆定理]\n    D --&gt; E[低秩GAP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>步长全为 1 时最大重数约 2^d/√d；步长为 2 的幂时最大重数 1。Esséen 不等式用平方和控制集中度，逆定理用 Freiman 型结构刻画&quot;集中&quot;。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为集中只由&quot;重复步长&quot;造成。整数线性关系才是主因。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>正问题<\/td><td>组合数与傅立叶两种界<\/td><\/tr><tr><td>第 7.5 节<\/td><td>应用<\/td><td>随机矩阵奇异概率<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Gowers 范数<\/a>\n<\/ul>", "c11": "<h1>Gowers 范数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>U^k 范数是 2^k 个变量上的平均，衡量函数在 k 阶差分结构上是否均匀。<\/p>\n<h2>为什么重要<\/h2>\n<p>k 项等差数列由 U^{k−1} 控制；它把&quot;高阶均匀性&quot;变成一个可计算的量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[U1 L2范数] --&gt; B[U2 傅立叶四阶矩]\n    B --&gt; C[U3 四项AP]\n    C --&gt; D[Un 长AP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>U^1 就是普通 L²；U^2 等价于傅立叶系数的四阶矩；U^3 才能检测 4 项等差数列。逆定理说：范数大 ⟹ 存在低次多项式相位。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为它是傅立叶系数的简单推广。计算复杂度随 k 指数增长。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章<\/td><td>定义<\/td><td>高阶均匀性<\/td><\/tr><tr><td>第 11.4 节<\/td><td>逆定理<\/td><td>多项式相位<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">傅立叶系数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Szemerédi 定理<\/a>\n<\/ul>", "c12": "<h1>Szemerédi 正则引理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>任意大图都可以分成常数多块，使块内边密度近似一致、块间近似随机。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;任意图&quot;变成&quot;随机图 + 少量例外&quot;，是 Szemerédi 组合证明的核心分解工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[任意图] --&gt; B[分块]\n    B --&gt; C[块内均匀]\n    B --&gt; D[块间随机]\n    C --&gt; E[结构部分]\n    D --&gt; F[随机部分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>分块数量只依赖误差参数 ε，不依赖图的规模。每块大小可以很不均匀，这是&quot;正则&quot;的含义：不是块大小相等，而是边密度规则。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为引理给出的是&quot;等分&quot;。它只保证密度规则，块大小可以差很多。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10.6 节<\/td><td>陈述<\/td><td>图的正则分解<\/td><\/tr><tr><td>第 10.7 节<\/td><td>应用<\/td><td>Szemerédi 组合论证<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Gowers 范数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Bohr 集<\/a>\n<\/ul>", "c13": "<h1>组合零点定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若多项式次数不超过 Σt_i，且最高次项系数非零，则在足够大的格点集 S₁×...×S_n 上必存在非零点。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;存在某个组合&quot;变成&quot;多项式系数不为零&quot;，是有限域上加性问题的标准武器。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[多项式] --&gt; B[最高次项系数]\n    B --&gt; C[格点非零]\n    C --&gt; D[受限和集下界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>条件 |S_i|&gt;t_i 保证格点数量超过次数上界；系数非零保证多项式不能在格点上&quot;假装为零&quot;。去掉任一条件定理都不成立。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为它对整环成立。需要域，&quot;零点数 ≤ 次数&quot;才可靠。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9.1 节<\/td><td>陈述<\/td><td>零点定理<\/td><\/tr><tr><td>第 9.2 节<\/td><td>应用<\/td><td>受限和集<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">和积问题<\/a>\n<\/ul>", "c14": "<h1>和积问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、8、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>问集合 A 的加法和集 |A+A| 与乘法积集 |A·A| 能否同时很小；猜想是不能。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;加法结构与乘法结构互斥&quot;的定量表达，连接加性组合、几何与代数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[加法结构强] --&gt; C[乘法结构弱]\n    B[乘法结构强] --&gt; C\n    C --&gt; D[和积下界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>实数域用关联几何（斜线与双曲线的交点），有限域用组合零点定理或 Stepanov 方法。两条路线的结论形式相似，指数不同。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为和积估计给出了精确值。它只给 max(|A+A|,|A·A|) 的下界，且指数通常很小。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2.8 节<\/td><td>初等估计<\/td><td>幂次下界<\/td><\/tr><tr><td>第 8.3 节<\/td><td>几何证明<\/td><td>关联方法<\/td><\/tr><tr><td>第 9 章<\/td><td>有限域<\/td><td>代数方法<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">组合零点定理<\/a>、关联几何（见第 8 章）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：建立坐标：加性集、和集、倍增常数<\/strong><br>阅读：<a href=\"#/chapter/ch00\">第 0 章：导论<\/a><br>检查点：能说出 σ 的三种典型取值对应什么结构<\/li><li class='path-step' id='path-02'><strong>步骤 02：概率工具箱<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：概率方法<\/a><br>检查点：能用一阶矩独立证明一个存在性结论<\/li><li class='path-step' id='path-03'><strong>步骤 03：和集估计与能量<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：和集估计<\/a><br>检查点：能写出能量下界并说明 BSG 的用途<\/li><li class='path-step' id='path-04'><strong>步骤 04：几何直觉：GAP 与凸体<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：加性几何<\/a><br>检查点：能算出一个低秩 GAP 的体积并判断真伪<\/li><li class='path-step' id='path-05'><strong>步骤 05：换到频率空间<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：傅立叶分析方法<\/a><br>检查点：能用卷积定理推出一个和集估计<\/li><li class='path-step' id='path-06'><strong>步骤 06：逆向：小倍增的结构<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：逆和集定理<\/a><br>检查点：能复述 Freiman 定理并说明有挠时的处理<\/li><li class='path-step' id='path-07'><strong>步骤 07：图论工具箱<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：图论方法<\/a><br>检查点：能用 Turán 定理估计一个无和集<\/li><li class='path-step' id='path-08'><strong>步骤 08：集中度：Littlewood–Offord<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：Littlewood–Offord 问题<\/a><br>检查点：能区分正向与逆向问题<\/li><li class='path-step' id='path-09'><strong>步骤 09：几何与代数的两套手法<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：关联几何<\/a><br>检查点：能说出 S-T 定理的指数来源<\/li><li class='path-step' id='path-10'><strong>步骤 10：有限域上的多项式方法<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：代数方法<\/a><br>检查点：能写出零点定理的完整条件<\/li><li class='path-step' id='path-11'><strong>步骤 11：密度增量：k=3<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：k=3 的 Szemerédi 定理<\/a><br>检查点：能讲清四步迭代为什么终止<\/li><li class='path-step' id='path-12'><strong>步骤 12：高阶均匀性：k&gt;3<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数<\/a><br>检查点：能说清为什么 k=4 需要 Gowers 范数<\/li><li class='path-step' id='path-13'><strong>步骤 13：和集的结构增益<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：和集中的长等差数列<\/a><br>检查点：能对比本章与 Szemerédi 的长度差别<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='all-q1' data-type='single'><p class='quiz-q'><b>Q40.<\/b> BSG 定理在整本书里的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q1' value='0'> 把能量大转成存在结构好的子集<\/label><label class='quiz-opt'><input type='radio' name='all-q1' value='1'> 把和集小直接转成子群<\/label><label class='quiz-opt'><input type='radio' name='all-q1' value='2'> 把偏差转成 Bohr 集<\/label><label class='quiz-opt'><input type='radio' name='all-q1' value='3'> 把稀疏集合转成稠密集合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q2' data-type='single'><p class='quiz-q'><b>Q41.<\/b> 为什么 k=4 的 Szemerédi 定理不能用线性傅立叶证明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q2' value='0'> 线性傅立叶只能检测一阶的中点结构<\/label><label class='quiz-opt'><input type='radio' name='all-q2' value='1'> 傅立叶变换在整数上不成立<\/label><label class='quiz-opt'><input type='radio' name='all-q2' value='2'> 四项等差数列根本不存在<\/label><label class='quiz-opt'><input type='radio' name='all-q2' value='3'> 傅立叶计算太慢<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q3' data-type='single'><p class='quiz-q'><b>Q42.<\/b> Freiman 定理与逆 Littlewood–Offord 的共同点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q3' value='0'> 都用傅立叶分析<\/label><label class='quiz-opt'><input type='radio' name='all-q3' value='1'> 都能给出集合的精确形状<\/label><label class='quiz-opt'><input type='radio' name='all-q3' value='2'> 都给出低秩 GAP 型结构<\/label><label class='quiz-opt'><input type='radio' name='all-q3' value='3'> 都只适用于有限域<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q4' data-type='single'><p class='quiz-q'><b>Q43.<\/b> 实数域与有限域上的和积证明，方法差异是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q4' value='0'> 都用关联几何<\/label><label class='quiz-opt'><input type='radio' name='all-q4' value='1'> 都用组合零点定理<\/label><label class='quiz-opt'><input type='radio' name='all-q4' value='2'> 都用概率方法<\/label><label class='quiz-opt'><input type='radio' name='all-q4' value='3'> 实数域用几何，有限域用代数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q5' data-type='single'><p class='quiz-q'><b>Q44.<\/b> Szemerédi 正则引理的作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q5' value='0'> 估计素数密度<\/label><label class='quiz-opt'><input type='radio' name='all-q5' value='1'> 把任意图分解为均匀块加随机部分<\/label><label class='quiz-opt'><input type='radio' name='all-q5' value='2'> 直接构造长等差数列<\/label><label class='quiz-opt'><input type='radio' name='all-q5' value='3'> 证明 Parseval 恒等式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q6' data-type='single'><p class='quiz-q'><b>Q45.<\/b> Green–Tao 定理为什么不能直接使用 Szemerédi 定理？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q6' value='0'> 素数集不含等差数列<\/label><label class='quiz-opt'><input type='radio' name='all-q6' value='1'> 素数集的密度为零，密度定理不适用<\/label><label class='quiz-opt'><input type='radio' name='all-q6' value='2'> 素数集太大<\/label><label class='quiz-opt'><input type='radio' name='all-q6' value='3'> Szemerédi 定理只对有限群成立<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch00__": "<h1>测验：第 0 章：导论<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> σ[A]=1 意味着什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> A 是空集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> A 是子群或它的陪集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> A 一定是等差数列<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> A 的倍增最大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 等比数列 {1,2,4,…,2^{n−1}} 的 σ 约为多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> n/2<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> n²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 讨论和集之前必须先明确什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 环境群<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 集合的基数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 元素的大小顺序<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 元素的奇偶性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：概率方法<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 X 是非负整数值随机变量且 E X&lt;1，能推出什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 存在一个样本使 X=0<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 所有样本都有 X=0<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> E X=0<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> X 恒等于 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Chernoff 界是对哪个量使用 Markov 不等式得到的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> X<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> e^{tX}<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> X²<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> log X<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Lovász 局部引理条件 e·p·(d+1)≤1 里的 d 指什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 坏事件的总数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 环境群的维数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 每个坏事件的相关事件数上限<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 随机变量的个数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：和集估计<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Ruzsa 距离是用哪一类集合定义的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 和集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 差集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> 积集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 补集<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 加性能量 E(A,B) 的下界是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> |A||B|<\/la
