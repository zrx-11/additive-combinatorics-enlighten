<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加性组合学</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>加性组合学</h1>
    <div class="sub">从零基础到能读懂 Tao–Vu 的研究生教材</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "additive-combinatorics", "title": "加性组合学", "subtitle": "从零基础到能读懂 Tao–Vu 的研究生教材", "book": {"title": "Additive Combinatorics", "author": "Terence Tao, Van Vu", "source": ["TaoVu.AddComb.pdf"]}, "audience": "零基础（具备大学数学基础）", "goal": "按依赖顺序读完 13 章，能独立复述核心定理、用四类工具做估计，并读懂原书的技术细节", "learningPath": [{"step": "01", "title": "建立坐标：加性集、和集、倍增常数", "chapterIds": ["ch00"], "checkpoint": "能说出 σ 的三种典型取值对应什么结构"}, {"step": "02", "title": "概率工具箱", "chapterIds": ["ch01"], "checkpoint": "能用一阶矩独立证明一个存在性结论"}, {"step": "03", "title": "和集估计与能量", "chapterIds": ["ch02"], "checkpoint": "能写出能量下界并说明 BSG 的用途"}, {"step": "04", "title": "几何直觉：GAP 与凸体", "chapterIds": ["ch03"], "checkpoint": "能算出一个低秩 GAP 的体积并判断真伪"}, {"step": "05", "title": "换到频率空间", "chapterIds": ["ch04"], "checkpoint": "能用卷积定理推出一个和集估计"}, {"step": "06", "title": "逆向：小倍增的结构", "chapterIds": ["ch05"], "checkpoint": "能复述 Freiman 定理并说明有挠时的处理"}, {"step": "07", "title": "图论工具箱", "chapterIds": ["ch06"], "checkpoint": "能用 Turán 定理估计一个无和集"}, {"step": "08", "title": "集中度：Littlewood–Offord", "chapterIds": ["ch07"], "checkpoint": "能区分正向与逆向问题"}, {"step": "09", "title": "几何与代数的两套手法", "chapterIds": ["ch08"], "checkpoint": "能说出 S-T 定理的指数来源"}, {"step": "10", "title": "有限域上的多项式方法", "chapterIds": ["ch09"], "checkpoint": "能写出零点定理的完整条件"}, {"step": "11", "title": "密度增量：k=3", "chapterIds": ["ch10"], "checkpoint": "能讲清四步迭代为什么终止"}, {"step": "12", "title": "高阶均匀性：k>3", "chapterIds": ["ch11"], "checkpoint": "能说清为什么 k=4 需要 Gowers 范数"}, {"step": "13", "title": "和集的结构增益", "chapterIds": ["ch12"], "checkpoint": "能对比本章与 Szemerédi 的长度差别"}], "chapters": [{"id": "ch00", "title": "第 0 章：导论", "file": "chapters/ch00-导论.md", "difficulty": 1}, {"id": "ch01", "title": "第 1 章：概率方法", "file": "chapters/ch01-概率方法.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：和集估计", "file": "chapters/ch02-和集估计.md", "difficulty": 3}, {"id": "ch03", "title": "第 3 章：加性几何", "file": "chapters/ch03-加性几何.md", "difficulty": 3}, {"id": "ch04", "title": "第 4 章：傅立叶分析方法", "file": "chapters/ch04-傅立叶分析.md", "difficulty": 3}, {"id": "ch05", "title": "第 5 章：逆和集定理", "file": "chapters/ch05-逆和集定理.md", "difficulty": 4}, {"id": "ch06", "title": "第 6 章：图论方法", "file": "chapters/ch06-图论方法.md", "difficulty": 3}, {"id": "ch07", "title": "第 7 章：Littlewood–Offord 问题", "file": "chapters/ch07-Littlewood-Offord.md", "difficulty": 3}, {"id": "ch08", "title": "第 8 章：关联几何", "file": "chapters/ch08-关联几何.md", "difficulty": 3}, {"id": "ch09", "title": "第 9 章：代数方法", "file": "chapters/ch09-代数方法.md", "difficulty": 4}, {"id": "ch10", "title": "第 10 章：k=3 的 Szemerédi 定理", "file": "chapters/ch10-Szemeredi-k3.md", "difficulty": 4}, {"id": "ch11", "title": "第 11 章：k>3 的 Szemerédi 定理与 Gowers 范数", "file": "chapters/ch11-Gowers范数.md", "difficulty": 5}, {"id": "ch12", "title": "第 12 章：和集中的长等差数列", "file": "chapters/ch12-和集中的长等差数列.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "加性集与和集", "file": "concepts/c01-加性集与和集.md", "chapterIds": ["ch00", "ch02"]}, {"id": "c02", "title": "倍增常数", "file": "concepts/c02-倍增常数.md", "chapterIds": ["ch02", "ch05"]}, {"id": "c03", "title": "Ruzsa 距离", "file": "concepts/c03-Ruzsa距离.md", "chapterIds": ["ch02"]}, {"id": "c04", "title": "加性能量", "file": "concepts/c04-加性能量.md", "chapterIds": ["ch02", "ch04"]}, {"id": "c05", "title": "覆盖引理", "file": "concepts/c05-覆盖引理.md", "chapterIds": ["ch02", "ch05"]}, {"id": "c06", "title": "Balog–Szemerédi–Gowers 定理", "file": "concepts/c06-BSG定理.md", "chapterIds": ["ch02", "ch06"]}, {"id": "c07", "title": "Freiman 同态与广义等差数列", "file": "concepts/c07-Freiman同态与GAP.md", "chapterIds": ["ch03", "ch05"]}, {"id": "c08", "title": "傅立叶系数与线性偏差", "file": "concepts/c08-傅立叶系数与线性偏差.md", "chapterIds": ["ch04"]}, {"id": "c09", "title": "Bohr 集", "file": "concepts/c09-Bohr集.md", "chapterIds": ["ch04", "ch10"]}, {"id": "c10", "title": "Littlewood–Offord 集中", "file": "concepts/c10-Littlewood-Offord集中.md", "chapterIds": ["ch07"]}, {"id": "c11", "title": "Gowers 范数", "file": "concepts/c11-Gowers范数.md", "chapterIds": ["ch11"]}, {"id": "c12", "title": "Szemerédi 正则引理", "file": "concepts/c12-正则引理.md", "chapterIds": ["ch10"]}, {"id": "c13", "title": "组合零点定理", "file": "concepts/c13-组合零点定理.md", "chapterIds": ["ch09"]}, {"id": "c14", "title": "和积问题", "file": "concepts/c14-和积问题.md", "chapterIds": ["ch02", "ch08", "ch09"]}], "glossary": [{"term": "加性集", "def": "交换群里的一个有限非空子集，讨论和集时必须带上环境群", "chapterId": "ch00"}, {"term": "和集 A+B", "def": "所有 a+b（a∈A，b∈B）组成的集合", "chapterId": "ch00"}, {"term": "差集 A−B", "def": "所有 a−b 组成的集合，比和集更对称", "chapterId": "ch02"}, {"term": "小倍增", "def": "σ 接近 1，集合几乎对加法封闭", "chapterId": "ch00"}, {"term": "随机集", "def": "倍增常数接近最大值，加法关系稀少", "chapterId": "ch00"}, {"term": "广义等差数列 GAP", "def": "起点加若干方向的整数系数组合，形如 a+[0,N₁]v₁+…", "chapterId": "ch03"}, {"term": "真 GAP", "def": "元素个数达到 ∏(N_i+1) 上界、不发生塌缩的 GAP", "chapterId": "ch03"}, {"term": "真化", "def": "换方向或升维，把非真 GAP 变成真 GAP 的操作", "chapterId": "ch03"}, {"term": "加性能量 E(A,B)", "def": "满足 a+b=a'+b' 的四元组个数", "chapterId": "ch02"}, {"term": "覆盖引理", "def": "和集小则存在小骨架，使整个集合被骨架加差集覆盖", "chapterId": "ch02"}, {"term": "BSG 定理", "def": "能量大则存在大子集，其和集只比自身大常数倍", "chapterId": "ch02"}, {"term": "对称集", "def": "满足 A=−A 的集合", "chapterId": "ch02"}, {"term": "部分和集", "def": "集合在某个方向上投影得到的和集，用来控制不平衡性", "chapterId": "ch02"}, {"term": "特征", "def": "群到单位圆的同态，满足 ξ(x+y)=ξ(x)ξ(y)", "chapterId": "ch04"}, {"term": "傅立叶系数 Â(ξ)", "def": "A 在频率 ξ 上的投影，衡量偏差", "chapterId": "ch04"}, {"term": "卷积定理", "def": "卷积的傅立叶变换等于各自变换的乘积", "chapterId": "ch04"}, {"term": "Bohr 集", "def": "在若干频率上同时接近 1 的元素集合", "chapterId": "ch04"}, {"term": "(p) 常数", "def": "衡量群里 p 元和为零的偏离程度的参数", "chapterId": "ch04"}, {"term": "Bh[g] 集", "def": "每种和最多有 g 种表示的集合，Sidon 是 g=1", "chapterId": "ch04"}, {"term": "分离集", "def": "元素之间没有短小整数线性关系的集合", "chapterId": "ch04"}, {"term": "e-变换", "def": "保持和集不增、把集合整理得更对称的操作", "chapterId": "ch05"}, {"term": "Freiman 同态", "def": "保持 a₁+a₂=a₃+a₄ 这类加法关系的映射", "chapterId": "ch05"}, {"term": "无挠", "def": "群里没有满足 mx=0（m>0）的非零元素", "chapterId": "ch05"}, {"term": "万能环境群", "def": "使 A 的所有加法关系都保持的最大环境群", "chapterId": "ch05"}, {"term": "Turán 定理", "def": "n 顶点 e 边的图，独立集至少 n²/(2e+n)", "chapterId": "ch06"}, {"term": "Sidon 集", "def": "所有两两和互不相同的集合", "chapterId": "ch06"}, {"term": "Ramsey 定理", "def": "足够大的完全图染色后必有大单色团", "chapterId": "ch06"}, {"term": "van der Waerden 定理", "def": "足够长的染色区间必有单色等差数列", "chapterId": "ch06"}, {"term": "Plünnecke 不等式", "def": "一次和集膨胀率小，则多次和集膨胀率也受控", "chapterId": "ch06"}, {"term": "Littlewood–Offord 问题", "def": "带符号和最多能重复多少次", "chapterId": "ch07"}, {"term": "集中函数", "def": "随机和落在某点的概率上界", "chapterId": "ch07"}, {"term": "Esséen 不等式", "def": "集中度受步长平方和控制的估计", "chapterId": "ch07"}, {"term": "关联", "def": "点落在线上的一次计数", "chapterId": "ch08"}, {"term": "交叉数", "def": "图在平面上绘制时边与边的交叉次数", "chapterId": "ch08"}, {"term": "网格分解", "def": "把平面切成格子以控制点线关系的方法", "chapterId": "ch08"}, {"term": "组合零点定理", "def": "次数与最高项系数控制格点上是否存在非零点", "chapterId": "ch09"}, {"term": "受限和集", "def": "禁止同元素相加得到的和集", "chapterId": "ch09"}, {"term": "Davenport 常数", "def": "任意 k 个元素都有非空零和子集的最小 k", "chapterId": "ch09"}, {"term": "Kemnitz 猜想", "def": "Davenport 常数在平面格点上的版本，猜想值 4n−3", "chapterId": "ch09"}, {"term": "Stepanov 方法", "def": "用\"零点数不超过次数\"反推集合大小", "chapterId": "ch09"}, {"term": "分圆域", "def": "有理数域添加单位根得到的扩域", "chapterId": "ch09"}, {"term": "密度增量", "def": "无 AP 时在子结构上密度变高，迭代至矛盾的策略", "chapterId": "ch10"}, {"term": "提升", "def": "把区间里的集合搬到循环群里处理的技术", "chapterId": "ch10"}, {"term": "正则引理", "def": "任意大图可分成常数多块，使块间近似随机", "chapterId": "ch10"}, {"term": "Gowers 范数 U^k", "def": "2^k 个变量上的平均，衡量 k 阶均匀性", "chapterId": "ch11"}, {"term": "硬障碍", "def": "真正的高阶结构，如多项式相位或低维 GAP", "chapterId": "ch11"}, {"term": "软障碍", "def": "线性相位造成的表面偏差，可除掉相位消除", "chapterId": "ch11"}, {"term": "Gowers 逆定理", "def": "范数大则存在低次多项式相位解释偏差", "chapterId": "ch11"}, {"term": "超图移除引理", "def": "删少量边即可破坏全部完全子超图", "chapterId": "ch11"}, {"term": "转移原理", "def": "先用稠密均匀模型证明，再搬回稀疏集合", "chapterId": "ch11"}, {"term": "完全序列", "def": "每项最多用一次就能表示所有足够大整数的序列", "chapterId": "ch12"}, {"term": "次完全序列", "def": "允许有限项数的完全性版本", "chapterId": "ch12"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q1", "chapterId": "ch00", "type": "single", "question": "σ[A]=1 意味着什么？", "options": ["A 是空集", "A 是子群或它的陪集", "A 一定是等差数列", "A 的倍增最大"], "answer": 1, "explain": "σ=1 表示 |A+A|=|A|，集合对加法完全封闭，这正是子群或陪集的特征。等差数列的 σ 通常接近 2。"}, {"id": "q2", "chapterId": "ch00", "type": "single", "question": "等比数列 {1,2,4,…,2^{n−1}} 的 σ 约为多少？", "options": ["1", "2", "n/2", "n²"], "answer": 2, "explain": "两两之和对应不同的指数组合，和集大小约为 n²/2 量级，除以 n 得到 n/2。这类集合在加法上接近随机。"}, {"id": "q3", "chapterId": "ch00", "type": "single", "question": "讨论和集之前必须先明确什么？", "options": ["环境群", "集合的基数", "元素的大小顺序", "元素的奇偶性"], "answer": 0, "explain": "同一个集合放进不同的群，和集可能完全不同。{1,2,3} 在整数里 |A+A|=5，在模 3 群里只有 3。"}, {"id": "q1", "chapterId": "ch01", "type": "single", "question": "若 X 是非负整数值随机变量且 E X<1，能推出什么？", "options": ["存在一个样本使 X=0", "所有样本都有 X=0", "E X=0", "X 恒等于 1"], "answer": 0, "explain": "若处处 X≥1，则 E X≥1，与 E X<1 矛盾，所以必有样本取 0。这是最基础的存在性论证。"}, {"id": "q2", "chapterId": "ch01", "type": "single", "question": "Chernoff 界是对哪个量使用 Markov 不等式得到的？", "options": ["X", "e^{tX}", "X²", "log X"], "answer": 1, "explain": "对 e^{tX} 用 Markov 得 P(S≥a) ≤ E e^{tS}/e^{ta}，再对 t 优化得到指数衰减。这是估计尾部的标准动作。"}, {"id": "q3", "chapterId": "ch01", "type": "single", "question": "Lovász 局部引理条件 e·p·(d+1)≤1 里的 d 指什么？", "options": ["坏事件的总数", "环境群的维数", "每个坏事件的相关事件数上限", "随机变量的个数"], "answer": 2, "explain": "d 是依赖图中的最大度，即一个坏事件最多与多少个其他坏事件相关。度越大，要求单个坏事件的概率越小。"}, {"id": "q1", "chapterId": "ch02", "type": "single", "question": "Ruzsa 距离是用哪一类集合定义的？", "options": ["和集", "差集", "积集", "补集"], "answer": 1, "explain": "d(A,B)=log(|A−B|/√(|A||B|))。用差集是因为它更对称，A−A 含 0，三角不等式好证。"}, {"id": "q2", "chapterId": "ch02", "type": "single", "question": "加性能量 E(A,B) 的下界是什么？", "options": ["|A||B|", "|A|²|B|²/|A+B|", "|A+B|²", "|A|²+|B|²"], "answer": 1, "explain": "由柯西不等式：把每个和的表示数平方求和，不小于总数的平方除以和集大小。"}, {"id": "q3", "chapterId": "ch02", "type": "single", "question": "BSG 定理保证的是什么？", "options": ["整个 A 的结构都好", "A 本身就是 GAP", "存在大子集，其和集只大常数倍", "A 是子群"], "answer": 2, "explain": "BSG 必须损失子集：存在 A 的子集与 B 的子集，各损失常数因子，而两者之和集只比 B 的子集大常数倍。不能指望它刻画整个集合。"}, {"id": "q1", "chapterId": "ch03", "type": "single", "question": "秩为 2、每个方向长度为 3 的 GAP 最多包含多少个点？", "options": ["16", "9", "12", "6"], "answer": 0, "explain": "每个方向取 0,1,2,3 共 4 种系数，4×4=16。这是体积上界，真 GAP 时取等。"}, {"id": "q2", "chapterId": "ch03", "type": "single", "question": "Brunn–Minkowski 不等式说的是什么可加？", "options": ["体积", "线性尺度", "元素个数", "维数"], "answer": 1, "explain": "形式是 |A+B|^{1/d} ≥ |A|^{1/d}+|B|^{1/d}，即 d 次根意义下的尺度可加，体积按 d 次方增长。"}, {"id": "q3", "chapterId": "ch03", "type": "single", "question": "真 GAP 的定义是什么？", "options": ["方向线性无关", "元素个数达到乘积上界", "体积最小", "秩等于 0"], "answer": 1, "explain": "真是说不同的系数组合不撞车，元素数等于 ∏(N_i+1)。非真会塌缩，后续体积计数全部失效。"}, {"id": "q1", "chapterId": "ch04", "type": "single", "question": "卷积定理的正确形式是？", "options": ["(f*g) 的变换 = f 的变换乘 g 的变换", "(f+g) 的变换 = 两者变换相加", "(f*g) 的变换 = 两者变换相加", "(fg) 的变换 = 两者变换卷积"], "answer": 0, "explain": "卷积的傅立叶变换等于各自变换的乘积。这条定理把加法卷积变成逐点乘法，是整章的发动机。"}, {"id": "q2", "chapterId": "ch04", "type": "single", "question": "一个集合有明显线性偏差，说明什么？", "options": ["它完全随机", "它在某个频率上分布不均", "它的和集一定最大", "它的能量一定最小"], "answer": 1, "explain": "偏差意味着元素在某个特征的相位上偏向同一方向，通常对应一条等差结构，但不保证形状简单。"}, {"id": "q3", "chapterId": "ch04", "type": "single", "question": "加性能量用傅立叶系数怎么写？", "options": ["系数的模平方和", "系数的模三次方和", "系数的模四次方和", "系数的模和"], "answer": 2, "explain": "能量等于 Σ_ξ|Â(ξ)|⁴。四阶矩来自“两个和相等”对应两次卷积，Parseval 展开后自然是四次。"}, {"id": "q1", "chapterId": "ch05", "type": "single", "question": "e-变换的主要目的是什么？", "options": ["增大和集", "保持和集不增并让集合更规整", "减小集合大小", "更换环境群"], "answer": 1, "explain": "e-变换是归约工具：在不增大和集的前提下做对称化、极小化，让后续定理的条件成立。"}, {"id": "q2", "chapterId": "ch05", "type": "single", "question": "无挠情形下 Freiman 定理的结论是什么？", "options": ["A 是子群", "A 落在低秩 GAP 里", "A 一定是等差数列", "A 没有加法关系"], "answer": 1, "explain": "存在秩不超过 d(K)、大小不超过 C(K)|A| 的 GAP 包含 A，参数只依赖倍增常数 K。"}, {"id": "q3", "chapterId": "ch05", "type": "single", "question": "有挠群里处理结构问题的正确顺序是？", "options": ["直接套无挠版本", "先分离挠部分再套定理", "先取商群再取子群", "先做傅立叶变换"], "answer": 1, "explain": "有挠时 A 可能是子群加 GAP 的混合，必须先分离挠部分，再处理无挠部分。"}, {"id": "q1", "chapterId": "ch06", "type": "single", "question": "Turán 定理给出的独立集下界是？", "options": ["n²/(2e+n)", "n/(2e)", "e/n²", "n²/e"], "answer": 0, "explain": "n 个顶点、e 条边的图，独立集至少 n²/(2e+n)。它只保证存在，界通常很松。"}, {"id": "q2", "chapterId": "ch06", "type": "single", "question": "Plünnecke 不等式与 BSG 的关键差别是？", "options": ["前者要损失子集", "前者不损失集合，直接控制多次和集", "两者完全等价", "后者不损失集合"], "answer": 1, "explain": "Plünnecke 是正向的：一次和集膨胀率小，则多次和集膨胀率也受控。BSG 是逆向的，必须挑子集。"}, {"id": "q3", "chapterId": "ch06", "type": "single", "question": "van der Waerden 定理断言染色区间里必然出现什么？", "options": ["单色团", "单色等差数列", "零和子集", "大独立集"], "answer": 1, "explain": "把足够长的整数区间染成 r 种颜色，必有一种颜色包含任意指定长度的等差数列。它是结构版的抽屉原理。"}, {"id": "q1", "chapterId": "ch07", "type": "single", "question": "步长全为 1 时，带符号和的最大重数是什么量级？", "options": ["2^d/√d", "2^d/d", "d", "√d"], "answer": 0, "explain": "二项式系数在中间最大，约 2^d/√d。这就是 Littlewood–Offord 问题里最集中的极端。"}, {"id": "q2", "chapterId": "ch07", "type": "single", "question": "Esséen 集中不等式依赖步长的哪个量？", "options": ["步长的最大值", "步长的平方和", "步长的个数", "步长的乘积"], "answer": 1, "explain": "上界形如 C/√(平方和)，本质是方差控制：带符号和的方差就是平方和。"}, {"id": "q3", "chapterId": "ch07", "type": "single", "question": "随机 Bernoulli 矩阵奇异的概率是什么量级？", "options": ["2^{-n}", "n^{-1}", "(1/2+o(1))^n", "1/n²"], "answer": 2, "explain": "奇异概率约 (1/2+o(1))^n。仅两列相同只能给出 n²2^{-n}，真正的成因是列的整数线性组合，要用逆 Littlewood–Offord。"}, {"id": "q1", "chapterId": "ch08", "type": "single", "question": "n 个顶点的平面简单图最多有多少条边（n≥3）？", "options": ["3n−6", "2n−3", "n²/2", "4n−8"], "answer": 0, "explain": "欧拉公式给出面数上界，每个面至少三条边，整理得 m≤3n−6。超过的部分必须靠交叉。"}, {"id": "q2", "chapterId": "ch08", "type": "single", "question": "Szemerédi–Trotter 定理中关联上界的指数是多少？", "options": ["1/2", "2/3", "3/4", "1/3"], "answer": 1, "explain": "关联数不超过 P 的 2/3 次方乘 L 的 2/3 次方，再加 P 与 L 的一次项。2/3 来自交叉数下界与关联数的优化。"}, {"id": "q3", "chapterId": "ch08", "type": "single", "question": "实数域上的和积估计主要借助什么？", "options": ["组合零点定理", "Stepanov 方法", "关联几何", "超图移除引理"], "answer": 2, "explain": "加法结构对应斜线，乘法结构对应双曲线，两者的交点受关联上界控制，冲突给出下界。"}, {"id": "q1", "chapterId": "ch09", "type": "single", "question": "组合零点定理成立需要什么条件？", "options": ["任意环，系数非零", "域，且最高次项系数非零", "域，且所有系数非零", "整环，常数项非零"], "answer": 1, "explain": "必须是域，零点数不超过次数才可靠；同时要求最高项系数非零，否则多项式可在整个格点上取零。"}, {"id": "q2", "chapterId": "ch09", "type": "single", "question": "Erdős–Heilbronn 猜想给出的受限和集下界是？", "options": ["两倍集合大小", "min(p, 2|A|−3)", "|A|+|A|", "四倍集合大小减三"], "answer": 1, "explain": "在 ℤ/pℤ 中受限和集至少是 min(p, 2|A|−3)。p=7、A={0,1,3} 时恰好取到 3。"}, {"id": "q3", "chapterId": "ch09", "type": "single", "question": "Stepanov 方法的核心依据是什么？", "options": ["零点数不超过多项式次数", "次数不超过零点数", "所有系数为零", "域必须是无限的"], "answer": 0, "explain": "构造一个在目标集合上处处为零的多项式，次数不能太小，由此反推集合大小的界。它和零点定理是同一枚硬币的两面。"}, {"id": "q1", "chapterId": "ch10", "type": "single", "question": "Szemerédi 定理的结论是什么？", "options": ["正上密度的整数集含任意长的等差数列", "稠密集合至少含一个 3 项等差数列", "随机集合含等差数列", "所有整数集含等差数列"], "answer": 0, "explain": "是任意长，不是固定长度。k=3 由 Roth 证明，一般情形由 Szemerédi 完成。"}, {"id": "q2", "chapterId": "ch10", "type": "single", "question": "密度增量策略为什么一定会终止？", "options": ["N 是有限的", "密度每次增加，且有上界 1", "偏差会自动消失", "Bohr 集越来越大"], "answer": 1, "explain": "每步密度至少增加一个只依赖当前密度的正量，而密度不超过 1，所以迭代次数有限。"}, {"id": "q3", "chapterId": "ch10", "type": "single", "question": "证明 k=3 的 Szemerédi 定理使用的是？", "options": ["Gowers 范数", "超图移除引理", "线性傅立叶分析", "转移原理"], "answer": 2, "explain": "3 项等差数列是中点关系，一个频率就能检测，所以线性傅立叶足够。k≥4 才需要 Gowers 范数。"}, {"id": "q1", "chapterId": "ch11", "type": "single", "question": "k 项等差数列由哪个阶的 Gowers 范数控制？", "options": ["k−1 阶", "k 阶", "k+1 阶", "2 阶"], "answer": 0, "explain": "k 项 AP 对应 k−1 阶差分结构，需要 U^{k−1}。例如 4 项 AP 需要 U³。"}, {"id": "q2", "chapterId": "ch11", "type": "single", "question": "硬障碍指的是什么？", "options": ["线性相位", "真正的高阶结构，如多项式相位或低维 GAP", "随机噪声", "可以忽略的小偏差"], "answer": 1, "explain": "软障碍是线性相位造成的形式偏差，除掉相位就能消除；硬障碍是真正的高阶结构，必须识别出来才能继续。"}, {"id": "q3", "chapterId": "ch11", "type": "single", "question": "Green–Tao 定理证明中的核心技术是什么？", "options": ["密度增量", "正则引理", "转移原理", "Stepanov 方法"], "answer": 2, "explain": "素数密度为零，不能直接套 Szemerédi。先用筛法构造伪随机权重，在稠密模型里证，再转移回素数。"}, {"id": "q1", "chapterId": "ch12", "type": "single", "question": "本章关于长等差数列的结论针对哪个对象？", "options": ["A 本身", "lA", "A−A", "A 的补集"], "answer": 1, "explain": "结论说的是多次和集 lA 含长等差数列，不能反推回 A。lA 比 A 大得多，结构也更规整。"}, {"id": "q2", "chapterId": "ch12", "type": "single", "question": "完全序列的定义是什么？", "options": ["每项可以重复使用", "每项最多用一次就能表示所有足够大的整数", "密度大于 1/2", "一定含长等差数列"], "answer": 1, "explain": "完全性看能否表示每个足够大的整数，与密度无关。二进制表示是次完全，不是完全。"}, {"id": "q3", "chapterId": "ch12", "type": "single", "question": "本章结论与 Szemerédi 定理在长度上的差别是？", "options": ["两者都是对数级", "两者都是幂次级", "本章幂次级，Szemerédi 是对数级", "本章线性，Szemerédi 是幂次"], "answer": 2, "explain": "和集把结构强度提升了一个档次：lA 里的等差数列长度是幂次的，而 A 本身只能保证对数级长度。"}, {"id": "all-q1", "chapterId": "__all__", "type": "single", "question": "BSG 定理在整本书里的作用是？", "options": ["把能量大转成存在结构好的子集", "把和集小直接转成子群", "把偏差转成 Bohr 集", "把稀疏集合转成稠密集合"], "answer": 0, "explain": "BSG 是能量与结构之间的转换器，全书使用频率最高。它必须损失子集，这一点要记住。"}, {"id": "all-q2", "chapterId": "__all__", "type": "single", "question": "为什么 k=4 的 Szemerédi 定理不能用线性傅立叶证明？", "options": ["线性傅立叶只能检测一阶的中点结构", "傅立叶变换在整数上不成立", "四项等差数列根本不存在", "傅立叶计算太慢"], "answer": 0, "explain": "四项 AP 要求差分的差分相同，是二阶结构，需要三阶 Gowers 范数。线性傅立叶只看得到一个频率上的偏差。"}, {"id": "all-q3", "chapterId": "__all__", "type": "single", "question": "Freiman 定理与逆 Littlewood–Offord 的共同点是？", "options": ["都用傅立叶分析", "都能给出集合的精确形状", "都给出低秩 GAP 型结构", "都只适用于有限域"], "answer": 2, "explain": "一个从和集小出发，一个从集中度高出发，结论都是落在低秩 GAP 里。这正是加性结构的统一形态。"}, {"id": "all-q4", "chapterId": "__all__", "type": "single", "question": "实数域与有限域上的和积证明，方法差异是？", "options": ["都用关联几何", "都用组合零点定理", "都用概率方法", "实数域用几何，有限域用代数"], "answer": 3, "explain": "实数域有序和凸性，可以用斜线与双曲线的交点；有限域没有序，只能靠多项式零点定理或 Stepanov 方法。"}, {"id": "all-q5", "chapterId": "__all__", "type": "single", "question": "Szemerédi 正则引理的作用是什么？", "options": ["估计素数密度", "把任意图分解为均匀块加随机部分", "直接构造长等差数列", "证明 Parseval 恒等式"], "answer": 1, "explain": "分块数量只依赖误差参数，不依赖图的规模。它是把任意结构变成随机结构加少量例外的通用工具。"}, {"id": "all-q6", "chapterId": "__all__", "type": "single", "question": "Green–Tao 定理为什么不能直接使用 Szemerédi 定理？", "options": ["素数集不含等差数列", "素数集的密度为零，密度定理不适用", "素数集太大", "Szemerédi 定理只对有限群成立"], "answer": 1, "explain": "Szemerédi 要求正上密度，素数的密度是 0。必须用转移原理，先在稠密均匀模型里证，再搬回素数。"}], "flashcards": [{"id": "ch00-f1", "chapterId": "ch00", "front": "什么是加性集？为什么必须带上环境群？", "back": "加性集是一对 (A,Z)：Z 是交换群，A 是 Z 的有限非空子集。同一个 A 放进不同的群，和集大小可以完全不同。", "tags": ["定义"]}, {"id": "ch00-f2", "chapterId": "ch00", "front": "倍增常数 σ[A] 的定义与含义？", "back": "σ[A]=|A+A|/|A|。接近 1 表示几乎对加法封闭，接近 |A| 表示加法上接近随机。", "tags": ["定义"]}, {"id": "ch00-f3", "chapterId": "ch00", "front": "加性组合学的正问题和反问题分别问什么？", "back": "正问题：给定 A 的结构，估计 |A+A|；反问题：给定 |A+A| 很小，反推 A 的结构。", "tags": ["框架"]}, {"id": "ch00-f4", "chapterId": "ch00", "front": "举出三个 σ 差别很大的集合。", "back": "区间 [1,n]：σ≈2；等比数列 2^k：σ≈n/2；子群：σ=1。", "tags": ["实例"]}, {"id": "ch01-f1", "chapterId": "ch01", "front": "一阶矩方法的标准用法？", "back": "把坏对象的个数写成随机变量 X，若 E X<1，则存在样本使 X=0，即存在一个没有坏对象的实例。", "tags": ["方法"]}, {"id": "ch01-f2", "chapterId": "ch01", "front": "二阶矩给出的“X 大于 0”的下界是什么？", "back": "P(X>0) ≥ (E X)²/E(X²)。它排除了随机变量集中在零附近的可能。", "tags": ["不等式"]}, {"id": "ch01-f3", "chapterId": "ch01", "front": "局部引理和 Janson 不等式分别适用于什么情形？", "back": "局部引理要求依赖度有界（每个坏事件只与少数相关）；Janson 处理弱相关但依赖边多的求和情形。", "tags": ["方法"]}, {"id": "ch01-f4", "chapterId": "ch01", "front": "概率方法能给出构造算法吗？", "back": "一般不能。它只证明存在性，很多情形至今没有已知的确定性构造。", "tags": ["反模式"]}, {"id": "ch02-f1", "chapterId": "ch02", "front": "Ruzsa 距离的定义，为什么用差集？", "back": "d(A,B)=log(|A−B|/√(|A||B|))。差集有对称性，A−A 含 0，便于证明三角不等式。", "tags": ["定义"]}, {"id": "ch02-f2", "chapterId": "ch02", "front": "加性能量与和集大小的关系式？", "back": "能量不小于 |A|²|B|²/|A+B|，由柯西不等式得到。能量大等价于和集小（定量版本）。", "tags": ["不等式"]}, {"id": "ch02-f3", "chapterId": "ch02", "front": "Ruzsa 覆盖引理的结论？", "back": "若 |A+B|≤K|B|，则存在 A 的子集 A，大小不超过 K，使 A 被 A 加 B−B 覆盖。它把整体问题降成骨架问题。", "tags": ["结构"]}, {"id": "ch02-f4", "chapterId": "ch02", "front": "BSG 定理一句话？", "back": "能量接近最大，则存在大子集 A、B（只损失常数因子），使两者之和集只比 B 大常数倍。", "tags": ["结构"]}, {"id": "ch03-f1", "chapterId": "ch03", "front": "GAP 的定义与体积上界？", "back": "形如 a+[0,N₁]v₁+…+[0,N_d]v_d，元素数不超过各方向长度加一的乘积。", "tags": ["定义"]}, {"id": "ch03-f2", "chapterId": "ch03", "front": "真 GAP 与非真的区别，为什么重要？", "back": "真 GAP 的元素数等于乘积上界，不塌缩；非真会塌缩，基于体积的计数失效，需要真化。", "tags": ["定义"]}, {"id": "ch03-f3", "chapterId": "ch03", "front": "Brunn–Minkowski 不等式的形式？", "back": "|A+B|^{1/d} ≥ |A|^{1/d}+|B|^{1/d}，凸体的线性尺度可加。", "tags": ["不等式"]}, {"id": "ch03-f4", "chapterId": "ch03", "front": "Minkowski 格点定理的条件与结论？", "back": "中心对称凸体 K，体积大于 2^d 倍格行列式，则 K 含非零格点。它把体积翻译成格点个数。", "tags": ["定理"]}, {"id": "ch04-f1", "chapterId": "ch04", "front": "卷积定理为什么是傅立叶方法的核心？", "back": "卷积的变换等于各自变换的乘积，把加法卷积变成逐点乘法，于是和集问题变成系数乘积问题。", "tags": ["定理"]}, {"id": "ch04-f2", "chapterId": "ch04", "front": "Parseval 恒等式的内容？", "back": "函数的平方和等于其傅立叶系数平方和除以群的大小。它是群上的勾股定理，也是能量估计的起点。", "tags": ["不等式"]}, {"id": "ch04-f3", "chapterId": "ch04", "front": "线性偏差的直观含义？", "back": "集合元素在某个特征的相位上偏向同一方向，分布不均匀。通常对应一条等差结构，但不保证形状简单。", "tags": ["概念"]}, {"id": "ch04-f4", "chapterId": "ch04", "front": "Bohr 集的定义，为什么需要它？", "back": "在给定的一组频率上同时接近 1 的元素的集合。它给出多频率同时对齐的正确几何，用于密度增量。", "tags": ["结构"]}, {"id": "ch05-f1", "chapterId": "ch05", "front": "e-变换的目标是什么？", "back": "在不增大和集的前提下整理集合，使其对称、极小，满足后续定理的假设。", "tags": ["方法"]}, {"id": "ch05-f2", "chapterId": "ch05", "front": "Freiman 同态的定义？", "back": "保持加法关系的映射：若两组元素的和相等，则映射后的和也相等。它比群同态弱。", "tags": ["定义"]}, {"id": "ch05-f3", "chapterId": "ch05", "front": "无挠 Freiman 定理的结论？", "back": "和集大小不超过 K 倍集合大小，则 A 含于秩与大小都只依赖 K 的 GAP 中。", "tags": ["定理"]}, {"id": "ch05-f4", "chapterId": "ch05", "front": "有挠群为什么不能直接套无挠定理？", "back": "子群部分会破坏单一 GAP 包含的结论，必须先分离挠部分，再处理无挠部分。", "tags": ["反模式"]}, {"id": "ch06-f1", "chapterId": "ch06", "front": "Turán 定理的独立集下界？", "back": "n 顶点 e 边的图，独立集至少是 n 的平方除以 2e+n。它只保证存在，界经常很松。", "tags": ["定理"]}, {"id": "ch06-f2", "chapterId": "ch06", "front": "Sidon 集的定义？", "back": "所有两两和（允许同元素）互不相同的集合。它是 Bh[g] 集在 g=1 时的情形。", "tags": ["定义"]}, {"id": "ch06-f3", "chapterId": "ch06", "front": "Ramsey 与 van der Waerden 的关系？", "back": "两者都是结构版抽屉原理：颜色数固定、长度固定，区间足够长时单色结构必然出现。", "tags": ["定理"]}, {"id": "ch06-f4", "chapterId": "ch06", "front": "Plünnecke 不等式的形式与用途？", "back": "一次和集膨胀率受控，则多次和集的膨胀率也受控。正向控制，不损失集合。", "tags": ["不等式"]}, {"id": "ch07-f1", "chapterId": "ch07", "front": "Littlewood–Offord 问题在问什么？", "back": "给 d 个步长，问 2^d 个带符号和最多能有多少个相同；逆问题问若很集中，步长必须长什么样。", "tags": ["问题"]}, {"id": "ch07-f2", "chapterId": "ch07", "front": "步长全为 1 与步长为 2 的幂，集中度差别多大？", "back": "全 1 时最大重数约 2^d/√d；2 的幂时每个和唯一，最大重数为 1。差别由整数关系决定。", "tags": ["实例"]}, {"id": "ch07-f3", "chapterId": "ch07", "front": "Esséen 集中不等式的形式与含义？", "back": "集中概率的上界形如常数除以步长平方和的平方根。集中度受方差控制，只依赖平方和。", "tags": ["不等式"]}, {"id": "ch07-f4", "chapterId": "ch07", "front": "逆 Littlewood–Offord 的结论？", "back": "集中度大，则绝大多数步长落在一个低秩 GAP 里（少数例外）。它是随机矩阵奇异概率估计的关键。", "tags": ["结构"]}, {"id": "ch08-f1", "chapterId": "ch08", "front": "交叉数下界 m−3n+6 从哪里来？", "back": "欧拉公式：平面图边数不超过 3n−6，超出的边必须靠交叉塞进去。", "tags": ["定理"]}, {"id": "ch08-f2", "chapterId": "ch08", "front": "Szemerédi–Trotter 定理的完整形式？", "back": "关联数不超过 P 的 2/3 次方乘 L 的 2/3 次方，再加 P 与 L 的一次项，量级最优。", "tags": ["定理"]}, {"id": "ch08-f3", "chapterId": "ch08", "front": "用关联几何证和积的直觉？", "back": "加法结构对应斜线，乘法结构对应双曲线，两者交点受关联上界控制，不能同时很强。", "tags": ["方法"]}, {"id": "ch08-f4", "chapterId": "ch08", "front": "有限域上的和积为什么要换方法？", "back": "有限域没有序和凸性，几何论证失效，只能靠组合零点定理或 Stepanov 方法。", "tags": ["反模式"]}, {"id": "ch09-f1", "chapterId": "ch09", "front": "组合零点定理的完整陈述？", "back": "次数不超过各变量上限之和、最高项系数非零，且每个集合大小超过对应上限，则格点上存在非零点。", "tags": ["定理"]}, {"id": "ch09-f2", "chapterId": "ch09", "front": "受限和集是什么？Erdős–Heilbronn 猜想的值？", "back": "禁止同元素相加的和集；猜想其大小至少是 min(p, 2|A|−3)（在 ℤ/pℤ 中）。", "tags": ["定义"]}, {"id": "ch09-f3", "chapterId": "ch09", "front": "Davenport 常数与 Kemnitz 猜想？", "back": "D(G) 是使任意 k 个元素都有非空零和子集的最小 k；Kemnitz 是平面格点版本，猜想 4n−3。", "tags": ["定理"]}, {"id": "ch09-f4", "chapterId": "ch09", "front": "Stepanov 方法怎么用？", "back": "构造在目标集合上处处为零的多项式，用零点数不超过次数反推集合大小。", "tags": ["方法"]}, {"id": "ch10-f1", "chapterId": "ch10", "front": "Szemerédi 定理的陈述？", "back": "正整数集若有正上密度，则含任意长的等差数列。k=3 由 Roth 用傅立叶证明。", "tags": ["定理"]}, {"id": "ch10-f2", "chapterId": "ch10", "front": "密度增量的四个步骤？", "back": "假设无 AP，用傅立叶找偏差，把偏差转成 Bohr 集上密度增加，迭代至密度超过 1。", "tags": ["方法"]}, {"id": "ch10-f3", "chapterId": "ch10", "front": "为什么要分小挠和整数两种情形？", "back": "小挠时 Bohr 集接近子群，增量好算；整数情形要做提升，把区间搬进循环群，密度会被稀释，需补偿。", "tags": ["方法"]}, {"id": "ch10-f4", "chapterId": "ch10", "front": "正则引理的内容与用途？", "back": "任意大图可分成常数多块，块内密度近似一致、块间近似随机；用于把结构分解成均匀加随机。", "tags": ["定理"]}, {"id": "ch11-f1", "chapterId": "ch11", "front": "Gowers 范数 U^k 的定义骨架？", "back": "对 x 和 k 个增量共 2^k 个变量求平均，取 f 在 2^k 个点的乘积的复共轭组合。", "tags": ["定义"]}, {"id": "ch11-f2", "chapterId": "ch11", "front": "硬障碍与软障碍的区别？", "back": "硬障碍是真正的高阶结构（多项式相位、低维 GAP）；软障碍是线性相位的形式偏差，除掉相位即可消除。", "tags": ["概念"]}, {"id": "ch11-f3", "chapterId": "ch11", "front": "Gowers 逆定理的结论？", "back": "范数大，则存在次数不超过 k−1 的多项式相位，使 f 与该相位的相关性很大。", "tags": ["定理"]}, {"id": "ch11-f4", "chapterId": "ch11", "front": "Green–Tao 定理的证明骨架？", "back": "筛法构造伪随机权重，证明其在 Gowers 范数下均匀，对稠密模型用 Szemerédi，再转移回素数。", "tags": ["方法"]}, {"id": "ch12-f1", "chapterId": "ch12", "front": "为什么 lA 比 A 更容易含长等差数列？", "back": "多次相加把局部不规则性平均掉，值域变宽且结构更密；结论中的长度是幂次级。", "tags": ["概念"]}, {"id": "ch12-f2", "chapterId": "ch12", "front": "完全序列与次完全序列的区别？", "back": "完全：每项最多用一次即可表示所有足够大的整数；次完全允许有限项数。二进制是次完全但不是完全。", "tags": ["定义"]}, {"id": "ch12-f3", "chapterId": "ch12", "front": "这套结果与 Waring 问题的联系？", "back": "令 A 为 k 次幂集合，lA 含长等差数列，配合局部覆盖与周期性论证可推出 Waring 型结论。", "tags": ["应用"]}, {"id": "ch12-f4", "chapterId": "ch12", "front": "本章结论与 Szemerédi 定理的长度对比？", "back": "lA 中的 AP 长度是幂次级；A 本身只能保证对数级。这是和集提升结构强度的定量体现。", "tags": ["对比"]}]}, "pages": {"ch00": {"html": "<h1>第 0 章：这门学科在做什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：微积分、线性代数、概率论的基本概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清&quot;加性集&quot;和&quot;和集&quot;这两个词在本书里指什么\n<\/li><li>\n用一两句话解释为什么&quot;集合有多少加性结构&quot;可以用 |A+A| 来衡量\n<\/li><li>\n看懂全书十二章的组织逻辑，知道哪几章是主干、哪几章是专用工具\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>加性组合学研究的是&quot;一个集合在加法下有多大的结构&quot;，衡量方式是看 A+A 比 A 大多少；结构强就往等差数列方向走，结构弱就接近随机。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：加性集（additive set）<\/h3>\n<p>本书开头就规定：一个加性集是一对 (A, Z)，其中 Z 是一个交换群，A 是 Z 的有限非空子集。所有讨论都相对这个&quot;环境群&quot;进行。<\/p>\n<p><strong>为什么一定要带上 Z？<\/strong> 因为&quot;和&quot;这个运算要在某个群里才有意义。同样是 {1, 2, 3}，放在整数群里，1+2=3；放在模 5 的群里，2+3=0，结构完全不同。<\/p>\n<p><strong>例子<\/strong>：A = {1,2,3} ⊂ ℤ，则 A+A = {2,3,4,5,6}，五个元素。A = {0,1,2} ⊂ ℤ/3ℤ，则 A+A = {0,1,2}，还是三个元素。同一个大小的集合，第二个的加性结构明显更强。<\/p>\n<h3>概念 2：和集与差集<\/h3>\n<p>A+B = {a+b : a∈A, b∈B}，A−B = {a−b : a∈A, b∈B}。这两个是最基本的观察对象。<\/p>\n<p>直觉上，两个&quot;随机&quot;的集合相加，结果会铺开得很大，接近 |A||B| 的量级；两个&quot;有结构&quot;的集合（比如等差数列）相加，结果只比原来大一点。所以 |A+A| 与 |A| 的比值，可以当作结构强弱的温度计。<\/p>\n<h3>概念 3：倍增常数<\/h3>\n<p>σ[A] := |A+A| / |A|。<\/p>\n<ul><li>\nσ[A] = 1 只有一种情况：A 是子群（或子群的陪集）。\n<\/li><li>\nσ[A] 很小（比如小于 2、小于 3）时，A 的结构可以被完全刻画，这是第 5 章的内容。\n<\/li><li>\nσ[A] 接近 |A| 时，A 几乎是随机的，加性组合学的强定理基本管不到。\n<\/ul>\n<p>这条例题贯穿全书：<strong>结构越强，σ 越小；σ 越小，集合越像等差数列或者子群。<\/strong><\/p>\n<h3>概念 4：两种问法，正问题和反问题<\/h3>\n<p>正问题（第 2 章）：已知 A、B 的某些信息，能推出 |A+B| 至少多大、最多多大？<\/p>\n<p>反问题（第 5 章）：已知 |A+A| 很小，能反推出 A 长什么样？<\/p>\n<p>这两种问法在整本书里交替出现。第 7 章的 Littlewood–Offord 问题也是同样的正反结构：一边问&quot;子集和最多能集中到什么程度&quot;，一边问&quot;如果集中了，步长向量必须长什么样&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[加性集与和集] --&gt; B[和集估计 第2章]\n    A --&gt; C[加性几何 第3章]\n    B --&gt; D[傅立叶方法 第4章]\n    B --&gt; E[逆和集定理 第5章]\n    B --&gt; F[图论方法 第6章]\n    D --&gt; G[Littlewood-Offord 第7章]\n    E --&gt; H[关联几何 第8章]\n    E --&gt; I[代数方法 第9章]\n    D --&gt; J[Szemeredi k=3 第10章]\n    G --&gt; K[Szemeredi k&gt;3 第11章]\n    K --&gt; L[和集中的长等差数列 第12章]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把集合想成一群人，加法想成&quot;两人握手&quot;。<\/p>\n<ul><li>\n如果这群人来自同一个家族，彼此都认识，握手组合的种类很少——这就是子群或者等差数列，σ 小。\n<\/li><li>\n如果这群人是随机抽的陌生人，握手组合几乎两两不同——σ 大。\n<\/ul>\n<p><strong>注意类比的失效边界<\/strong>：现实中的&quot;认识&quot;不满足结合律也不满足交换律，而群运算满足。所以这个类比只能帮你记住&quot;结构 = 组合数量少&quot;，不能用来推导定理。<\/p>\n<p><strong>实例<\/strong>：取 A = {0,1,...,n−1} ⊂ ℤ。A+A = {0,1,...,2n−2}，大小 2n−1，σ[A] = (2n−1)/n ≈ 2。这就是最标准的&quot;有结构&quot;：一个等差数列，加倍后长度只翻了一倍。<\/p>\n<p>再取 B = {0,1,2,4,8,...,2^{n−1}}（等比数列）。B+B 里的元素是 2^i+2^j（i≤j），互不相同的有 n(n+1)/2 个，σ[B] ≈ n/2，几乎最大。等比数列在加法下毫无结构——这是最常用的反例。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 σ[A] 小就一定是等差数列。σ[A] &lt; 3 时确实能刻画，但刻画出来的是&quot;子群加小扰动&quot;或者&quot;低秩广义等差数列&quot;，形状比等差数列宽得多。\n<\/li><li>\n别以为 |A+A| 只能靠&quot;数一遍&quot;来算。对 n 很大的集合，直接枚举 A+A 是 O(n²)，定理的价值就在于不解方程也能给出上下界。\n<\/li><li>\n别以为环境群不重要。同一个 A 放在 ℤ 和 ℤ/pℤ 里，σ 可以差很远；本书很多定理都要求&quot;无挠&quot;（torsion-free）或&quot;特征大&quot;。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nA = {1,2,3} ⊂ ℤ，|A+A| 是多少？（答案：5；解析：2 到 6 共五个值，注意 1+3=2+2 这类重复会合并。）\n<\/li><li>\n为什么 σ[A] = 1 意味着 A 是子群或陪集？（答案：因为 |A+A| = |A| 表示 A+A 与 A 同大小，而 A+A 包含 A+a₀ 的平移，只能是整个集合对加法封闭；解析：取 a₀∈A，A+a₀ ⊂ A+A 且大小相同，故 A+A = A+a₀，推出 A 对加法封闭。）\n<\/li><li>\n等比数列为什么是&quot;加法下无结构&quot;的典型？（答案：指数不同的二进制和几乎不重复，|B+B| 接近 n²/2，σ 接近 n/2；解析：2^i + 2^j 的二进制表示唯一确定 i、j。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加性集 = 集合 + 环境群，两个都要说。\n<\/li><li>\nσ[A] = |A+A|/|A|，是全书的结构温度计。\n<\/li><li>\n正问题给界，反问题给形状，两条线交错推进。\n<\/ul>", "kind": "chapter", "title": "第 0 章：导论"}, "ch01": {"html": "<h1>第 1 章：概率方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 0 章；概率论的期望、方差、独立\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用一阶矩、二阶矩、指数矩三种手段证明&quot;满足某性质的对象存在&quot;\n<\/li><li>\n说出 FKG、BK、Harris 三个相关不等式的适用条件，知道它们为什么要求&quot;单调事件&quot;\n<\/li><li>\n用 Lovász 局部引理处理有依赖的坏事件，用 Janson 不等式处理弱相关的情形\n<\/li><li>\n解释为什么&quot;随机构造&quot;能给出确定性结论\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>想证明存在一个集合 B 具有性质 P，只要设计一个随机集合，证明它满足 P 的概率大于零；四种矩方法分别对应四种&quot;概率不为零&quot;的估计方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一阶矩方法<\/h3>\n<p>若 X 是非负整数值随机变量，则 P(X &gt; 0) ≤ E X。反过来，如果 E X &lt; 1，就必然存在一个样本使 X = 0。这是最简单的&quot;存在性&quot;工具。<\/p>\n<p><strong>典型用法<\/strong>：数&quot;坏对象&quot;的期望个数。如果坏对象的期望个数小于 1，就存在一个对象不是坏的。<\/p>\n<p><strong>例子（无和集）<\/strong>：从 {1,...,n} 里随机选一个子集，每个元素以概率 p 独立入选。计算&quot;含 x+y=z&quot;的三元组期望个数，取 p 使期望小于 1，就能找到一个大小约 n/3 的无和集。这就是 Erdős 的经典结论：最大无和子集至少有 ⌈n/3⌉ 个元素。<\/p>\n<h3>概念 2：二阶矩方法<\/h3>\n<p>只有期望不够时，看方差。切比雪夫不等式给出 P(|X − EX| ≥ t) ≤ Var(X)/t²。常用形式是<\/p>\n<p>P(X &gt; 0) ≥ (EX)² / E(X²)。<\/p>\n<p>这个式子比一阶矩强的地方在于：它要求随机变量&quot;通常不为零&quot;，而不只是&quot;平均不为零&quot;。<\/p>\n<p><strong>例子<\/strong>：随机图里的三角形个数、随机集合里的表示次数，都适合先用期望判断量级，再用二阶矩确认它不集中在零附近。<\/p>\n<h3>概念 3：指数矩方法与 Chernoff 界<\/h3>\n<p>对独立的 0-1 变量之和 S，用 Markov 不等式作用在 e^{tS} 上，再对 t 优化，得到<\/p>\n<p>P(S ≥ (1+δ)μ) ≤ exp(−μδ²/3)，P(S ≤ (1−δ)μ) ≤ exp(−μδ²/2)。<\/p>\n<p>关键在&quot;对 t 优化&quot;这个动作：直接对 S 用 Markov 只能得到多项式型的界，套上指数函数再优化就能得到指数型衰减。这是后面大量证明里估计尾部概率的标准动作。<\/p>\n<h3>概念 4：相关不等式<\/h3>\n<p>FKG、BK、Harris 说的是同一件事的不同版本：<strong>如果事件是单调增的，那么它们正相关<\/strong>。<\/p>\n<p>比如&quot;随机子集包含某个固定元素&quot;是单调增事件，两个这样的事件同时发生的概率，不小于各自概率的乘积。这样就能把复杂的联合概率拆成乘积来估算。<\/p>\n<p>用的时候要注意两点：事件必须单调（增加元素不会让事件从真变假），测度必须是乘积测度。少一个条件，不等式就不成立。<\/p>\n<h3>概念 5：Lovász 局部引理与 Janson 不等式<\/h3>\n<p>局部引理处理的是&quot;坏事件之间有依赖，但每个坏事件只和少数几个坏事件相关&quot;的情形：若每个坏事件概率不超过 p，且每个坏事件最多与 d 个其他坏事件相关，当 e·p·(d+1) ≤ 1 时，所有坏事件都不发生的概率为正。<\/p>\n<p>Janson 不等式是它的&quot;求和版本&quot;，给出坏事件至少发生一个的概率上界，适用于弱相关的情形。<\/p>\n<p>两者的差别：局部引理要&quot;依赖度有界&quot;，Janson 要&quot;依赖结构可以用图上的边来量化&quot;。做题时先看依赖图的度，度小用 LLL，度大但边少用 Janson。<\/p>\n<h3>概念 6：多项式集中<\/h3>\n<p>随机变量是低次多项式时（比如随机图的边数、随机集合的表示函数），可以用&quot;改变一个变量最多改变多少&quot;来度量集中程度。这类结果在本书里用来处理不能用独立性和给出的量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[要证存在] --&gt; B[设计随机对象]\n    B --&gt; C{坏事件多不多}\n    C --&gt;|期望小于1| D[一阶矩]\n    C --&gt;|通常不为0| E[二阶矩]\n    C --&gt;|尾部要指数小| F[指数矩]\n    C --&gt;|事件单调| G[相关不等式]\n    C --&gt;|依赖有界| H[局部引理]\n    C --&gt;|弱相关求和| I[Janson]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：想证明&quot;会场里存在一个不说话的人&quot;，不必挨个去问。可以随机点一个人，算他说话的概率；如果平均说话人数小于 1，就必然有沉默的人。二阶矩相当于再确认&quot;大多数人确实在说话&quot;，否则平均数小于 1 也可能只是少数人说了很多话。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只在&quot;人数有限、概率可算&quot;时成立。连续分布或者无限集合上，需要先做截断。<\/p>\n<p><strong>实例（薄基）<\/strong>：自然数的一个基是指 A+A 覆盖所有足够大的整数。用概率方法可以构造出&quot;薄&quot;的基：让 A 在 [1,N] 里随机选取，密度约 √(log N / N)，则几乎每个数都有表示，同时 |A| 远小于 N。这个构造的意义是：基可以很稀疏，稀疏到 |A| ≈ N^{1/2} 量级，而不是 N。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为概率方法给出了算法。它只证明存在，不给出构造；很多情况下确定性构造至今未知。\n<\/li><li>\n别以为&quot;期望小于 1&quot;就能推出&quot;一个坏对象都没有&quot;。它只能推出&quot;存在一个对象没有坏&quot;，这两个结论方向不同。\n<\/li><li>\n别以为相关不等式对任意事件都成立。去掉单调性，FKG 立刻失效，反例很容易构造。\n<\/li><li>\n别以为 Chernoff 界只对 0-1 变量有效。它有多种推广形式，但使用时必须核对独立性或负相关性条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 E X = 0.9 且 X 取非负整数，能推出什么？（答案：存在样本使 X=0；解析：若处处 X≥1，则 E X≥1，矛盾。）\n<\/li><li>\n为什么二阶矩方法比一阶矩&quot;更强&quot;？（答案：它估计的是 P(X&gt;0) 的下界，而一阶矩给的是上界；解析：两者方向不同，二阶矩用方差排除了&quot;集中在零附近&quot;的可能。）\n<\/li><li>\n局部引理中 e·p·(d+1) ≤ 1 这个条件在控制什么？（答案：控制依赖图的度数与坏事件概率的乘积；解析：每条依赖边贡献一份概率放大，度越大要求 p 越小。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四种矩：一阶给存在，二阶给不集中，指数矩给指数尾，相关不等式给联合概率。\n<\/li><li>\nLLL 看&quot;度&quot;，Janson 看&quot;边&quot;。\n<\/li><li>\n随机构造只证存在，不构造算法。\n<\/ul>", "kind": "chapter", "title": "第 1 章：概率方法"}, "ch02": {"html": "<h1>第 2 章：和集估计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 0、1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 Ruzsa 距离和加性能量这两个量描述和集的大小\n<\/li><li>\n说清覆盖引理在做什么，为什么它是&quot;局部化&quot;的工具\n<\/li><li>\n叙述 BSG 定理的结论，知道它把&quot;能量大&quot;翻译成&quot;存在大子集使和集小&quot;\n<\/li><li>\n用多项式方法证明一个基本的和积估计\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>|A+B| 小不是一个孤立事实，它会牵动 |A−B|、能量、子集结构；Ruzsa 距离把这种牵动整理成了一个度量空间，BSG 定理是其中最锋利的转换器。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：和集的基本界<\/h3>\n<p>最平凡的上界是 |A+B| ≤ |A||B|。最平凡的下界是 |A+B| ≥ |A| + |B| − 1（在整数群里）。<\/p>\n<p>真正有用的是&quot;反向&quot;：如果 |A+B| 明显小于 |A||B|，说明 A、B 之间有加法关系。这种关系可以传递：|A+B| 小，往往意味着 |A−B| 也小。<\/p>\n<h3>概念 2：Ruzsa 距离<\/h3>\n<p>定义 d(A,B) = log( |A−B| / √(|A||B|) )。<\/p>\n<p><strong>为什么用差集而不是和集？<\/strong> 因为差集有对称性：A−B 与 B−A 大小相同，而 A+B 与 B+A 虽然也相同，但差集在群里有更好的代数性质（A−A 包含 0，是&quot;对称&quot;的）。<\/p>\n<p>这个 d 满足三角不等式：<\/p>\n<p>d(A,C) ≤ d(A,B) + d(B,C)。<\/p>\n<p>于是所有有限加性集构成一个度量空间。很多证明的思路就是&quot;先在 d 意义下靠近，再用覆盖引理把靠近翻译成集合层面的包含&quot;。<\/p>\n<p><strong>例子<\/strong>：A = [0,n−1]，B = [0,m−1]，则 |A−B| = n+m−1，d ≈ ½log(n/m) + 常数。两个长度相近的区间，距离接近 0。<\/p>\n<h3>概念 3：加性能量<\/h3>\n<p>E(A,B) = #{ (a,b,a&#x27;,b&#x27;) : a+b = a&#x27;+b&#x27; }。<\/p>\n<p>它数的是&quot;和相同的四元组&quot;有多少。E 大，说明 A+B 里每个元素有很多种表示，也就是加法关系密集。<\/p>\n<p>几个基本事实：<\/p>\n<ul><li>\nE(A,B) ≥ |A|²|B|² / |A+B|（由柯西不等式）。\n<\/li><li>\nE(A,A) 与 |A+A| 的关系是&quot;能量大 ⟺ 和集小&quot;的一条定量版本。\n<\/li><li>\n能量的加法结构可以用傅立叶系数表示：E(A,A) = Σ |Â(ξ)|⁴（第 4 章会用）。\n<\/ul>\n<h3>概念 4：覆盖引理<\/h3>\n<p>Ruzsa 覆盖引理：若 |A+B| ≤ K|B|，则存在 A&#x27; ⊂ A，|A&#x27;| ≤ K，使得 A ⊂ A&#x27; + B − B（差集的平移覆盖）。<\/p>\n<p>它的作用是把&quot;和集小&quot;变成&quot;整个 A 可以被少数几个 B−B 的平移盖住&quot;。这是一个局部化动作：原来要处理整个 A，现在只要处理一个大小受控的&quot;骨架&quot; A&#x27;。<\/p>\n<p>Green–Ruzsa 覆盖引理处理的是&quot;近似子群&quot;的情形，Chang 覆盖引理处理的是傅立叶谱的情形（第 5 章会用到）。<\/p>\n<h3>概念 5：BSG 定理<\/h3>\n<p>Balog–Szemerédi–Gowers 定理的粗略表述：<\/p>\n<p>如果加性能量 E(A,B) 接近最大值（即 |A+B| 远小于 |A||B|），那么存在 A&#x27; ⊂ A、B&#x27; ⊂ B，两者都只损失一个常数因子的大小，而 |A&#x27;+B&#x27;| 只比 |B&#x27;| 大常数倍。<\/p>\n<p>一句话：<strong>能量大 ⟹ 存在大子集，其和集很小<\/strong>。<\/p>\n<p>这条定理是整本书使用频率最高的工具之一。它的证明有两个版本：一个用图论（第 6 章），一个用依赖随机变量的方法。<\/p>\n<h3>概念 6：对称集与不平衡部分和集<\/h3>\n<p>A 是对称集指 A = −A（在群里）。对称集的和集、差集行为比一般集合规整。书里用&quot;部分和集&quot;来衡量 A 在某个方向上的投影有多大，从而把一般集合的问题归约到对称情形。<\/p>\n<h3>概念 7：非交换版本<\/h3>\n<p>前面的定义可以搬到非交换群上，代价是 A+B 与 B+A 不再相同，所有不等式都要写成双边形式。第 2.7 节给出了一批这样的结果。<\/p>\n<h3>概念 8：初等和积估计<\/h3>\n<p>在实数域上，考虑 A+A 与 A·A 的大小。直观上，一个集合不可能在加法和乘法下同时都很小：要么加法有结构（A 接近等差数列），要么乘法有结构（A 接近等比数列）。初等版本用 |A+A| 与 |A·A| 的下界给出<\/p>\n<p>max(|A+A|, |A·A|) ≥ c |A|^{1+ε}。<\/p>\n<p>证明手法是&quot;把乘法通过对数变成加法&quot;再套用和集估计，或者用整除性做组合计数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[和集小] --&gt; B[差集也小]\n    B --&gt; C[Ruzsa距离近]\n    C --&gt; D[覆盖引理]\n    A --&gt; E[能量大]\n    E --&gt; F[BSG定理]\n    F --&gt; G[大子集 和集仍小]\n    D --&gt; G\n    G --&gt; H[结构性结论]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把 A 想成一栋楼的住户，B 想成快递柜。|A+B| 是&quot;住户能取到的快递位置&quot;数量。如果这个数量很少，说明快递柜的位置和住户的住址高度重合——于是住户们其实挤在少数几栋楼里。覆盖引理就是在说&quot;少数几栋楼&quot;这件事，BSG 则进一步说&quot;存在一批住户和一批柜子，彼此贴得很近&quot;。<\/p>\n<p><strong>失效边界<\/strong>：这个类比假设了&quot;位置&quot;可以相加，现实里地址不是向量，套不上群结构。<\/p>\n<p><strong>实例<\/strong>：取 A = B = {0,1,2,3} ⊂ ℤ。A+A = {0,...,6}，|A+A| = 7，σ = 1.75。能量 E(A,A)：每个和 s 的表示数依次是 1,2,3,4,3,2,1，平方和 = 1+4+9+16+9+4+1 = 44。而 |A|²|B|²/|A+B| = 256/7 ≈ 36.6，44 比它大，符合理论下界。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Ruzsa 距离是普通距离。它是&quot;对数尺度&quot;上的距离，d=0 只说明 |A−B| = √(|A||B|)，不说明 A=B。\n<\/li><li>\n别以为能量大就一定有强结构。能量大只保证&quot;存在大子集&quot;结构好，子集之外的少数元素可以很乱。\n<\/li><li>\n别以为覆盖引理给出了 A 的完整结构。它给的是&quot;覆盖&quot;，覆盖用的骨架 A&#x27; 本身可能仍然很复杂。\n<\/li><li>\n别以为和积估计对任意环都成立。实数域用序结构，有限域要用多项式方法（第 9 章），两者的证明路线完全不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 |A|=|B|=n 且 |A+B|=n，能推出什么？（答案：A+B 与 B 同大小，存在 A&#x27; 大小为常数使 A 被 B−B 的平移覆盖；解析：这是 σ 极小的情形，直接用 Ruzsa 覆盖引理，K=1。）\n<\/li><li>\nRuzsa 距离为什么用差集定义而不是和集？（答案：差集满足 A−A 含 0、A−B 与 B−A 同大小，能形成度量；解析：和集在非交换群里失去对称性，三角不等式也不好证。）\n<\/li><li>\nBSG 定理的结论里，为什么只能保证&quot;子集&quot;而不是整个 A？（答案：少数异常元素可能破坏和集大小，取子集才能把损失控制在常数因子；解析：定理的证明通过随机抽样或图匹配挑出&quot;规矩&quot;的部分。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|A+B| 小会牵动 |A−B|，用 Ruzsa 距离统一度量。\n<\/li><li>\n能量 E 数的是&quot;同一和的多种表示&quot;，大能量 ⟹ 大子集结构好（BSG）。\n<\/li><li>\n覆盖引理是局部化工具，骨架大小受 K 控制。\n<\/li><li>\n和积不可能同时小，这是加法结构与乘法结构的互斥。\n<\/ul>", "kind": "chapter", "title": "第 2 章：和集估计"}, "ch03": {"html": "<h1>第 3 章：加性几何<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 2 章；线性代数；一点凸几何\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出广义等差数列的定义，算出它的体积上界\n<\/li><li>\n说清&quot;真&quot;等差数列与&quot;非真&quot;的区别，知道非真会带来什么麻烦\n<\/li><li>\n用 Brunn–Minkowski 不等式解释&quot;凸体相加会变大但不会大太多&quot;\n<\/li><li>\n说明 Minkowski 格点定理和 Blichfeldt 引理在做什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>等差数列、格、凸体、有限子群看起来是四类对象，但在加性结构上它们是同一件事的不同外观：都可以用&quot;维数、体积、生成元&quot;三个参数来描述。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：广义等差数列<\/h3>\n<p>一维的等差数列是 a, a+v, a+2v, ...。多维版本是<\/p>\n<p>P = a + [0,N₁]·v₁ + [0,N₂]·v₂ + ... + [0,N_d]·v_d，<\/p>\n<p>其中 a 是起点，v_i 是方向，N_i 是每个方向的长度。这样的集合叫秩为 d 的广义等差数列（GAP）。<\/p>\n<p>它的元素个数最多是 ∏(N_i+1)。如果实际个数就等于这个乘积，称它是<strong>真<\/strong>的（proper）；否则叫非真。<\/p>\n<p><strong>为什么在乎真不真？<\/strong> 非真的 GAP 里，不同的系数组合会撞到同一个元素，集合比&quot;看起来&quot;小。很多定理（比如 Freiman 定理的结论）需要真 GAP，或者需要&quot;低秩&quot;来控制这种塌缩。<\/p>\n<p><strong>例子<\/strong>：P = [0,2]·1 + [0,2]·2 = {0,1,2,4,5,6,8,9,10}，共 9 个，等于 3×3，是真 GAP。若取 v₂ = 3，得到 {0,1,2,3,4,5,6,7,8}，也只有 9 个，仍是真；但取 v₂ = 1，就只有 {0,1,2,3}，缩成 4 个，非真。<\/p>\n<h3>概念 2：加性群与子群<\/h3>\n<p>加性群指带加法结构的交换群。有限子群是&quot;完全有结构&quot;的极端：σ = 1。理解子群是为了理解&quot;什么时候集合对加法封闭&quot;，这是反向定理的终点。<\/p>\n<h3>概念 3：凸体<\/h3>\n<p>凸体是有内点的紧凸集。在 ℝ^d 里，凸体的&quot;体积&quot;和&quot;格点个数&quot;通过 Minkowski 理论联系：体积大，就必然包含非零格点。<\/p>\n<p><strong>Brunn–Minkowski 不等式<\/strong>：<\/p>\n<p>|A+B|^{1/d} ≥ |A|^{1/d} + |B|^{1/d}。<\/p>\n<p>它说明凸体相加时，&quot;线性尺度&quot;是可加的，体积按 d 次方增长。这条不等式是&quot;几何直观&quot;和&quot;加性组合&quot;之间最直接的桥。<\/p>\n<h3>概念 4：格与格点定理<\/h3>\n<p>格是 ℝ^d 里由 d 个线性无关向量生成的离散子群。Minkowski 格点定理：若凸体 K 关于原点对称、体积大于 2^d det(Λ)，则 K 包含非零格点。<\/p>\n<p>Blichfeldt 引理是它的&quot;非对称版本&quot;：体积大于 det(Λ) 的集合，必有两个点差属于格。<\/p>\n<p>这两条定理在书里用来把&quot;连续体积&quot;转成&quot;离散个数&quot;，也是第 8 章关联几何的前置。<\/p>\n<h3>概念 5：真化与提升<\/h3>\n<p>给定一个非真 GAP，能不能换一组方向使它变真、同时体积不变太多？第 3.6 节讨论这个问题。结论大致是：可以用&quot;提升维数&quot;或者&quot;换基&quot;的方式真化，代价是维数或体积的常数因子。<\/p>\n<p>这个问题看起来技术性很强，但它是 Freiman 定理证明里的关键一步：结构定理给出的 GAP 未必真，必须真化才能做后续计数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[子群] --&gt; D[低维结构]\n    B[等差数列] --&gt; D\n    C[格] --&gt; D\n    E[凸体] --&gt; D\n    D --&gt; F[Freiman定理的结论形态]\n    F --&gt; G[真化与提升]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：GAP 像一张多维的网格纸，每个方向可以拉伸不同的倍数。真 GAP 是&quot;网格点没有重叠&quot;，非真 GAP 是&quot;纸被折起来，不同的格点叠到了一起&quot;。<\/p>\n<p><strong>失效边界<\/strong>：网格是离散的，凸体是连续的；类比只覆盖&quot;方向 + 长度&quot;这一层，不覆盖体积与格点的换算。<\/p>\n<p><strong>实例<\/strong>：d = 2，N = (2,2)，体积上界 9。取 v₁=(1,0)，v₂=(0,1)，得到 3×3 的方块，真。取 v₁=(1,0)，v₂=(1,1)，得到的是斜的平行四边形，仍然 9 个点，真。取 v₁=(1,0)，v₂=(2,0)，得到 {0,...,6} 里的一条线，只有 7 个点，非真——两个方向共线了。<\/p>\n<p>这个例子说明：真化本质上要求方向&quot;足够独立&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 GAP 的秩等于环境群的维数。秩是生成方向的个数，可以远小于环境群维数。\n<\/li><li>\n别以为真 GAP 的体积就等于元素个数。只有在方向&quot;整数独立&quot;且长度不冲突时才相等，一般只能给上界。\n<\/li><li>\n别以为 Brunn–Minkowski 对非凸集也成立。凸性是必要条件，去掉之后不等式反向都可能。\n<\/li><li>\n别以为格点定理只和数论有关。它在本章的作用是把几何体积翻译成组合计数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n秩为 3、长度各为 2 的 GAP 最多有多少个元素？（答案：27；解析：每个方向 0、1、2 三种取值，3³=27。）\n<\/li><li>\n为什么 Freiman 定理的结论要求&quot;低秩&quot;？（答案：秩低意味着结构简单、可用少量参数描述；解析：秩高时 GAP 体积指数增长，无法保证它不比 A 大太多。）\n<\/li><li>\nMinkowski 定理里&quot;对称&quot;这个条件能去掉吗？（答案：不能直接用，去掉后要用 Blichfeldt 引理或者其他版本；解析：对称性保证了若 x 在 K 内则 −x 也在，从而差属于 K+K。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nGAP = 起点 + 若干方向 + 各方向长度；真 = 不塌缩。\n<\/li><li>\n凸体相加，线性尺度可加：|A+B|^{1/d} ≥ |A|^{1/d}+|B|^{1/d}。\n<\/li><li>\n体积转个数靠 Minkowski 与 Blichfeldt。\n<\/li><li>\n真化是结构定理落地的最后一公里。\n<\/ul>", "kind": "chapter", "title": "第 3 章：加性几何"}, "ch04": {"html": "<h1>第 4 章：傅立叶分析方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 1、2 章；复变函数与内积空间\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出有限交换群上的特征、傅立叶变换与 Parseval 恒等式\n<\/li><li>\n用线性偏差解释&quot;一个集合偏向某个方向&quot;是什么意思\n<\/li><li>\n说清 Bohr 集为什么是&quot;伪随机性&quot;的度量工具\n<\/li><li>\n用傅立叶系数表达加性能量，并解释它给出的和集下界\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>傅立叶变换把加法卷积变成逐点相乘，于是&quot;和集有多大&quot;&quot;能量有多高&quot;这些加法问题，变成了&quot;系数有多集中&quot;的乘法问题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：特征与傅立叶系数<\/h3>\n<p>在有限交换群 Z 上，一个特征是从 Z 到单位圆的同态 ξ: Z → ℂ，满足 ξ(x+y) = ξ(x)ξ(y)。对 ℤ/Nℤ，特征就是 ξ_r(x) = e^{2πirx/N}。<\/p>\n<p>函数 f 的傅立叶变换是<\/p>\n<p>f̂(ξ) = Σ_x f(x) ξ(x) 的共轭，<\/p>\n<p>也就是 f 在每个频率上的投影。集合 A 的指示函数 1_A 的变换记作 Â(ξ)，它衡量 A 与频率 ξ 的&quot;对齐程度&quot;。<\/p>\n<h3>概念 2：三个基本恒等式<\/h3>\n<ul><li>\n<strong>逆变换<\/strong>：f 可以由所有 f̂ 重构。\n<\/li><li>\n<strong>Parseval<\/strong>：Σ_x |f(x)|² = (1/|Z|) Σ_ξ |f̂(ξ)|²。能量守恒。\n<\/li><li>\n<strong>卷积定理<\/strong>：(f * g)̂ = f̂ · ĝ。这条是把加法变乘法的关键。\n<\/ul>\n<p>有了卷积定理，A+B 的指示函数（本质是 1_A * 1_B）的傅立叶系数就是 Â·B̂，问题立刻从集合层面降到系数的乘积上。<\/p>\n<h3>概念 3：线性偏差<\/h3>\n<p>若 Â(ξ) 明显不为零，称 A 在频率 ξ 上有线性偏差。直观上，A 的元素在&quot;相位 ξ(x)&quot;这个圆周上分布不均匀，偏向某个方向。<\/p>\n<p>偏差的直接后果是：A 在某条&quot;模某个频率&quot;的等差结构上有超出随机的比例。这是第 10 章 Roth 定理的出发点。<\/p>\n<p><strong>例子<\/strong>：A 是 [1,N] 里的偶数，取 ξ(x) = (−1)^x，则 Â(ξ) = |A|，偏差最大。这说明&quot;全是偶数&quot;在频率 1 上是完全对齐的。<\/p>\n<h3>概念 4：Bohr 集<\/h3>\n<p>给定一组频率 Δ 和半径 ρ，Bohr 集是<\/p>\n<p>B(Δ, ρ) = { x : 对所有 ξ∈Δ，|ξ(x) − 1| ≤ ρ }。<\/p>\n<p>它是&quot;在若干频率上同时接近 1&quot;的元素的集合，可以理解为&quot;多条等差条件的交集&quot;。在 Z/NZ 里，Bohr 集就是低维 GAP 的傅立叶对偶。<\/p>\n<p>为什么需要它？因为在傅立叶证明里，偏差出现的频率集合往往不是独立的，直接当作独立方向会高估结构。Bohr 集给出了&quot;这些频率共同定义的子群&quot;的正确大小，从而把密度增量控制在可接受范围内。<\/p>\n<h3>概念 5：(p) 常数与 Bh[g] 集<\/h3>\n<p>(p) 常数衡量一个群里的&quot;加法随机性&quot;：对小整数 p，计数 p 元组 (x₁,...,x_p) 满足 x₁+...+x_p=0 的比例偏离 1/|Z| 多少。<\/p>\n<p>Bh[g] 集（也叫 B_h 集）是&quot;每种和最多有 g 种表示&quot;的集合，是 Sidon 集的推广（Sidon 对应 g=1）。它们刻画的是加法表示的稀疏程度，与和集大小是同一件事的两面。<\/p>\n<h3>概念 6：分离集与谱<\/h3>\n<p>分离集指元素之间没有短小的整数线性关系，类似&quot;加法意义上线性无关&quot;。集合 A 的谱是那些使 |Â(ξ)| 大的频率组成的集合。谱小 ⟹ A 的结构接近低维 GAP；谱大 ⟹ A 更随机。<\/p>\n<p>这条&quot;谱大小 ↔ 结构强弱&quot;的对应，是第 5 章反向定理的傅立叶版本。<\/p>\n<h3>概念 7：和集中的等差数列<\/h3>\n<p>本节的核心结论是：只要 A 的傅立叶偏差足够小，A+A 就几乎填满整个群；反过来，若 A+A 没有填满，就必然存在明显的频率偏差。<\/p>\n<p>证明套路是&quot;若没有偏差，则能量小，则和集大&quot;，逆否命题就是&quot;和集小则一定有偏差&quot;。这也是第 10 章密度增量论证的雏形。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; B[傅立叶系数]\n    B --&gt; C[Parseval 能量守恒]\n    B --&gt; D[卷积定理]\n    D --&gt; E[和集大小]\n    C --&gt; F[加性能量]\n    B --&gt; G[线性偏差]\n    G --&gt; H[Bohr集]\n    H --&gt; I[密度增量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把集合想成一段音频信号。时域里看是&quot;哪些位置有声音&quot;，频域里看是&quot;哪些音高在共振&quot;。傅立叶系数就是每个音高的音量。加法卷积在时域里是&quot;回声叠加&quot;，在频域里只是音量相乘——这是它好用的原因。<\/p>\n<p><strong>失效边界<\/strong>：音频是连续的，有限群上的频率是离散的；另外集合只有 0/1 值，没有振幅，类比丢掉了这一点。<\/p>\n<p><strong>实例<\/strong>：Z = ℤ/8ℤ，A = {0,1,2,3}。Â(0) = 4。Â(4) = Σ_x 1_A(x)(−1)^x = 1−1+1−1 = 0。Â(2) = Σ 1_A(x) i^x = 1+i−1−i = 0。Â(1) = 1 + e^{−iπ/4} + e^{−iπ/2} + e^{−i3π/4}，模长约为 2.6，偏差明显。<\/p>\n<p>这说明&quot;前一半&quot;这个集合在频率 1 上有偏差，符合直觉：它不是随机的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Â(ξ) 大就一定有等差数列。偏差只说明&quot;偏向某个频率&quot;，方向可能很复杂。\n<\/li><li>\n别以为 Parseval 是&quot;能量守恒&quot;的物理定律。它只是内积空间里的勾股定理在群上的写法。\n<\/li><li>\n别以为 Bohr 集就是 GAP。两者在特定群里有对应关系，但 Bohr 集的定义依赖频率集合，不总是能写成低维 GAP。\n<\/li><li>\n别以为傅立叶方法能处理 k≥4 的 Szemerédi 定理。线性傅立叶只能看到&quot;一维偏差&quot;，k≥4 需要 Gowers 范数（第 11 章）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出有限群上 Parseval 恒等式，并说明它为什么能用来估能量。（答案：Σ|f|² = (1/|Z|)Σ|f̂|²；解析：把 f 取成 1_A，左边是 |A|，右边给出系数的平方和，与能量的傅立叶表达相联。）\n<\/li><li>\n为什么 A 全是偶数时，Â 在频率 1 上最大？（答案：特征 (−1)^x 在偶数上取 1，所有项同号相加；解析：偏差等于&quot;每个元素都对齐同一个相位&quot;。）\n<\/li><li>\n傅立叶方法为什么对 k=4 失效？（答案：线性相位只能检测一维偏差，k≥4 需要更高阶的均匀性范数；解析：Gowers 范数本质上是高阶傅立叶，普通傅立叶是它的 k=2 情形。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n卷积定理是整章的发动机：加法变乘法。\n<\/li><li>\n偏差大 ⟹ 结构强；无偏差 ⟹ 和集大。\n<\/li><li>\nBohr 集是&quot;多频率对齐&quot;的正确几何。\n<\/li><li>\n能量的傅立叶形式是 Σ|Â|⁴。\n<\/ul>", "kind": "chapter", "title": "第 4 章：傅立叶分析方法"}, "ch05": {"html": "<h1>第 5 章：逆和集定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>预估学时<\/strong>：14 小时 | <strong>前置<\/strong>：第 2、3、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清&quot;正向估计&quot;和&quot;逆向结构&quot;的分界：知道 σ 小到什么程度才能得到什么结论\n<\/li><li>\n用 e-变换解释为什么可以假设集合对称、且和集最小\n<\/li><li>\n写出 Freiman 同态的定义，并说明它为什么比群同态弱\n<\/li><li>\n叙述无挠情形下的 Freiman 定理：小倍增 ⟹ 低秩 GAP\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>第 2 章告诉我们&quot;和集小会牵动别的和集&quot;，本章要回答更硬的问题：和集小，A 本身长什么样？答案是无挠时 A 落在一个低秩等差数列里，有挠时要先把挠部分分离出去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题为什么难<\/h3>\n<p>&quot;|A+A| ≤ K|A|&quot;只是一个大小的约束。满足它的集合可以很不一样：子群、等差数列、GAP，甚至它们的并集加几个杂点。要从一个数量不等式反推出结构，必须找到一种&quot;只依赖加性关系&quot;的规范形式，把所有等价的外观统一掉。<\/p>\n<h3>概念 2：e-变换<\/h3>\n<p>给定集合 A 和元素 a∈A，e-变换把 A 换成 (A ∪ (A+a)) 或者 (A ∩ (A+a)) 的某种组合，目标是在保持 |A+A| 不增的前提下，让集合更&quot;对称&quot;、更&quot;规整&quot;。<\/p>\n<p>它的作用像&quot;整理房间&quot;：不改变房间总面积（和集大小），但把东西挪到该在的位置，方便后面描述。<\/p>\n<p>反复做 e-变换，可以假设 A 满足&quot;对称性&quot;和&quot;极小性&quot;，这是很多证明的第一步归约。<\/p>\n<h3>概念 3：Freiman 同态<\/h3>\n<p>φ: A → B 是 Freiman 同态，指它保持加法关系：若 a₁+a₂ = a₃+a₄（在 A 所在的群里），则 φ(a₁)+φ(a₂) = φ(a₃)+φ(a₄)。<\/p>\n<p>它比群同态弱得多：不需要对 A 之外的元素有定义，也不要求单射。但它足够强，能把&quot;加法结构&quot;从一个集合搬到另一个集合。<\/p>\n<p><strong>例子<\/strong>：A = {0,1,2}，B = {0,1,4}，φ(0)=0, φ(1)=1, φ(2)=4。A 里 0+2 = 1+1，映射后 0+4 = 1+1 不成立，所以 φ 不是 Freiman 同态。换 φ(2)=2 就行。<\/p>\n<h3>概念 4：无挠情形下的 Freiman 定理<\/h3>\n<p>定理大意：若 A ⊂ ℤ^d 且 |A+A| ≤ K|A|，则存在秩不超过 d(K)、大小不超过 C(K)|A| 的 GAP，包含 A。<\/p>\n<p>这里 d(K) 和 C(K) 只依赖 K，不依赖 |A|。这是&quot;小倍增 ⟹ 低秩结构&quot;的定量版本，也是全书最重要的结构定理。<\/p>\n<p>K 很小（σ &lt; 2 或 &lt; 3）时，结论可以精确到&quot;子群 + 小扰动&quot;或者&quot;低维 GAP&quot;。K 到 log|A| 量级时，只能给出 GAP，秩和体积都变大。<\/p>\n<h3>概念 5：挠与无挠<\/h3>\n<p>群里有元素满足 mx = 0（m 为正整数），叫有挠。ℤ/Nℤ 全是挠，ℤ^d 无挠。<\/p>\n<p>有挠时，A 可能落在&quot;子群 + GAP&quot;的混合结构里，比如 A 的一部分落在一个有限子群里，另一部分沿某个方向排开。这时不能指望单一 GAP 描述，必须先做&quot;挠部分分离&quot;。<\/p>\n<h3>概念 6：万能环境群<\/h3>\n<p>给定 A 的加法关系，可以构造一个&quot;最大&quot;的群，使 A 嵌入其中且所有加法关系保持。这叫万能环境群，作用是让&quot;结构定理&quot;不依赖具体的环境群：先把 A 搬到一个规范的大群里，再在里面找 GAP。<\/p>\n<p>这一步是技术性的，但很关键：没有它，定理在不同环境群里要分别陈述，没法统一。<\/p>\n<h3>概念 7：任意群里的 Freiman 定理<\/h3>\n<p>最终版本把&quot;无挠&quot;换成&quot;商掉挠子群&quot;：A 落在一个&quot;低秩 GAP + 有限子群&quot;的结构里，参数只依赖 K。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[小倍增] --&gt; B[e变换]\n    B --&gt; C[对称化与极小化]\n    C --&gt; D{有挠吗}\n    D --&gt;|无挠| E[低秩GAP]\n    D --&gt;|有挠| F[分离挠部分]\n    F --&gt; G[GAP加有限子群]\n    E --&gt; H[Freiman定理]\n    G --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：一堆散落的棋子，如果它们&quot;两两相加的结果很少&quot;，说明棋子其实排在一张规则的棋盘上。e-变换是把棋子挪到棋盘的格点上，Freiman 定理是说&quot;一定能找到这样一张棋盘，格子数不超过棋子数的常数倍&quot;。<\/p>\n<p><strong>失效边界<\/strong>：棋盘是二维的，定理里的秩可能很高；类比也看不出&quot;常数倍&quot;到底多大。<\/p>\n<p><strong>实例<\/strong>：A = {0,1,2,3,4} ⊂ ℤ。|A+A| = 9，σ = 1.8。A 本身就是秩 1、长度 4 的 GAP，定理结论平凡成立。<\/p>\n<p>再取 A = {0,1,2} ∪ {100,101,102}。|A+A| 比 6 大不少，σ ≈ 3 左右。它不是一个 GAP，但可以被两个长度 2 的 GAP 覆盖——这说明&quot;覆盖&quot;和&quot;包含&quot;是两回事，定理给的是包含于一个更大的 GAP。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Freiman 定理给出了 A 的精确形状。它只保证 A 落在一个 GAP 里，GAP 里可能有大量不属于 A 的点。\n<\/li><li>\n别以为常数 C(K) 很小。K 增大时 C(K) 增长很快，实际应用里经常只能得到&quot;存在但巨大&quot;的界。\n<\/li><li>\n别以为有挠只是技术细节。ℤ/Nℤ 里的结构可以完全是子群，跟整数情形差别很大。\n<\/li><li>\n别以为 Freiman 同态就是群同态。它只保持 A 内部的加法关系，定义域外的东西不管。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n为什么 e-变换要保持 |A+A| 不增？（答案：它是归约工具，若和集变大就失去了&quot;小倍增&quot;的前提；解析：所有后续估计都建立在 |A+A| ≤ K|A| 上。）\n<\/li><li>\nFreiman 定理的结论里，GAP 的秩依赖什么？（答案：只依赖倍增常数 K，不依赖 |A|；解析：这正是定理&quot;定量结构&quot;的体现。）\n<\/li><li>\n有挠群里为什么不能直接套无挠版本？（答案：子群部分会破坏&quot;单一 GAP 包含&quot;的结论；解析：需要先把挠部分分离，再对无挠商施用定理。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n正向给大小，逆向给形状；本章是逆向。\n<\/li><li>\ne-变换负责&quot;整理&quot;，不改变和集大小。\n<\/li><li>\nFreiman：小倍增 ⟹ 低秩 GAP，参数只依赖 K。\n<\/li><li>\n有挠先分离，无挠再套定理。\n<\/ul>", "kind": "chapter", "title": "第 5 章：逆和集定理"}, "ch06": {"html": "<h1>第 6 章：图论方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 2 章；基础图论\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 Turán 定理给出独立集的下界，并说明它怎么用来构造无和集\n<\/li><li>\n解释 Ramsey 定理与 van der Waerden 定理的关系\n<\/li><li>\n用图的连通性重述 BSG 定理的证明思路\n<\/li><li>\n写出 Plünnecke 不等式的适用条件，知道它为什么比 BSG 更&quot;正向&quot;\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把加法关系画成图，和集大小就变成了&quot;顶点覆盖&quot;或&quot;边密度&quot;；图论里的独立集、匹配、连通性，分别对应组合里的无和集、部分和、结构提取。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么加性组合学会用到图<\/h3>\n<p>很多加性问题可以先固定一侧：给定 A，把每个 a∈A 和它对应的&quot;伙伴&quot;用边连起来。于是&quot;存在一个没有某种和结构的子集&quot;等价于&quot;图里存在独立集&quot;；&quot;某个元素表示次数很多&quot;等价于&quot;某个顶点度数很高&quot;。图论工具处理的就是这些度数、连通性、独立集的问题。<\/p>\n<h3>概念 2：Turán 定理与无和集<\/h3>\n<p>Turán 定理：n 个顶点、e 条边的图，独立集至少有 n²/(2e+n) 个顶点。<\/p>\n<p>应用方式：把&quot;禁止出现的和&quot;作为边。若 A 是无和集（A 中不存在 x+y=z），要构造尽量大的无和子集。把 {1,...,n} 里所有满足 x+y=z 的 (x,z) 连边，得到一个图，独立集就是无和集。代入 e 的估计就得到&quot;最大无和集至少 n/3&quot;这类结论。<\/p>\n<p><strong>要点<\/strong>：Turán 给的是下界，构造用的是&quot;取最大独立集&quot;，不需要显式写出来。<\/p>\n<h3>概念 3：Sidon 集与独立集<\/h3>\n<p>Sidon 集指所有两两和 a+b（a≤b）互不相同。它等价于说&quot;把和当边时图里没有长度为 2 的重复路径&quot;。<\/p>\n<p>Sidon 集的大小上界约为 √n（在 [1,n] 里），这个界可以用计数直接得到，也可以用图论里的&quot;三角形个数&quot;来证。<\/p>\n<h3>概念 4：Ramsey 与 van der Waerden<\/h3>\n<p>Ramsey 定理：给足够大的完全图的边染 r 种颜色，必有一种颜色包含一个大小给定的单色团。<\/p>\n<p>van der Waerden 定理：把足够长的整数区间染成 r 种颜色，必有一种颜色包含任意长的等差数列。<\/p>\n<p>两者的关系是&quot;结构版本的抽屉原理&quot;：颜色数固定、长度固定，只要区间足够长，单色结构必然出现。第 6.3 节用 Ramsey 定理给出 van der Waerden 的一个证明。<\/p>\n<p><strong>注意<\/strong>：这些定理给的是&quot;存在&quot;，界通常巨大（Ackermann 级别），不能直接用于定量估计。<\/p>\n<h3>概念 5：用连通性证明 BSG<\/h3>\n<p>BSG 定理要证&quot;能量大 ⟹ 存在大子集使和集小&quot;。图论版本的思路：<\/p>\n<ol><li>\n把 A、B 之间的&quot;和关系&quot;建成一个二分图，边表示 a+b 落在某个小集合里。\n<\/li><li>\n能量大意味着边多。\n<\/li><li>\n边多的图要么有一个度数很高的顶点，要么有一块稠密的子图。\n<\/li><li>\n稠密子图里可以抽出大的匹配或连通块，对应到 A&#x27;、B&#x27;。\n<\/li><li>\n连通性保证 A&#x27;+B&#x27; 被少数几个平移覆盖，于是和集小。\n<\/ol>\n<p>这条证明的好处是&quot;只看边数，不看加法细节&quot;，因此可以推广到非交换群。<\/p>\n<h3>概念 6：Plünnecke 不等式<\/h3>\n<p>Plünnecke 的结果大致是：若 |A+B| ≤ K|B|，则对任意正整数 k、l，<\/p>\n<p>|kA + lB| ≤ K^{k+l} |B|。<\/p>\n<p>其中 kA 表示 A 的 k 重和集。它把&quot;一次相加的膨胀率&quot;控制住，就自动控制了多次相加的膨胀率。<\/p>\n<p>和 BSG 的区别：BSG 是&quot;能量大 ⟹ 找子集&quot;，是逆向的、要损失子集；Plünnecke 是&quot;一次小 ⟹ 多次也小&quot;，是正向的、不损失集合。两者配合使用：先用 Plünnecke 控制多次和集，再用 BSG 从能量反推结构。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[加法关系] --&gt; B[二分图]\n    B --&gt; C[度数]\n    B --&gt; D[独立集]\n    B --&gt; E[连通性]\n    C --&gt; F[表示次数]\n    D --&gt; G[无和集与Sidon集]\n    E --&gt; H[BSG证明]\n    B --&gt; I[Plunnecke不等式]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把加性关系想成&quot;社交网络&quot;。两个人如果能凑出某个和，就连一条边。无和集就是&quot;互不相连的一群人&quot;（独立集）；表示次数多就是&quot;某人是社交中心&quot;（高度数顶点）；BSG 就是说&quot;如果网络里的边特别多，必然有一块小圈子内部联系极密&quot;。<\/p>\n<p><strong>失效边界<\/strong>：社交网络是有向、带权、随时间变化的，这里的图是静态简单图。<\/p>\n<p><strong>实例<\/strong>：A = {1,2,...,n}，把 x+y=z 的 (x,z) 连边。顶点 z 的度数约等于&quot;z 有多少种拆分&quot;，最大约 n/2。用 Turán 定理估独立集，e 约 n²/4（每个 z 有 O(z) 种拆分，求和约 n²/4），代入得独立集 ≥ n²/(2e+n) ≈ n²/(n²/2) ≈ 2，这个下界太弱——实际最大无和集是 ⌈n/2⌉ 个奇数。这说明 Turán 是通用工具，具体问题上还要挑更好的图或者更细的计数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Turán 定理给出的界总是紧的。它只保证存在，界经常很松。\n<\/li><li>\n别以为 Ramsey 定理能给出可用的定量界。它的界增长极快，实际证明里只用来保证存在。\n<\/li><li>\n别以为 Plünnecke 和 BSG 是一回事。前者不损失集合，后者必须损失到子集。\n<\/li><li>\n别以为图论方法只适用于离散集合。它也能处理连续群，只要能把关系离散化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nTurán 定理的独立集下界公式是什么？（答案：n²/(2e+n)；解析：由平均度数推出存在大独立集的经典估计。）\n<\/li><li>\n为什么 Plünnecke 不等式里指数是 k+l？（答案：每多一层和集就多乘一次膨胀率 K；解析：|kA+lB| 相当于做了 k+l 次&quot;加 B&quot;的操作。）\n<\/li><li>\nBSG 的图论证明里，为什么要找&quot;连通块&quot;而不只是&quot;匹配&quot;？（答案：连通性才能保证子集的和被少数平移覆盖；解析：匹配只保证配对，不保证整体结构。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图是加法关系的&quot;骨架&quot;，独立集对应无和集。\n<\/li><li>\nRamsey 与 van der Waerden 是存在性工具，界不可用。\n<\/li><li>\nBSG 逆向、Plünnecke 正向，配合使用。\n<\/li><li>\n度数大 ⟹ 表示次数多 ⟹ 能量大。\n<\/ul>", "kind": "chapter", "title": "第 6 章：图论方法"}, "ch07": {"html": "<h1>第 7 章：Littlewood–Offord 问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1、4 章；线性代数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清 Littlewood–Offord 问题在问什么：子集和最多能重复多少次\n<\/li><li>\n用 Sperner 定理和傅立叶两种方法给出集中上界\n<\/li><li>\n叙述 Esséen 集中不等式，知道它为什么只依赖步长的平方和\n<\/li><li>\n解释随机 Bernoulli 矩阵为什么大概率可逆，以及逆 Littlewood–Offord 在其中的作用\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>给 d 个步长 v₁,...,v_d，考虑所有 2^d 个带符号和；Littlewood–Offord 问这些和最多能挤到多密，逆问题问如果挤得很密，步长必须长什么样。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题设定<\/h3>\n<p>取 v₁,...,v_d ∈ Z，考虑 2^d 个和<\/p>\n<p>ε₁v₁ + ... + ε_dv_d，ε_i ∈ {−1, +1}。<\/p>\n<p>如果步长都是 1，和只取 −d, −d+2, ..., d 共 d+1 个值，平均每个值有 2^d/(d+1) 个表示，集中度约 2^d/d。<\/p>\n<p>如果步长是 2 的幂，每个和都唯一，集中度为 1。<\/p>\n<p>前者是&quot;最集中&quot;的极端，后者是&quot;最分散&quot;的极端。Littlewood–Offord 要给出前者到底能多集中。<\/p>\n<h3>概念 2：组合方法（Sperner）<\/h3>\n<p>把每个子集对应到 {1,...,d} 的子集。若所有步长非零且互不相同（或者满足一定的&quot;无短关系&quot;条件），可以证明最大重数不超过 C(2d,d) 量级，也就是约 2^d/√d。<\/p>\n<p><strong>直觉<\/strong>：要让两个不同的符号向量给出同一个和，必须有 Σ δ_i v_i = 0，其中 δ_i ∈ {−2,0,2}。步长越&quot;独立&quot;，这种关系越少。<\/p>\n<p>Sperner 定理在这里的作用是：把&quot;和为定值&quot;的族看成反链，反链大小受组合数控制。<\/p>\n<h3>概念 3：傅立叶方法<\/h3>\n<p>集中度可以写成概率形式：随机取 ε_i，问 P(Σ ε_i v_i = x) 最大是多少。用傅立叶展开，这个概率等于<\/p>\n<p>(1/|Z|) Σ_ξ ∏ cos(2π ξ(v_i)/|Z|)。<\/p>\n<p>要估这个式子，就要控制连乘积的衰减。步长越&quot;分散&quot;，cos 因子衰减越快，概率越小。这条路线给出的是&quot;依赖步长分布&quot;的界，比纯组合方法更细。<\/p>\n<h3>概念 4：Esséen 集中不等式<\/h3>\n<p>Esséen 的结果给出集中函数的上界，形式大致是<\/p>\n<p>sup_x P(Σ ε_i v_i = x) ≤ C / √(Σ |v_i|²)。<\/p>\n<p>它只依赖步长的平方和，不依赖步长之间的具体关系。这条不等式在随机矩阵、概率论里用得很广。<\/p>\n<p><strong>为什么只依赖平方和？<\/strong> 因为带符号和的方差就是 Σ|v_i|²，集中度不会超过&quot;方差给出的上限&quot;太多。这是&quot;用二阶矩控制集中&quot;的典型。<\/p>\n<h3>概念 5：逆 Littlewood–Offord<\/h3>\n<p>正向问&quot;最多能多集中&quot;，逆向问&quot;如果集中度很大，步长必须满足什么&quot;。<\/p>\n<p>结论大致是：若存在 x 使 P(Σ ε_i v_i = x) 很大，则绝大部分 v_i 落在一个低秩 GAP 里（除去少数例外）。这和 Freiman 定理的形状完全平行：集中度大 ⟺ 步长有加性结构。<\/p>\n<p>证明思路：先用 Esséen 得到&quot;方差不能太大&quot;，再用傅立叶/组合方法把&quot;集中&quot;翻译成&quot;步长之间的整数关系多&quot;，最后套用 Freiman 型结构定理。<\/p>\n<h3>概念 6：随机 Bernoulli 矩阵<\/h3>\n<p>一个 n×n 的 0-1 随机矩阵，元素独立、取 1 的概率 1/2。它奇异的概率有多大？<\/p>\n<p>如果两列相同，就奇异。两列相同的概率是 2^{−n}，列对数是 n²，所以&quot;有相同列&quot;的概率约 n²2^{−n}，很小。但奇异还有别的成因，比如某列是其他列的整系数组合。<\/p>\n<p>用逆 Littlewood–Offord 可以证明：奇异概率大约是 (1/2 + o(1))^n 量级。思路是&quot;若矩阵奇异，则存在非零整数向量 x 使 Ax=0，即若干列的和为零，这正是一个集中事件&quot;。<\/p>\n<h3>概念 7：二次 Littlewood–Offord<\/h3>\n<p>把线性关系换成二次型：问 ε_i 的二次表达式集中到什么程度。这类问题出现在随机二次型、图谱理论里。结论的形式和线性情形类似，但&quot;结构&quot;变成了&quot;低秩二次型&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[步长向量] --&gt; B[带符号和]\n    B --&gt; C[最大重数]\n    C --&gt; D[组合方法 Sperner]\n    C --&gt; E[傅立叶方法]\n    C --&gt; F[Esséen 不等式]\n    C --&gt; G[逆问题]\n    G --&gt; H[步长落在低秩GAP]\n    H --&gt; I[随机矩阵奇异概率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把 2^d 个符号向量想成 2^d 个人，每人的&quot;存款&quot;是 Σ ε_i v_i。问最多有多少人存款相同。步长像面额：如果面额都是 1 元，存款值只有 d+1 种，人挤得很厉害；如果面额是 1,2,4,8,...，每人存款都不同。<\/p>\n<p><strong>失效边界<\/strong>：现实货币是离散且有限的，数学里的群可以是任意交换群。<\/p>\n<p><strong>实例<\/strong>：d = 3，步长 1,1,1。可能的和是 −3,−1,1,3，各出现 1,3,3,1 次，最大重数 3 = C(3,1)。d = 3，步长 1,2,4，八个和是 ±1±2±4，全部不同，最大重数 1。<\/p>\n<p>这个对比说明&quot;步长的整数关系&quot;直接决定集中度。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Esséen 不等式对所有步长都紧。步长全相同时它给出的界可能偏松，但量级正确。\n<\/li><li>\n别以为逆 Littlewood–Offord 能刻画全部步长。它只能保证&quot;绝大多数&quot;落在 GAP 里，少数例外可以很乱。\n<\/li><li>\n别以为随机矩阵奇异只由&quot;列相同&quot;造成。列之间的整数线性组合才是主因，这正是需要用逆定理的地方。\n<\/li><li>\n别以为这个问题只和概率有关。它的证明大量使用加性组合的结构定理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n步长全为 1 时，最大重数是多少量级？（答案：约 2^d/√d；解析：二项式系数 C(d,k) 的最大值在中间，约 2^d/√d。）\n<\/li><li>\nEsséen 不等式依赖步长的什么量？（答案：平方和 Σ|v_i|²；解析：它本质上是方差控制的集中不等式。）\n<\/li><li>\n随机 Bernoulli 矩阵奇异的概率为什么是指数小？（答案：奇异意味着列之间存在非平凡整数关系，这是集中事件，概率指数小；解析：用逆 Littlewood–Offord 把&quot;奇异&quot;转化为&quot;步长集中在低秩结构&quot;，再估概率。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n集中度大 ⟺ 步长有整数关系 ⟺ 落在低秩 GAP。\n<\/li><li>\n组合方法给组合数界，傅立叶方法给依赖分布的界，Esséen 给方差界。\n<\/li><li>\n正问题是&quot;最多多集中&quot;，逆问题是&quot;集中则步长如何&quot;。\n<\/ul>", "kind": "chapter", "title": "第 7 章：Littlewood–Offord 问题"}, "ch08": {"html": "<h1>第 8 章：关联几何<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2 章；一点平面几何与图论\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用&quot;画图时的交叉数&quot;解释 Szemerédi–Trotter 定理的来源\n<\/li><li>\n写出点线关联上界，并用它推出一个和积估计\n<\/li><li>\n说清&quot;网格分解&quot;为什么能把几何问题降成组合计数\n<\/li><li>\n知道这套方法在实数域、有限域里的差别\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>点上、线上、圆上的关联数量受几何约束；把关联数用两种方式各数一遍（双重计数），就能得到和积问题所需的下界。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：关联<\/h3>\n<p>一个点落在一条线上，叫一次关联。给定点集 P 和线集 L，记 I(P,L) 为关联的总次数。<\/p>\n<p>最平凡的上界是 |P||L|，但那太松。真正的问题是：点和线的数量固定时，关联最多能有多少？<\/p>\n<h3>概念 2：交叉数与欧拉公式<\/h3>\n<p>把图画在平面上，边与边之间的交叉次数有下界：若图有 n 个顶点、m 条边、n≥3，则交叉数至少是 m − 3n + 6。<\/p>\n<p>来源是欧拉公式：平面图的边数不超过 3n−6，超过的部分必须靠交叉&quot;塞&quot;进去。<\/p>\n<p>这条不等式看起来只是拓扑事实，但它是 Szemerédi–Trotter 证明的起点：把&quot;点—线&quot;关联画成图，关联多就意味着边多，边多就意味着交叉多；而交叉本身又可以用&quot;两条线最多交一次&quot;来数，于是得到矛盾或上界。<\/p>\n<h3>概念 3：Szemerédi–Trotter 定理<\/h3>\n<p>对平面上的点集 P 和线集 L，<\/p>\n<p>I(P,L) ≲ |P|^{2/3}|L|^{2/3} + |P| + |L|。<\/p>\n<p>这个界在量级上是最优的：构造取&quot;n×n 网格点 + 所有水平、垂直、斜率有理的线&quot;，可以得到接近这个上界的关联数。<\/p>\n<p><strong>为什么是 2/3 次方？<\/strong> 因为交叉数下界是线性的，而&quot;每条线穿过多少点&quot;与&quot;每两条线的交叉&quot;之间存在二次关系，优化后指数落在 2/3。<\/p>\n<h3>概念 4：用关联推和积<\/h3>\n<p>Erdős–Szemerédi 的和积猜想是：对实数集 A，<\/p>\n<p>max(|A+A|, |A·A|) ≳ |A|^{1+δ}，<\/p>\n<p>δ 是一个正常数。直观上，加法结构和乘法结构不能同时很强。<\/p>\n<p>用关联几何证明的思路：把 A 的元素画在坐标轴上，考虑&quot;斜率为 1 的线&quot;与&quot;乘积相同的双曲线&quot;。若 |A+A| 很小，说明很多点对的和相同，也就是很多点落在同一条斜线 y = c − x 上；若 |A·A| 也很小，说明很多点对落在同一条双曲线 xy = c 上。线与线的交点数受 Szemerédi–Trotter 控制，两者冲突。<\/p>\n<p>这条路线给出的是 δ 很小的定量版本，但已经是&quot;初等&quot;证明里最强的之一。<\/p>\n<h3>概念 5：网格分解与不同距离问题<\/h3>\n<p>网格分解（cell decomposition）是把平面切成若干格子，每个格子里&quot;点—线&quot;关系近似规整。切分的粗细由关联数决定：关联少就切得粗，关联多就切得细。<\/p>\n<p>用它处理不同距离问题：n 个点的不同距离个数至少是多少？平面上的经典结果是 n/√(log n) 量级，网格分解给出的是这个问题的组合版本。<\/p>\n<h3>概念 6：其他域上的和积<\/h3>\n<p>实数域靠&quot;序&quot;和&quot;凸性&quot;，有限域没有序，只能靠多项式方法（第 9 章）和傅立叶。有限域上的和积估计通常形如 |A+A|·|A·A| ≳ |A|^{2+c}，证明用组合零点定理或者 Stepanov 方法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[点线关联] --&gt; B[画成图]\n    B --&gt; C[交叉数下界]\n    C --&gt; D[Szemeredi-Trotter]\n    D --&gt; E[和积估计]\n    D --&gt; F[不同距离]\n    D --&gt; G[网格分解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把点想成钉子，线想成橡皮筋。钉子多、橡皮筋少时，每根皮筋要串很多钉子，但皮筋之间必然频繁交叉。交叉的次数是&quot;几何账单&quot;，关联数不能超过账单允许的量。<\/p>\n<p><strong>失效边界<\/strong>：三维空间里两条直线可以不相交也可以异面，交叉数的下界不再成立，需要换成别的几何工具。<\/p>\n<p><strong>实例<\/strong>：取 3×3 的网格点，P 有 9 个点。取所有水平线和垂直线，L 有 6 条，每条穿 3 个点，I = 18。代入公式：9^{2/3}·6^{2/3} ≈ 4.33·3.30 ≈ 14.3，加上 9+6 后界更松，18 在界内。<\/p>\n<p>这个例子说明公式里的 |P|+|L| 项在小规模时占主导。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Szemerédi–Trotter 只对平面成立。它有高维推广，但形式会变。\n<\/li><li>\n别以为关联上界能直接给出强和积结论。它给的是 δ 很小的版本，强版本需要更精细的工具。\n<\/li><li>\n别以为交叉数下界对所有图都成立。n≥3 且是简单图才成立，重边、自环要单独处理。\n<\/li><li>\n别以为有限域情形可以照搬实数域证明。&quot;序&quot;在有限域里不存在，必须换成代数方法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n平面图 n 个顶点最多有多少条边？（答案：3n−6，n≥3；解析：欧拉公式给出面数上界，再由每个面至少三条边推出。）\n<\/li><li>\nSzemerédi–Trotter 的 2/3 指数从哪里来？（答案：交叉数下界与关联上界的优化；解析：把每条线的关联数记为 d，交叉数约 Σd²，与 m−3n 比较后优化。）\n<\/li><li>\n为什么和积问题需要几何工具？（答案：加法结构对应斜线，乘法结构对应双曲线，冲突体现在交点数；解析：两种结构不能同时让关联数很小。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n关联 = 点落在线上；双重计数是核心手法。\n<\/li><li>\n交叉数下界 m−3n+6 来自欧拉公式。\n<\/li><li>\nS-T 界：|P|^{2/3}|L|^{2/3}+|P|+|L|。\n<\/li><li>\n实数域靠几何，有限域靠代数。\n<\/ul>", "kind": "chapter", "title": "第 8 章：关联几何"}, "ch09": {"html": "<h1>第 9 章：代数方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 2、4 章；多项式与有限域基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n叙述组合零点定理，并说明&quot;系数非零&quot;这个条件为什么关键\n<\/li><li>\n用零点定理证明一个受限和集的大小下界\n<\/li><li>\n区分 Davenport 常数与 Kemnitz 猜想在问什么\n<\/li><li>\n解释 Stepanov 方法怎么把&quot;存在性&quot;变成&quot;多项式次数估计&quot;\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>在域上，加性集合可以看成多项式的零点集；用&quot;多项式的零点数受次数控制&quot;这一条，就能把组合问题变成次数比较。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：组合零点定理<\/h3>\n<p>设 F 是域，P 是 n 元多项式，次数不超过 Σ t_i，且 P 中 x₁^{t₁}...x_n^{t_n} 这一项的系数不为零。若 S₁,...,S_n 是 F 的子集且 |S_i| &gt; t_i，则存在 x_i ∈ S_i 使 P(x₁,...,x_n) ≠ 0。<\/p>\n<p><strong>直觉<\/strong>：如果 P 在所有格点 S₁×...×S_n 上都取零，那么它的&quot;最高次项&quot;必须被压掉，而系数非零恰好禁止这件事。<\/p>\n<p><strong>为什么条件这么严？<\/strong> 因为这是&quot;插值&quot;的精确版：在 |S_i| 个点上取零，相当于要求 P 被这些点定义的理想整除，次数不够就做不到。<\/p>\n<h3>概念 2：受限和集<\/h3>\n<p>受限和集是指形如 A ⊕ B = {a+b : a∈A, b∈B, a≠b} 的集合（禁止同元素相加）。<\/p>\n<p>Erdős–Heilbronn 猜想断言：在 ℤ/pℤ 里，|A ⊕ A| 至少是 min(p, 2|A|−3)。用组合零点定理可以给出 p 较大时的证明：构造一个多项式，它在所有&quot;和&quot;上取零，再用&quot;最高次项系数非零&quot;导出矛盾。<\/p>\n<p><strong>思路细节<\/strong>：把&quot;和不在某个集合里&quot;翻译成多项式在格点上非零，再数格点数量，与次数比较。<\/p>\n<h3>概念 3：Snevily 猜想<\/h3>\n<p>Snevily 猜想说：在奇特征的循环群里，给定两个大小相同的集合 A、B，存在一个置换 π 使所有 a+π(a) 互不相同。<\/p>\n<p>它等价于&quot;存在一个无重复的匹配&quot;。组合零点定理可以处理其中一部分情形（A、B 是区间或者有特殊结构时）。<\/p>\n<h3>概念 4：有限域与 Davenport 常数<\/h3>\n<p>Davenport 常数 D(G) 是最小的 k，使得 G 里任意 k 个元素（允许重复）都有一个非空子集和为 0。<\/p>\n<p>对 ℤ/nℤ，D = n。对 (ℤ/nℤ)^d，D 约为 n(1+log n)。这个常数在零和问题、代数数论里都出现。<\/p>\n<p>Kemnitz 猜想是它的二维版本：在 ℤ/nℤ 的平面格点里，最小的 k 使任意 k 个点都有子集和为零（模 n），猜想值是 4n−3。<\/p>\n<h3>概念 5：Stepanov 方法<\/h3>\n<p>要证&quot;某个集合很大&quot;，直接数很难。Stepanov 的办法是：构造一个次数不太高的多项式，它在集合的每个点上取零，然后用&quot;零点数 ≤ 次数&quot;反推集合大小上界（或下界）。<\/p>\n<p>它和零点定理是&quot;一枚硬币的两面&quot;：零点定理从&quot;非零&quot;推&quot;存在格点&quot;，Stepanov 从&quot;处处为零&quot;推&quot;次数必须大&quot;。<\/p>\n<h3>概念 6：分圆域与不确定性原理<\/h3>\n<p>分圆域是有理数域添加单位根得到的扩域，它的代数结构对应循环群的傅立叶分析。书里用它处理&quot;有限域上的加法结构&quot;。<\/p>\n<p>不确定性原理在这里的形式是：一个函数和它的傅立叶变换不能同时&quot;集中&quot;。离散版本就是&quot;集合小 ⟹ 谱大&quot;，与第 4 章的偏差分析同源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[多项式零点] --&gt; B[组合零点定理]\n    B --&gt; C[受限和集]\n    B --&gt; D[Snevily猜想]\n    E[零点数不超过次数] --&gt; F[Stepanov方法]\n    F --&gt; G[有限域和积]\n    H[分圆域] --&gt; I[不确定性原理]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多项式像一张&quot;有限次起伏的布&quot;，零点就是布贴到地面的位置。次数低，布起伏的次数少，贴地点就少。组合零点定理说：如果布在格点上全部贴地，而它本可以起伏到更高，说明它是&quot;假贴地&quot;，必有某个格点没贴。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只在一维直觉上成立，多维时&quot;次数&quot;要把每个变量的次数加起来。<\/p>\n<p><strong>实例<\/strong>：p = 7，A = {0,1,3} ⊂ ℤ/7ℤ。受限和 A ⊕ A = {1,3,4,0+?}：允许的组合是 0+1=1, 0+3=3, 1+3=4, 3+1=4, 1+0=1, 3+0=3，实际集合 {1,3,4}，大小 3。而 2|A|−3 = 3，正好达到下界。<\/p>\n<p>这个例子说明 Erdős–Heilbronn 的界在小集合时可以很紧。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为组合零点定理对任意环成立。它需要域，整环上&quot;零点数 ≤ 次数&quot;不总成立。\n<\/li><li>\n别以为系数非零是技术细节。去掉它，定理立刻变假，因为可以构造出在所有格点上为零但次数很低的例子。\n<\/li><li>\n别以为 Davenport 常数就是&quot;元素个数&quot;。它问的是&quot;任意 k 个元素&quot;，包括重复，和集合大小无关。\n<\/li><li>\n别以为 Stepanov 方法只能给上界。它常常被用来证明&quot;集合不能太小&quot;，方向取决于你把零点放在哪一侧。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n组合零点定理中，为什么要 |S_i| &gt; t_i？（答案：格点数量要超过次数上界，才能保证存在非零点；解析：若 |S_i| ≤ t_i，多项式可以在整个格点上取零而不违反次数限制。）\n<\/li><li>\nErdős–Heilbronn 猜想的值是多少？（答案：min(p, 2|A|−3)；解析：这是受限和集在 ℤ/pℤ 中的经典猜想下界。）\n<\/li><li>\nStepanov 方法的核心不等式是什么？（答案：零点数不超过多项式的次数；解析：这是域上多项式最基本的性质，方法就是把它反过来用。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n零点定理：次数 + 系数非零 ⟹ 格点上存在非零点。\n<\/li><li>\n受限和集与零和问题都靠多项式构造。\n<\/li><li>\nStepanov 用&quot;零点 ≤ 次数&quot;反推集合大小。\n<\/li><li>\n有限域没有序，只能靠代数。\n<\/ul>", "kind": "chapter", "title": "第 9 章：代数方法"}, "ch10": {"html": "<h1>第 10 章：k=3 的 Szemerédi 定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>预估学时<\/strong>：14 小时 | <strong>前置<\/strong>：第 4 章；第 2 章；一点测论\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n复述 Szemerédi 定理：正上密度的整数集包含任意长的等差数列\n<\/li><li>\n说清&quot;密度增量&quot;策略：假设没有 3 项等差数列，推出密度在某个子结构上变大\n<\/li><li>\n解释小挠情形与整数情形的分工\n<\/li><li>\n知道傅立叶方法在这里的角色，以及它为什么只能处理 k=3\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若 A 没有 3 项等差数列，则 A 在某个 Bohr 集上的密度必然比原来高；不断把密度往上推，最后超过 1，矛盾。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定理与历史<\/h3>\n<p>Szemerédi 定理：正整数集的子集 A 若有正上密度，则 A 包含任意长的等差数列。<\/p>\n<p>k=3 的情形最早由 Roth 在 1953 年用傅立叶方法证明。k=4 要等到 1969 年，Szemerédi 用了复杂的组合论证；一般 k 在 1975 年完成。<\/p>\n<p><strong>为什么 k=3 特别？<\/strong> 因为 3 项等差数列的结构可以用&quot;一个频率的偏差&quot;完全捕捉：a, a+d, a+2d 三项，中间项是两端的中点。傅立叶系数能直接检测这种&quot;中点关系&quot;。<\/p>\n<h3>概念 2：密度增量策略<\/h3>\n<p>假设 A ⊂ [1,N] 没有 3 项等差数列，密度为 δ。<\/p>\n<p>第一步：用傅立叶分析证明，若 A 没有 3 项等差数列，则存在一个频率 ξ 使 |Â(ξ)| 明显大（否则 A 太&quot;随机&quot;，必然出现等差数列）。<\/p>\n<p>第二步：把&quot;偏差大&quot;翻译成&quot;存在一个 Bohr 集 B，A 在 B 上的密度至少是 δ + c(δ)&quot;。<\/p>\n<p>第三步：把 B 当成新的环境（它是一个低维 GAP），在里面重新开始。<\/p>\n<p>第四步：每次密度至少增加 c(δ)，而密度不超过 1，所以迭代次数有界。迭代到尺度小于常数时，直接检查有限情形，矛盾。<\/p>\n<p><strong>关键点<\/strong>：每一步密度增量只依赖当前密度，不依赖 N。这是&quot;定量证明&quot;能给出显式界的原因。<\/p>\n<h3>概念 3：小挠情形<\/h3>\n<p>先在有限群 ℤ/Nℤ 里做，N 不大或者挠很小。这时 Bohr 集就是低维子群，密度增量可以直接算。<\/p>\n<p>&quot;小挠&quot;指群里没有太小的子群，避免 A 整个落在小子群里导致密度虚高。处理后可以假设群&quot;足够分散&quot;。<\/p>\n<h3>概念 4：整数情形<\/h3>\n<p>把 [1,N] 里的 A 通过&quot;提升&quot;（lifting）搬到 ℤ/Nℤ 或者一个大的循环群里。提升的技巧是把区间分成若干段，每段对应一个同余类。<\/p>\n<p>提升的好处是把&quot;区间&quot;变成&quot;群&quot;，坏处是密度会被稀释，需要在参数上补偿。<\/p>\n<h3>概念 5：定量界<\/h3>\n<p>Roth 的原始证明给出的是 log log N 量级的界；后来的改进把它推进到 (log N)^c 量级。Gowers 对 k≥4 给出了更差的界，但仍是显式的。<\/p>\n<p><strong>这些界意味着什么？<\/strong> 它们说明&quot;只要 N 足够大，任何密度为正的集合都必然含 3 项等差数列&quot;，但&quot;足够大&quot;可能大到无法实际检验。<\/p>\n<h3>概念 6：遍历论证<\/h3>\n<p>Furstenberg 用遍历理论重证了 Szemerédi 定理：把集合的平移看成动力系统，等差数列对应&quot;回归&quot;（recurrence）。这条路线不给出定量界，但结构清晰，后来发展出&quot;遍历方法&quot;这一整套工具。<\/p>\n<p>书里给出的是&quot;有限版本&quot;的遍历论证，用测论语言重述密度增量。<\/p>\n<h3>概念 7：正则引理与 Szemerédi 的组合证明<\/h3>\n<p>Szemerédi 正则引理：任意大的图都可以分成常数多块，块内边密度近似一致，块间近似随机。它是&quot;把图变得像随机图&quot;的工具。<\/p>\n<p>Szemerédi 的原始证明用它把集合分解成&quot;结构化部分 + 随机部分&quot;，结构化部分含等差数列，随机部分用计数处理。这条路线后来被推广成&quot;超图移除引理&quot;，是第 11 章的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[假设无三项AP] --&gt; B[傅立叶偏差]\n    B --&gt; C[Bohr集上密度增加]\n    C --&gt; D[迭代]\n    D --&gt; E[密度超过1 矛盾]\n    F[整数提升] --&gt; C\n    G[正则引理] --&gt; H[组合证明]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：想象你在一个池塘里捞鱼，假设&quot;没有三条鱼排成等距&quot;。每捞一次，你发现某个小区域里鱼的比例更高，于是把注意力集中到那个小区域再捞。区域越来越小，鱼的比例越来越高，最后超过 100%，说明假设不成立。<\/p>\n<p><strong>失效边界<\/strong>：池塘是有限的，而定理里的 N 可以任意大；类比里&quot;区域&quot;是空间，定理里是 Bohr 集（频率空间）。<\/p>\n<p><strong>实例<\/strong>：取 A 为 [1,10] 里的 {1,2,4,5,7,8,10}，密度 0.7。它含 3 项等差数列吗？1,4,7 是；2,5,8 是。取一个刻意避开等差数列的集合，比如 {1,2,4,8}（密度 0.4），没有 3 项等差数列。但 N 再大一些，这种&quot;稀疏构造&quot;就维持不住了。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为密度增量每步增加一个固定常数。增量依赖当前密度 δ，δ 越大概率增量越小。\n<\/li><li>\n别以为傅立叶方法能直接推到 k≥4。三项等差数列是&quot;中点关系&quot;，可以用一个频率检测；四项及以上需要高阶结构。\n<\/li><li>\n别以为遍历论证给出了可用界。它只证存在，不给定量估计。\n<\/li><li>\n别以为正则引理只用于图论。它是&quot;分解结构&quot;的通用工具，在加性组合里也有对应版本。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSzemerédi 定理的结论是什么？（答案：正上密度的整数集包含任意长的等差数列；解析：注意是&quot;任意长&quot;，不是某个固定长度。）\n<\/li><li>\n密度增量策略为什么能终止？（答案：密度每次至少增加 c(δ)，且有上界 1；解析：迭代次数由 δ 决定，与 N 无关。）\n<\/li><li>\n为什么 k=3 可以用傅立叶，k=4 不行？（答案：3 项 AP 是两点中点关系，线性相位可检测；4 项需要二阶结构；解析：Gowers 范数 U^3 才能捕捉 4 项 AP。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n定理：正密度 ⟹ 任意长 AP。\n<\/li><li>\n策略：无 AP ⟹ 有偏差 ⟹ Bohr 集上密度增加 ⟹ 迭代矛盾。\n<\/li><li>\n界是显式的但很弱。\n<\/li><li>\nk=3 用线性傅立叶，k≥4 要换工具。\n<\/ul>", "kind": "chapter", "title": "第 10 章：k=3 的 Szemerédi 定理"}, "ch11": {"html": "<h1>第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★★ | <strong>预估学时<\/strong>：16 小时 | <strong>前置<\/strong>：第 4、10 章；一点高阶傅立叶\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 Gowers 范数 U^k 的定义，说明它为什么是&quot;高阶傅立叶&quot;\n<\/li><li>\n区分&quot;硬障碍&quot;和&quot;软障碍&quot;，知道它们分别对应什么结构\n<\/li><li>\n说清超图移除引理在证明中的位置\n<\/li><li>\n解释 Green–Tao 定理与本章的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性傅立叶只能看见&quot;一个方向上的偏差&quot;，k≥4 的等差数列需要 k−1 阶的均匀性；Gowers 范数就是衡量&quot;高阶均匀性&quot;的尺子。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么线性傅立叶不够<\/h3>\n<p>3 项等差数列 a, a+d, a+2d 的核心是&quot;a 和 a+2d 的中点是 a+d&quot;，这是一条线性关系，一个频率就能检测。<\/p>\n<p>4 项等差数列 a, a+d, a+2d, a+3d 涉及&quot;二阶差分&quot;：相邻差相同。要检测这种&quot;差分的差分&quot;，需要二阶的相位，也就是 Gowers 范数 U^3。<\/p>\n<p>更一般地，k 项等差数列需要 U^{k−1}。<\/p>\n<h3>概念 2：Gowers 范数<\/h3>\n<p>对函数 f: Z → ℂ，U^k 范数定义为<\/p>\n<p>‖f‖_{U^k}^{2^k} = 对 x, h₁,...,h_k 求平均，f(x) 与 f(x+h₁)...f(x+h₁+...+h_k) 的乘积的复共轭组合。<\/p>\n<p>这个定义看起来吓人，但结构很清楚：k=1 时它就是普通的 L² 范数；k=2 时它等价于傅立叶系数的四阶矩；k 越大，检测的是&quot;越高阶的差分&quot;。<\/p>\n<p><strong>直觉<\/strong>：U^k 小 ⟹ 函数在所有 k 阶结构上都&quot;均匀&quot; ⟹ 不含 k+1 项等差数列。<\/p>\n<h3>概念 3：硬障碍与软障碍<\/h3>\n<p>&quot;障碍&quot;指让函数在 U^k 范数下不小的结构。<\/p>\n<ul><li>\n<strong>硬障碍<\/strong>：真正的高阶结构，比如函数落在一个低维 GAP 上，或者是一个多项式相位 e(P(x))。这类障碍必须被&quot;识别&quot;出来，才能继续做密度增量。\n<\/li><li>\n<strong>软障碍<\/strong>：不是真正的结构，只是傅立叶系数在少数频率上偏大，比如函数带了一个线性相位。这类障碍可以通过&quot;除掉相位&quot;消除。\n<\/ul>\n<p>Gowers 逆定理说：U^k 范数大 ⟹ 函数可以被一个&quot;低复杂度的多项式相位&quot;解释。这是本章最深的定理，证明用了超图移除和复杂的组合论证。<\/p>\n<h3>概念 4：Gowers 逆定理<\/h3>\n<p>粗略表述：若 ‖f‖_{U^k} 明显大于随机水平，则存在一个次数不超过 k−1 的多项式相位 φ，使得 f 与 e(φ) 的相关性很大。<\/p>\n<p>也就是说，<strong>高阶均匀性失败，必然有一个低次多项式在&quot;作怪&quot;<\/strong>。这解释了为什么 k 项等差数列的结构总是&quot;多项式型&quot;的。<\/p>\n<h3>概念 5：超图移除引理<\/h3>\n<p>超图是&quot;边可以是任意大小子集&quot;的图。超图移除引理说：若一个超图包含很多&quot;完全子超图&quot;（比如所有 k+1 元组），则可以删掉少量边把所有完全子超图都破坏掉。<\/p>\n<p>它在证明里的作用：把&quot;函数在某个结构上不平&quot;转化为&quot;存在一个超图，其完全子图数量异常&quot;，再用移除引理得到矛盾。<\/p>\n<h3>概念 6：遍历方法与无限版本<\/h3>\n<p>和 k=3 一样，k&gt;3 也有遍历版本。Furstenberg–Katznelson 用遍历理论证明了高维版本的 Szemerédi 定理。这条路线不给出定量界，但把&quot;等差数列&quot;与&quot;动力系统的回归&quot;对应起来，启发了后来的很多工作。<\/p>\n<h3>概念 7：素数中的等差数列<\/h3>\n<p>Green–Tao 定理（2004）：素数集包含任意长的等差数列。<\/p>\n<p>素数集的密度是 0，Szemerédi 定理不能直接用。证明的思路是：<\/p>\n<ol><li>\n用一个&quot;伪随机&quot;的权重函数模拟素数（筛法）。\n<\/li><li>\n证明这个权重函数在 Gowers 范数下是均匀的（相对某个稠密模型）。\n<\/li><li>\n对稠密模型用 Szemerédi 定理，再把结论搬回素数。\n<\/ol>\n<p>这就是&quot;转移原理&quot;（transference principle）：先在一个稠密、均匀的模型里证，再转移到稀疏集合。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[线性傅立叶] --&gt; B[只能看 k=3]\n    B --&gt; C[Gowers范数 U^k]\n    C --&gt; D[硬障碍]\n    C --&gt; E[软障碍]\n    D --&gt; F[Gowers逆定理]\n    F --&gt; G[多项式相位]\n    G --&gt; H[超图移除]\n    H --&gt; I[Szemeredi k&gt;3]\n    I --&gt; J[Green-Tao 素数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：U^1 像用放大镜看一条线的&quot;整体斜率&quot;，U^2 像看&quot;斜率的变化率&quot;，U^3 像看&quot;变化率的变化率&quot;。k 越大，看的层次越深，越能发现&quot;看起来随机、其实有高阶规律&quot;的结构。<\/p>\n<p><strong>失效边界<\/strong>：放大镜类比只给一维直觉，实际 U^k 是 2^k 个变量的平均，维度随 k 指数增长。<\/p>\n<p><strong>实例<\/strong>：取 f 是区间上的指示函数。它的 U^2 范数反映傅立叶系数的四阶矩，也就是 A+A 的表示次数；U^3 范数反映 4 项等差数列的密度。一个集合可以在 U^2 下均匀（没有线性偏差），但在 U^3 下不均匀（含很多 4 项等差数列），这正是 k=4 需要新工具的原因。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Gowers 范数是&quot;傅立叶系数的简单推广&quot;。它是高阶的平均，计算复杂度随 k 指数增长。\n<\/li><li>\n别以为逆定理给出了完整刻画。它只说&quot;存在一个多项式相位&quot;，不保证唯一，也不保证次数最优。\n<\/li><li>\n别以为 Green–Tao 直接用了 Szemerédi 定理。素数密度为零，必须先做转移。\n<\/li><li>\n别以为 k 越大证明只是&quot;更难一点&quot;。难度是指数级增长的，定量界也急剧变差。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nk 项等差数列需要哪个阶的 Gowers 范数？（答案：U^{k−1}；解析：k 项 AP 对应 k−1 阶差分结构。）\n<\/li><li>\n硬障碍和软障碍的区别是什么？（答案：硬障碍是真正的高阶结构，软障碍只是线性相位造成的形式偏差；解析：软障碍可以除掉相位消除，硬障碍必须识别。）\n<\/li><li>\nGreen–Tao 定理的核心技术是什么？（答案：转移原理，用稠密均匀模型模拟素数；解析：素数密度为零，不能直接套 Szemerédi。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性傅立叶管 k=3，k≥4 要 U^{k−1}。\n<\/li><li>\nU^k 小 ⟹ 高阶均匀 ⟹ 含长 AP。\n<\/li><li>\n逆定理：不均匀 ⟹ 有低次多项式相位。\n<\/li><li>\n素数靠转移原理。\n<\/ul>", "kind": "chapter", "title": "第 11 章：k>3 的 Szemerédi 定理与 Gowers 范数"}, "ch12": {"html": "<h1>第 12 章：和集中的长等差数列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2、4、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清&quot;和集比原集合更有结构&quot;这句话的定量含义\n<\/li><li>\n解释为什么 lA 随 l 增大，越来越像等差数列\n<\/li><li>\n区分完全序列与次完全序列\n<\/li><li>\n知道这些结果在 Waring 问题里的用法\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>A+A 一定比 A 更&quot;规整&quot;；重复相加的次数越多，得到的
