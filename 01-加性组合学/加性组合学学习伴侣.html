lA 里包含的等差数列越长，长到只依赖 A 的密度和 l，而不依赖 A 的具体形状。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：和集的&quot;结构增益&quot;<\/h3>\n<p>第 4 章已经给出一个结论：若 A 没有明显的傅立叶偏差，则 lA 很快填满整个群。<\/p>\n<p>本章把这个现象量化：即使 A 有偏差，只要 |A| 相对群足够大，lA 里也一定含长等差数列。<\/p>\n<p><strong>为什么？<\/strong> 因为加法是&quot;平滑&quot;运算：两个集合相加，重复的表示会被合并，结果是&quot;值域变宽但结构更密&quot;。重复多次，A 的局部不规则性被平均掉，剩下的只有全局的等差结构。<\/p>\n<h3>概念 2：主要结论的形状<\/h3>\n<p>定理大意：若 A ⊂ [1,N] 且 |A| ≥ αN，则对适当的 l，lA 包含长度至少 N^{c(α, l)} 的等差数列。<\/p>\n<p>长度是幂次的，不是对数的。这和 Szemerédi 定理形成对比：Szemerédi 处理的是 A 本身，只能保证长度极短（log 级别）；和集把长度提升到幂次级别。<\/p>\n<p><strong>代价<\/strong>：结论说的是 lA，不是 A。lA 比 A 大得多，里面的大部分元素不是 A 的元素。<\/p>\n<h3>概念 3：完全序列与次完全序列<\/h3>\n<p>一个序列 a₁ &lt; a₂ &lt; ... 是完全的，指每个足够大的整数都能表示成若干项之和（每项最多用一次）。次完全序列允许&quot;每个整数都能表示，但项数有界&quot;。<\/p>\n<p>完全性的判定和&quot;部分和序列的密度&quot;有关：如果部分和集合在区间里足够密，就能覆盖所有整数。<\/p>\n<p><strong>例子<\/strong>：2 的幂序列是次完全的（二进制表示），但不是完全的（只能表示到某个范围，因为每项最多一次，和有限）。<\/p>\n<h3>概念 4：证明的骨架<\/h3>\n<p>证明分三步：<\/p>\n<ol><li>\n把 A 的加法结构&quot;摊平&quot;：用傅立叶或者组合方法找一个大的子集 A&#x27;，它在某个 GAP 里分布均匀。\n<\/li><li>\n在 A&#x27; 上构造长等差数列：用 GAP 的坐标把等差数列变成&quot;每个坐标上的等差数列&quot;，再用多维的 Szemerédi 或者直接构造。\n<\/li><li>\n把 A&#x27; 里的等差数列&quot;提升&quot;回 lA：用多次相加把坐标差补齐。\n<\/ol>\n<p>第三步是技术核心：需要保证补差用的元素仍在 A 里，且用的次数受 l 控制。<\/p>\n<h3>概念 5：与 Waring 问题的联系<\/h3>\n<p>Waring 问题问：每个正整数能否表示成至多 s 个 k 次幂之和。<\/p>\n<p>用和集的语言：令 A 是 k 次幂的集合，问 sA 是否覆盖所有整数。本章的长等差数列结果给出&quot;lA 含长等差数列&quot;，再配合&quot;局部覆盖&quot;和&quot;周期性&quot;论证，可以推出 Waring 型结论。<\/p>\n<p>书里用这套工具重新证明了&quot;薄基&quot;的存在性（第 1 章已经用概率方法给过一次）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; B[A+A]\n    B --&gt; C[lA]\n    C --&gt; D[长等差数列]\n    D --&gt; E[Waring型结论]\n    F[完全序列] --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把 A 想成一把沙子，A+A 是把沙子筛一遍，lA 是反复筛。每筛一次，粗细颗粒被分开，剩下的越来越均匀。最后得到的不是原来的沙子，而是一堆&quot;按粒径排好&quot;的沙堆。<\/p>\n<p><strong>失效边界<\/strong>：筛沙子会丢失物质，和集不会；类比只能说明&quot;越来越规整&quot;，不能说明&quot;元素变多&quot;。<\/p>\n<p><strong>实例<\/strong>：A = {0,1,...,n−1}。A+A = [0,2n−2]，2A+A = [0,3n−3]，kA = [0,kn−k]，本身就是等差数列，长度随 k 线性增长。<\/p>\n<p>再取 A = {0,1,2,4,5,6,...}（去掉 3 的倍数），A+A 里会出现更长的连续段，因为不同的表示把缺口填上了。这就是&quot;结构增益&quot;的最直观例子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 lA 含长等差数列就意味着 A 也有。lA 大得多，结论不能反推回 A。\n<\/li><li>\n别以为完全序列等价于&quot;密度大&quot;。完全性是关于&quot;能否表示每个整数&quot;，和密度不是一回事。\n<\/li><li>\n别以为这套结果只是 Waring 问题的工具。它也是&quot;和集结构&quot;的一般理论，对很多加性问题有用。\n<\/li><li>\n别以为长度界可以做到线性。幂次界的指数依赖密度和 l，通常很小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n为什么 lA 比 A 更容易含长等差数列？（答案：多次相加把局部不规则性平均掉，值域变宽且结构更密；解析：重复表示的合并使结果更规整。）\n<\/li><li>\n完全序列和次完全序列的区别是什么？（答案：完全序列每项最多用一次就能表示所有足够大的整数，次完全允许有限项数；解析：二进制表示是次完全但不是完全。）\n<\/li><li>\n本章结论与 Szemerédi 定理的主要差别是什么？（答案：本章说的是 lA，长度是幂次级；Szemerédi 说的是 A 本身，长度是 log 级；解析：和集提升了结构强度。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加法是平滑运算，lA 越大越规整。\n<\/li><li>\n结论：lA 含幂次长度的等差数列。\n<\/li><li>\n完全性看&quot;能否表示所有整数&quot;，不看密度。\n<\/li><li>\nWaring 问题是这套工具的直接应用。\n<\/ul>", "kind": "chapter", "title": "第 12 章：和集中的长等差数列"}, "c01": {"html": "<h1>加性集与和集<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 0、2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>加性集是一对 (A, Z)：Z 是交换群，A 是 Z 的有限非空子集；和集 A+B 是所有 a+b 的集合。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是全书的原子概念。所有&quot;结构强弱&quot;的判断，最终都落在 |A+B| 与 |A|、|B| 的比较上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; C[A+B]\n    B[集合B] --&gt; C\n    C --&gt; D[大小比较]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>同一个集合放在不同的环境群里，和集可以完全不同。{1,2,3} 在整数里 A+A 有 5 个元素，在模 3 群里只有 3 个。所以讨论和集必须先说清群。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 A+B 的大小只由 |A|、|B| 决定。它主要由两者的加法关系决定。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 0 章<\/td><td>定义<\/td><td>加性集必须带环境群<\/td><\/tr><tr><td>第 2 章<\/td><td>估计<\/td><td><\/td><td>A+B<\/td><td>小会牵动<\/td><td>A−B<\/td><td><\/td><\/tr><tr><td>第 12 章<\/td><td>迭代<\/td><td>lA 越大越规整<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">倍增常数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>\n<\/ul>", "kind": "concept", "title": "加性集与和集"}, "c02": {"html": "<h1>倍增常数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>σ[A] = |A+A| / |A|，衡量 A 在加法下膨胀了多少倍。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书的结构温度计。σ 接近 1 说明 A 几乎对加法封闭；σ 接近 |A| 说明 A 在加法上接近随机。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[sigma 接近1] --&gt; B[子群或陪集]\n    A --&gt; C[sigma 小于3]\n    C --&gt; D[子群加小扰动]\n    C --&gt; E[低秩GAP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>σ 小到什么程度决定能推出什么结构：σ&lt;2 或 &lt;3 时可以完全刻画；σ=O(log|A|) 时靠 Freiman 定理给出 GAP；σ=|A|^ε 时只能给近似子群。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 σ 小就是等差数列。低秩 GAP、子群加扰动都满足小 σ，形状比等差数列宽。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>定义与估计<\/td><td>σ 控制各类和集<\/td><\/tr><tr><td>第 5 章<\/td><td>逆向<\/td><td>σ 小 ⟹ 低秩结构<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Ruzsa 距离<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Freiman 同态与 GAP<\/a>\n<\/ul>", "kind": "concept", "title": "倍增常数"}, "c03": {"html": "<h1>Ruzsa 距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>d(A,B) = log( |A−B| / √(|A||B|) )，是加性集之间的一个度量。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;和集小&quot;转成&quot;两个集合在度量意义下很近&quot;，于是可以用三角不等式在多个集合之间传递信息。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[A与B接近] --&gt; B[差集小]\n    B --&gt; C[三角不等式]\n    C --&gt; D[传递结构]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>选差集而不是和集，是因为差集有对称性，且 A−A 总包含 0，度量性质更好证。d=0 只说明 |A−B| 达到 √(|A||B|)，不说明两个集合相等。<\/p>\n<h2>常见误解<\/h2>\n<p>别把它当普通距离。它是对数尺度，且只反映大小，不反映元素位置。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>度量构造<\/td><td>三角不等式成立<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">倍增常数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">覆盖引理<\/a>\n<\/ul>", "kind": "concept", "title": "Ruzsa 距离"}, "c04": {"html": "<h1>加性能量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>E(A,B) = #{(a,b,a&#x27;,b&#x27;) : a+b = a&#x27;+b&#x27;}，数&quot;同一个和有多少种表示&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>能量是&quot;和集小&quot;的定量版本。能量大意味着表示密集，进而意味着存在大子集结构好（BSG）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[能量大] --&gt; B[表示多]\n    B --&gt; C[和集小]\n    C --&gt; D[BSG]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>下界 E ≥ |A|²|B|²/|A+B| 由柯西不等式得到。傅立叶形式 E(A,A) = Σ|Â(ξ)|⁴，把能量和谱的集中程度挂钩。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为能量大等于整个集合结构好。BSG 只能保证一个大子集结构好，少数例外元素可以很乱。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>定义<\/td><td>能量与和集互为表里<\/td><\/tr><tr><td>第 4 章<\/td><td>傅立叶<\/td><td>E = Σ<\/td><td>Â<\/td><td>⁴<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">BSG 定理<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">傅立叶系数<\/a>\n<\/ul>", "kind": "concept", "title": "加性能量"}, "c05": {"html": "<h1>覆盖引理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若 |A+B| ≤ K|B|，则存在 A&#x27; ⊂ A，|A&#x27;| ≤ K，使 A 被 A&#x27;+B−B 覆盖（Ruzsa 版本）。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;整个集合&quot;的问题降成&quot;骨架&quot;的问题，是几乎所有结构证明的第一步。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[和集小] --&gt; B[骨架A&#x27;]\n    B --&gt; C[平移覆盖]\n    C --&gt; D[局部化]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>覆盖不是相等：A 可能比骨架大得多，只是每个元素都能写成 a&#x27;+b−b&#x27; 的形式。这样后续只需控制骨架，代价是引入差集。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为骨架就是 A 的结构。骨架可能仍然很复杂，覆盖只是给了个&quot;坐标系统&quot;。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>Ruzsa 覆盖<\/td><td>骨架大小为 K<\/td><\/tr><tr><td>第 5 章<\/td><td>Chang 覆盖<\/td><td>谱意义下的覆盖<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Ruzsa 距离<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">BSG 定理<\/a>\n<\/ul>", "kind": "concept", "title": "覆盖引理"}, "c06": {"html": "<h1>Balog–Szemerédi–Gowers 定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2、6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若加性能量接近最大，则存在 A&#x27;⊂A、B&#x27;⊂B，两者只损失常数因子，且 |A&#x27;+B&#x27;| 只比 |B&#x27;| 大常数倍。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;能量大 ⟹ 有结构&quot;的转换器，全书使用频率最高的工具之一。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[能量大] --&gt; B[大子集A&#x27;]\n    A --&gt; C[大子集B&#x27;]\n    B --&gt; D[和集小]\n    C --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>证明有两条路线：一条用图论（二分图的连通性），一条用依赖随机变量。结论里的&quot;常数倍&quot;依赖初始的 K，通常增长很快。<\/p>\n<h2>常见误解<\/h2>\n<p>别指望它给出整个 A 的结构。它天生要损失子集，这是定理的形式决定的。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>陈述<\/td><td>能量转结构<\/td><\/tr><tr><td>第 6 章<\/td><td>图论证明<\/td><td>连通性抽取<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>、Plünnecke 不等式（见第 6 章）\n<\/ul>", "kind": "concept", "title": "Balog–Szemerédi–Gowers 定理"}, "c07": {"html": "<h1>Freiman 同态与广义等差数列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Freiman 同态是保持加法关系 a₁+a₂=a₃+a₄ 的映射；GAP 是 a + [0,N₁]·v₁ + ... + [0,N_d]·v_d 形式的集合。<\/p>\n<h2>为什么重要<\/h2>\n<p>Freiman 定理的结论就是&quot;小倍增集合落在低秩 GAP 里&quot;，而 Freiman 同态是把不同外观的集合统一起来的工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[小倍增] --&gt; B[Freiman定理]\n    B --&gt; C[低秩GAP]\n    C --&gt; D[真化]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>GAP 的秩是方向个数，体积上界是 ∏(N_i+1)。真 GAP 指元素个数达到上界，非真会塌缩，需要真化才能做计数。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 GAP 的秩等于环境群维数。秩可以远小于维数，这是结构压缩的关键。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>定义<\/td><td>体积与真化<\/td><\/tr><tr><td>第 5 章<\/td><td>结构定理<\/td><td>小倍增 ⟹ GAP<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">倍增常数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">覆盖引理<\/a>\n<\/ul>", "kind": "concept", "title": "Freiman 同态与广义等差数列"}, "c08": {"html": "<h1>傅立叶系数与线性偏差<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Â(ξ) = Σ_{a∈A} ξ(a) 是 A 在频率 ξ 上的投影；Â(ξ) 大就说 A 在该频率上有线性偏差。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把加法问题转成频率问题：卷积变乘法，能量变系数的四阶矩。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; B[傅立叶系数]\n    B --&gt; C[卷积定理]\n    C --&gt; D[和集估计]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>Parseval 给出能量守恒，卷积定理给出 (1_A * 1_B)̂ = Â·B̂。偏差大意味着 A 在某个圆周相位上分布不均，通常对应一条等差结构。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为偏差大就一定有等差数列。偏差只说明&quot;偏向某频率&quot;，结构形状可能更复杂。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>基础<\/td><td>卷积与 Parseval<\/td><\/tr><tr><td>第 10 章<\/td><td>密度增量<\/td><td>无 AP ⟹ 有偏差<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Bohr 集<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>\n<\/ul>", "kind": "concept", "title": "傅立叶系数与线性偏差"}, "c09": {"html": "<h1>Bohr 集<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4、10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>B(Δ,ρ) = {x : 对所有 ξ∈Δ，|ξ(x)−1| ≤ ρ}，是若干频率上同时接近 1 的元素的集合。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;多频率偏差&quot;对应的几何结构，也是密度增量论证里&quot;密度变高的那个子结构&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[频率集合] --&gt; B[Bohr集]\n    B --&gt; C[子群或低维GAP]\n    C --&gt; D[密度增量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>在循环群里，Bohr 集可以看成&quot;多条同余条件的交集&quot;。它的&quot;维数&quot;由频率集合的大小决定，体积由半径 ρ 和频率结构共同决定。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为 Bohr 集一定等于 GAP。两者在特定条件下对应，一般只是&quot;低复杂度的子群&quot;。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>定义<\/td><td>与 GAP 对偶<\/td><\/tr><tr><td>第 10 章<\/td><td>增量<\/td><td>密度在 Bohr 集上增加<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">傅立叶系数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Szemerédi 正则引理<\/a>\n<\/ul>", "kind": "concept", "title": "Bohr 集"}, "c10": {"html": "<h1>Littlewood–Offord 集中<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>给 d 个步长，问 2^d 个带符号和最多能有多少个相同；逆问题问若很多相同，步长必须长什么样。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;加法关系密集&quot;翻译成&quot;步长落在低秩结构里&quot;，是随机矩阵奇异概率估计的关键。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[步长向量] --&gt; B[带符号和]\n    B --&gt; C[最大重数]\n    C --&gt; D[逆定理]\n    D --&gt; E[低秩GAP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>步长全为 1 时最大重数约 2^d/√d；步长为 2 的幂时最大重数 1。Esséen 不等式用平方和控制集中度，逆定理用 Freiman 型结构刻画&quot;集中&quot;。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为集中只由&quot;重复步长&quot;造成。整数线性关系才是主因。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>正问题<\/td><td>组合数与傅立叶两种界<\/td><\/tr><tr><td>第 7.5 节<\/td><td>应用<\/td><td>随机矩阵奇异概率<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">加性能量<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Gowers 范数<\/a>\n<\/ul>", "kind": "concept", "title": "Littlewood–Offord 集中"}, "c11": {"html": "<h1>Gowers 范数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>U^k 范数是 2^k 个变量上的平均，衡量函数在 k 阶差分结构上是否均匀。<\/p>\n<h2>为什么重要<\/h2>\n<p>k 项等差数列由 U^{k−1} 控制；它把&quot;高阶均匀性&quot;变成一个可计算的量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[U1 L2范数] --&gt; B[U2 傅立叶四阶矩]\n    B --&gt; C[U3 四项AP]\n    C --&gt; D[Un 长AP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>U^1 就是普通 L²；U^2 等价于傅立叶系数的四阶矩；U^3 才能检测 4 项等差数列。逆定理说：范数大 ⟹ 存在低次多项式相位。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为它是傅立叶系数的简单推广。计算复杂度随 k 指数增长。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章<\/td><td>定义<\/td><td>高阶均匀性<\/td><\/tr><tr><td>第 11.4 节<\/td><td>逆定理<\/td><td>多项式相位<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">傅立叶系数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Szemerédi 定理<\/a>\n<\/ul>", "kind": "concept", "title": "Gowers 范数"}, "c12": {"html": "<h1>Szemerédi 正则引理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>任意大图都可以分成常数多块，使块内边密度近似一致、块间近似随机。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;任意图&quot;变成&quot;随机图 + 少量例外&quot;，是 Szemerédi 组合证明的核心分解工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[任意图] --&gt; B[分块]\n    B --&gt; C[块内均匀]\n    B --&gt; D[块间随机]\n    C --&gt; E[结构部分]\n    D --&gt; F[随机部分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>分块数量只依赖误差参数 ε，不依赖图的规模。每块大小可以很不均匀，这是&quot;正则&quot;的含义：不是块大小相等，而是边密度规则。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为引理给出的是&quot;等分&quot;。它只保证密度规则，块大小可以差很多。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10.6 节<\/td><td>陈述<\/td><td>图的正则分解<\/td><\/tr><tr><td>第 10.7 节<\/td><td>应用<\/td><td>Szemerédi 组合论证<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">Gowers 范数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">Bohr 集<\/a>\n<\/ul>", "kind": "concept", "title": "Szemerédi 正则引理"}, "c13": {"html": "<h1>组合零点定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>若多项式次数不超过 Σt_i，且最高次项系数非零，则在足够大的格点集 S₁×...×S_n 上必存在非零点。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;存在某个组合&quot;变成&quot;多项式系数不为零&quot;，是有限域上加性问题的标准武器。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[多项式] --&gt; B[最高次项系数]\n    B --&gt; C[格点非零]\n    C --&gt; D[受限和集下界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>条件 |S_i|&gt;t_i 保证格点数量超过次数上界；系数非零保证多项式不能在格点上&quot;假装为零&quot;。去掉任一条件定理都不成立。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为它对整环成立。需要域，&quot;零点数 ≤ 次数&quot;才可靠。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9.1 节<\/td><td>陈述<\/td><td>零点定理<\/td><\/tr><tr><td>第 9.2 节<\/td><td>应用<\/td><td>受限和集<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">和积问题<\/a>\n<\/ul>", "kind": "concept", "title": "组合零点定理"}, "c14": {"html": "<h1>和积问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、8、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>问集合 A 的加法和集 |A+A| 与乘法积集 |A·A| 能否同时很小；猜想是不能。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;加法结构与乘法结构互斥&quot;的定量表达，连接加性组合、几何与代数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[加法结构强] --&gt; C[乘法结构弱]\n    B[乘法结构强] --&gt; C\n    C --&gt; D[和积下界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>实数域用关联几何（斜线与双曲线的交点），有限域用组合零点定理或 Stepanov 方法。两条路线的结论形式相似，指数不同。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为和积估计给出了精确值。它只给 max(|A+A|,|A·A|) 的下界，且指数通常很小。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2.8 节<\/td><td>初等估计<\/td><td>幂次下界<\/td><\/tr><tr><td>第 8.3 节<\/td><td>几何证明<\/td><td>关联方法<\/td><\/tr><tr><td>第 9 章<\/td><td>有限域<\/td><td>代数方法<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<a href=\"#\" target=\"_blank\" rel=\"noopener\">组合零点定理<\/a>、关联几何（见第 8 章）\n<\/ul>", "kind": "concept", "title": "和积问题"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：建立坐标：加性集、和集、倍增常数<\/strong><br>阅读：<a href=\"#/chapter/ch00\">第 0 章：导论<\/a><br>检查点：能说出 σ 的三种典型取值对应什么结构<\/li><li class='path-step' id='path-02'><strong>步骤 02：概率工具箱<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：概率方法<\/a><br>检查点：能用一阶矩独立证明一个存在性结论<\/li><li class='path-step' id='path-03'><strong>步骤 03：和集估计与能量<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：和集估计<\/a><br>检查点：能写出能量下界并说明 BSG 的用途<\/li><li class='path-step' id='path-04'><strong>步骤 04：几何直觉：GAP 与凸体<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：加性几何<\/a><br>检查点：能算出一个低秩 GAP 的体积并判断真伪<\/li><li class='path-step' id='path-05'><strong>步骤 05：换到频率空间<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：傅立叶分析方法<\/a><br>检查点：能用卷积定理推出一个和集估计<\/li><li class='path-step' id='path-06'><strong>步骤 06：逆向：小倍增的结构<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：逆和集定理<\/a><br>检查点：能复述 Freiman 定理并说明有挠时的处理<\/li><li class='path-step' id='path-07'><strong>步骤 07：图论工具箱<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：图论方法<\/a><br>检查点：能用 Turán 定理估计一个无和集<\/li><li class='path-step' id='path-08'><strong>步骤 08：集中度：Littlewood–Offord<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：Littlewood–Offord 问题<\/a><br>检查点：能区分正向与逆向问题<\/li><li class='path-step' id='path-09'><strong>步骤 09：几何与代数的两套手法<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：关联几何<\/a><br>检查点：能说出 S-T 定理的指数来源<\/li><li class='path-step' id='path-10'><strong>步骤 10：有限域上的多项式方法<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：代数方法<\/a><br>检查点：能写出零点定理的完整条件<\/li><li class='path-step' id='path-11'><strong>步骤 11：密度增量：k=3<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：k=3 的 Szemerédi 定理<\/a><br>检查点：能讲清四步迭代为什么终止<\/li><li class='path-step' id='path-12'><strong>步骤 12：高阶均匀性：k&gt;3<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数<\/a><br>检查点：能说清为什么 k=4 需要 Gowers 范数<\/li><li class='path-step' id='path-13'><strong>步骤 13：和集的结构增益<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：和集中的长等差数列<\/a><br>检查点：能对比本章与 Szemerédi 的长度差别<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='all-q1' data-type='single'><p class='quiz-q'><b>Q40.<\/b> BSG 定理在整本书里的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q1' value='0'> 把能量大转成存在结构好的子集<\/label><label class='quiz-opt'><input type='radio' name='all-q1' value='1'> 把和集小直接转成子群<\/label><label class='quiz-opt'><input type='radio' name='all-q1' value='2'> 把偏差转成 Bohr 集<\/label><label class='quiz-opt'><input type='radio' name='all-q1' value='3'> 把稀疏集合转成稠密集合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q2' data-type='single'><p class='quiz-q'><b>Q41.<\/b> 为什么 k=4 的 Szemerédi 定理不能用线性傅立叶证明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q2' value='0'> 线性傅立叶只能检测一阶的中点结构<\/label><label class='quiz-opt'><input type='radio' name='all-q2' value='1'> 傅立叶变换在整数上不成立<\/label><label class='quiz-opt'><input type='radio' name='all-q2' value='2'> 四项等差数列根本不存在<\/label><label class='quiz-opt'><input type='radio' name='all-q2' value='3'> 傅立叶计算太慢<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q3' data-type='single'><p class='quiz-q'><b>Q42.<\/b> Freiman 定理与逆 Littlewood–Offord 的共同点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q3' value='0'> 都用傅立叶分析<\/label><label class='quiz-opt'><input type='radio' name='all-q3' value='1'> 都能给出集合的精确形状<\/label><label class='quiz-opt'><input type='radio' name='all-q3' value='2'> 都给出低秩 GAP 型结构<\/label><label class='quiz-opt'><input type='radio' name='all-q3' value='3'> 都只适用于有限域<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q4' data-type='single'><p class='quiz-q'><b>Q43.<\/b> 实数域与有限域上的和积证明，方法差异是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q4' value='0'> 都用关联几何<\/label><label class='quiz-opt'><input type='radio' name='all-q4' value='1'> 都用组合零点定理<\/label><label class='quiz-opt'><input type='radio' name='all-q4' value='2'> 都用概率方法<\/label><label class='quiz-opt'><input type='radio' name='all-q4' value='3'> 实数域用几何，有限域用代数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q5' data-type='single'><p class='quiz-q'><b>Q44.<\/b> Szemerédi 正则引理的作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q5' value='0'> 估计素数密度<\/label><label class='quiz-opt'><input type='radio' name='all-q5' value='1'> 把任意图分解为均匀块加随机部分<\/label><label class='quiz-opt'><input type='radio' name='all-q5' value='2'> 直接构造长等差数列<\/label><label class='quiz-opt'><input type='radio' name='all-q5' value='3'> 证明 Parseval 恒等式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='all-q6' data-type='single'><p class='quiz-q'><b>Q45.<\/b> Green–Tao 定理为什么不能直接使用 Szemerédi 定理？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='all-q6' value='0'> 素数集不含等差数列<\/label><label class='quiz-opt'><input type='radio' name='all-q6' value='1'> 素数集的密度为零，密度定理不适用<\/label><label class='quiz-opt'><input type='radio' name='all-q6' value='2'> 素数集太大<\/label><label class='quiz-opt'><input type='radio' name='all-q6' value='3'> Szemerédi 定理只对有限群成立<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch00__": {"html": "<h1>测验：第 0 章：导论<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> σ[A]=1 意味着什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> A 是空集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> A 是子群或它的陪集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> A 一定是等差数列<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> A 的倍增最大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 等比数列 {1,2,4,…,2^{n−1}} 的 σ 约为多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> n/2<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> n²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 讨论和集之前必须先明确什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 环境群<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 集合的基数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 元素的大小顺序<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 元素的奇偶性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：概率方法<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 X 是非负整数值随机变量且 E X&lt;1，能推出什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 存在一个样本使 X=0<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 所有样本都有 X=0<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> E X=0<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> X 恒等于 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Chernoff 界是对哪个量使用 Markov 不等式得到的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> X<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> e^{tX}<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> X²<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> log X<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Lovász 局部引理条件 e·p·(d+1)≤1 里的 d 指什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 坏事件的总数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 环境群的维数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 每个坏事件的相关事件数上限<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 随机变量的个数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：和集估计<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Ruzsa 距离是用哪一类集合定义的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 和集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 差集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> 积集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 补集<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 加性能量 E(A,B) 的下界是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> |A||B|<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> |A|²|B|²/|A+B|<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> |A+B|²<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> |A|²+|B|²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> BSG 定理保证的是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 整个 A 的结构都好<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> A 本身就是 GAP<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 存在大子集，其和集只大常数倍<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> A 是子群<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：加性几何<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 秩为 2、每个方向长度为 3 的 GAP 最多包含多少个点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 16<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 9<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Brunn–Minkowski 不等式说的是什么可加？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 体积<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 线性尺度<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 元素个数<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 维数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 真 GAP 的定义是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 方向线性无关<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 元素个数达到乘积上界<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 体积最小<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 秩等于 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：傅立叶分析方法<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 卷积定理的正确形式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> (f*g) 的变换 = f 的变换乘 g 的变换<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> (f+g) 的变换 = 两者变换相加<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> (f*g) 的变换 = 两者变换相加<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> (fg) 的变换 = 两者变换卷积<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一个集合有明显线性偏差，说明什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 它完全随机<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 它在某个频率上分布不均<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 它的和集一定最大<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 它的能量一定最小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 加性能量用傅立叶系数怎么写？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 系数的模平方和<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 系数的模三次方和<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 系数的模四次方和<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 系数的模和<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：逆和集定理<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> e-变换的主要目的是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> 增大和集<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> 保持和集不增并让集合更规整<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> 减小集合大小<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 更换环境群<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 无挠情形下 Freiman 定理的结论是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> A 是子群<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> A 落在低秩 GAP 里<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> A 一定是等差数列<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> A 没有加法关系<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 有挠群里处理结构问题的正确顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 直接套无挠版本<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 先分离挠部分再套定理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 先取商群再取子群<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 先做傅立叶变换<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：图论方法<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Turán 定理给出的独立集下界是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> n²/(2e+n)<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> n/(2e)<\/label><label class='quiz-opt'><input type='radio' name='q1' value= '0'> N 是有限的<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 密度每次增加，且有上界 1<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 偏差会自动消失<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> Bohr 集越来越大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 证明 k=3 的 Szemerédi 定理使用的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> Gowers 范数<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 超图移除引理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 线性傅立叶分析<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 转移原理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> k 项等差数列由哪个阶的 Gowers 范数控制？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> k−1 阶<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> k 阶<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> k+1 阶<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> 2 阶<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 硬障碍指的是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 线性相位<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 真正的高阶结构，如多项式相位或低维 GAP<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 随机噪声<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 可以忽略的小偏差<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Green–Tao 定理证明中的核心技术是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 密度增量<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 正则引理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 转移原理<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> Stepanov 方法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：和集中的长等差数列<\/h1><div class='quiz-item' data-qid='q1' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本章关于长等差数列的结论针对哪个对象？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1' value='0'> A 本身<\/label><label class='quiz-opt'><input type='radio' name='q1' value='1'> lA<\/label><label class='quiz-opt'><input type='radio' name='q1' value='2'> A−A<\/label><label class='quiz-opt'><input type='radio' name='q1' value='3'> A 的补集<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q2' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 完全序列的定义是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q2' value='0'> 每项可以重复使用<\/label><label class='quiz-opt'><input type='radio' name='q2' value='1'> 每项最多用一次就能表示所有足够大的整数<\/label><label class='quiz-opt'><input type='radio' name='q2' value='2'> 密度大于 1/2<\/label><label class='quiz-opt'><input type='radio' name='q2' value='3'> 一定含长等差数列<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q3' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 本章结论与 Szemerédi 定理在长度上的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q3' value='0'> 两者都是对数级<\/label><label class='quiz-opt'><input type='radio' name='q3' value='1'> 两者都是幂次级<\/label><label class='quiz-opt'><input type='radio' name='q3' value='2'> 本章幂次级，Szemerédi 是对数级<\/label><label class='quiz-opt'><input type='radio' name='q3' value='3'> 本章线性，Szemerédi 是幂次<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='加性集'>加性集 — 交换群里的一个有限非空子集，讨论和集时必须带上环境群 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='和集 a+b'>和集 A+B — 所有 a+b（a∈A，b∈B）组成的集合 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='差集 a−b'>差集 A−B — 所有 a−b 组成的集合，比和集更对称 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='小倍增'>小倍增 — σ 接近 1，集合几乎对加法封闭 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='随机集'>随机集 — 倍增常数接近最大值，加法关系稀少 <span class=glossary-ref>（第 0 章：导论）<\/span><\/li><li data-term='广义等差数列 gap'>广义等差数列 GAP — 起点加若干方向的整数系数组合，形如 a+[0,N₁]v₁+… <span class=glossary-ref>（第 3 章：加性几何）<\/span><\/li><li data-term='真 gap'>真 GAP — 元素个数达到 ∏(N_i+1) 上界、不发生塌缩的 GAP <span class=glossary-ref>（第 3 章：加性几何）<\/span><\/li><li data-term='真化'>真化 — 换方向或升维，把非真 GAP 变成真 GAP 的操作 <span class=glossary-ref>（第 3 章：加性几何）<\/span><\/li><li data-term='加性能量 e(a,b)'>加性能量 E(A,B) — 满足 a+b=a&#x27;+b&#x27; 的四元组个数 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='覆盖引理'>覆盖引理 — 和集小则存在小骨架，使整个集合被骨架加差集覆盖 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='bsg 定理'>BSG 定理 — 能量大则存在大子集，其和集只比自身大常数倍 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='对称集'>对称集 — 满足 A=−A 的集合 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='部分和集'>部分和集 — 集合在某个方向上投影得到的和集，用来控制不平衡性 <span class=glossary-ref>（第 2 章：和集估计）<\/span><\/li><li data-term='特征'>特征 — 群到单位圆的同态，满足 ξ(x+y)=ξ(x)ξ(y) <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='傅立叶系数 â(ξ)'>傅立叶系数 Â(ξ) — A 在频率 ξ 上的投影，衡量偏差 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='卷积定理'>卷积定理 — 卷积的傅立叶变换等于各自变换的乘积 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='bohr 集'>Bohr 集 — 在若干频率上同时接近 1 的元素集合 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='(p) 常数'>(p) 常数 — 衡量群里 p 元和为零的偏离程度的参数 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='bh[g] 集'>Bh[g] 集 — 每种和最多有 g 种表示的集合，Sidon 是 g=1 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='分离集'>分离集 — 元素之间没有短小整数线性关系的集合 <span class=glossary-ref>（第 4 章：傅立叶分析方法）<\/span><\/li><li data-term='e-变换'>e-变换 — 保持和集不增、把集合整理得更对称的操作 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='freiman 同态'>Freiman 同态 — 保持 a₁+a₂=a₃+a₄ 这类加法关系的映射 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='无挠'>无挠 — 群里没有满足 mx=0（m&gt;0）的非零元素 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='万能环境群'>万能环境群 — 使 A 的所有加法关系都保持的最大环境群 <span class=glossary-ref>（第 5 章：逆和集定理）<\/span><\/li><li data-term='turán 定理'>Turán 定理 — n 顶点 e 边的图，独立集至少 n²/(2e+n) <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='sidon 集'>Sidon 集 — 所有两两和互不相同的集合 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='ramsey 定理'>Ramsey 定理 — 足够大的完全图染色后必有大单色团 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='van der waerden 定理'>van der Waerden 定理 — 足够长的染色区间必有单色等差数列 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='plünnecke 不等式'>Plünnecke 不等式 — 一次和集膨胀率小，则多次和集膨胀率也受控 <span class=glossary-ref>（第 6 章：图论方法）<\/span><\/li><li data-term='littlewood–offord 问题'>Littlewood–Offord 问题 — 带符号和最多能重复多少次 <span class=glossary-ref>（第 7 章：Littlewood–Offord 问题）<\/span><\/li><li data-term='集中函数'>集中函数 — 随机和落在某点的概率上界 <span class=glossary-ref>（第 7 章：Littlewood–Offord 问题）<\/span><\/li><li data-term='esséen 不等式'>Esséen 不等式 — 集中度受步长平方和控制的估计 <span class=glossary-ref>（第 7 章：Littlewood–Offord 问题）<\/span><\/li><li data-term='关联'>关联 — 点落在线上的一次计数 <span class=glossary-ref>（第 8 章：关联几何）<\/span><\/li><li data-term='交叉数'>交叉数 — 图在平面上绘制时边与边的交叉次数 <span class=glossary-ref>（第 8 章：关联几何）<\/span><\/li><li data-term='网格分解'>网格分解 — 把平面切成格子以控制点线关系的方法 <span class=glossary-ref>（第 8 章：关联几何）<\/span><\/li><li data-term='组合零点定理'>组合零点定理 — 次数与最高项系数控制格点上是否存在非零点 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='受限和集'>受限和集 — 禁止同元素相加得到的和集 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='davenport 常数'>Davenport 常数 — 任意 k 个元素都有非空零和子集的最小 k <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='kemnitz 猜想'>Kemnitz 猜想 — Davenport 常数在平面格点上的版本，猜想值 4n−3 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='stepanov 方法'>Stepanov 方法 — 用&quot;零点数不超过次数&quot;反推集合大小 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='分圆域'>分圆域 — 有理数域添加单位根得到的扩域 <span class=glossary-ref>（第 9 章：代数方法）<\/span><\/li><li data-term='密度增量'>密度增量 — 无 AP 时在子结构上密度变高，迭代至矛盾的策略 <span class=glossary-ref>（第 10 章：k=3 的 Szemerédi 定理）<\/span><\/li><li data-term='提升'>提升 — 把区间里的集合搬到循环群里处理的技术 <span class=glossary-ref>（第 10 章：k=3 的 Szemerédi 定理）<\/span><\/li><li data-term='正则引理'>正则引理 — 任意大图可分成常数多块，使块间近似随机 <span class=glossary-ref>（第 10 章：k=3 的 Szemerédi 定理）<\/span><\/li><li data-term='gowers 范数 u^k'>Gowers 范数 U^k — 2^k 个变量上的平均，衡量 k 阶均匀性 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='硬障碍'>硬障碍 — 真正的高阶结构，如多项式相位或低维 GAP <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='软障碍'>软障碍 — 线性相位造成的表面偏差，可除掉相位消除 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='gowers 逆定理'>Gowers 逆定理 — 范数大则存在低次多项式相位解释偏差 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='超图移除引理'>超图移除引理 — 删少量边即可破坏全部完全子超图 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='转移原理'>转移原理 — 先用稠密均匀模型证明，再搬回稀疏集合 <span class=glossary-ref>（第 11 章：k&gt;3 的 Szemerédi 定理与 Gowers 范数）<\/span><\/li><li data-term='完全序列'>完全序列 — 每项最多用一次就能表示所有足够大整数的序列 <span class=glossary-ref>（第 12 章：和集中的长等差数列）<\/span><\/li><li data-term='次完全序列'>次完全序列 — 允许有限项数的完全性版本 <span class=glossary-ref>（第 12 章：和集中的长等差数列）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<p>这本书真正可迁移的东西不是定理，是八套反复出现的证明套路。每套都写清&quot;什么时候想起来用它&quot;。<\/p>\n<h2>框架 1：随机方法的四层递进<\/h2>\n<p><strong>何时用<\/strong>：要证&quot;存在一个对象满足性质 P&quot;，但显式构造很难。<\/p>\n<p><strong>怎么做<\/strong>：随机生成对象，把&quot;失败&quot;定义成坏事件。按需要的精度选工具：<\/p>\n<ol><li>\n只想知道&quot;有没有&quot;——算坏事件个数的期望，小于 1 就存在。\n<\/li><li>\n想排除&quot;集中在零附近&quot;——加方差，用 P(X&gt;0) ≥ (EX)²/E(X²)。\n<\/li><li>\n要指数小的尾部——对 e^{tX} 用 Markov，再对 t 优化。\n<\/li><li>\n坏事件之间有依赖——度小用局部引理，度大但边少用 Janson。\n<\/ol>\n<p><strong>作者的做法<\/strong>：先算期望定位量级，再决定要不要上二阶或指数。不要一上来就 Chernoff。<\/p>\n<h2>框架 2：局部化<\/h2>\n<p><strong>何时用<\/strong>：整个集合太大，直接分析无从下手。<\/p>\n<p><strong>怎么做<\/strong>：用覆盖引理找一个大小受控的骨架 A&#x27;，把原集合写成骨架加差集的平移。之后所有操作都在骨架上做，误差用 K 来控制。<\/p>\n<p><strong>反模式<\/strong>：把骨架当成原集合的结构。骨架只是坐标，原集合可以比它乱得多。<\/p>\n<h2>框架 3：能量转换<\/h2>\n<p><strong>何时用<\/strong>：已知&quot;表示次数很多&quot;，想推出&quot;存在结构好的子集&quot;。<\/p>\n<p><strong>怎么做<\/strong>：把表示次数写成能量，用柯西不等式建立与和集大小的关系，再用 BSG 转成子集结构。损失的部分用&quot;子集仍占常数比例&quot;来兜住。<\/p>\n<p><strong>关键判断<\/strong>：BSG 天生要损失子集。如果结论需要覆盖整个 A，就不能只用它，得配合覆盖引理或 e-变换。<\/p>\n<h2>框架 4：结构定理落地<\/h2>\n<p><strong>何时用<\/strong>：已经知道倍增常数小，想要 A 的具体形状。<\/p>\n<p><strong>怎么做<\/strong>：先用 e-变换整理成对称、极小，再分有挠/无挠。无挠套 Freiman 得 GAP，有挠先分离挠部分。最后检查 GAP 是否真，非真就真化。<\/p>\n<p><strong>常见断点<\/strong>：GAP 不真时体积估计全错，真化这一步不能跳。<\/p>\n<h2>框架 5：换到频率空间<\/h2>\n<p><strong>何时用<\/strong>：问题涉及&quot;和中点&quot;&quot;重复表示&quot;&quot;等差结构&quot;。<\/p>\n<p><strong>怎么做<\/strong>：把集合的指示函数做傅立叶变换。卷积变乘法，能量变四阶矩。偏差大就找 Bohr 集，把偏差翻译成子结构上的密度。<\/p>\n<p><strong>边界<\/strong>：线性傅立叶只能看一阶结构，k≥4 的等差数列必须换 Gowers 范数。<\/p>\n<h2>框架 6：双重计数<\/h2>\n<p><strong>何时用<\/strong>：有两类对象（点与线、集合与和），想估它们的关联总数。<\/p>\n<p><strong>怎么做<\/strong>：一种方式按&quot;每个对象连多少&quot;数，另一种按&quot;结构约束&quot;数，两个结果必须相等，于是得到不等式。几何里还要加上交叉数这个额外约束。<\/p>\n<p><strong>反模式<\/strong>：只数一遍。双重计数的力量全在&quot;两种数法给出不同表达式&quot;。<\/p>\n<h2>框架 7：多项式化<\/h2>\n<p><strong>何时用<\/strong>：在有限域上，组合条件难以直接计数。<\/p>\n<p><strong>怎么做<\/strong>：把&quot;某种组合不存在&quot;写成多项式在格点上取零，用次数上界和系数非零推出矛盾。或者反过来，构造一个零点很多的多项式，用&quot;零点 ≤ 次数&quot;限制集合大小。<\/p>\n<p><strong>前提<\/strong>：必须是域。整环上零点数可以超过次数。<\/p>\n<h2>框架 8：密度增量<\/h2>\n<p><strong>何时用<\/strong>：要证&quot;正密度集合必含某种结构&quot;。<\/p>\n<p><strong>怎么做<\/strong>：假设不含，用傅立叶或高阶范数找到偏差，把偏差转成某个 Bohr 集/子结构上密度增加，迭代。密度有上界 1，所以迭代次数有限，最终矛盾。<\/p>\n<p><strong>量化要点<\/strong>：每步增量只依赖当前密度，不依赖 N。这是界能写出来的原因。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要和集大小估计，先看 σ：σ 小用结构定理，σ 大用傅立叶。\n<\/li><li>\n要存在性，先用随机方法；构造不出来不是失败，是这类问题的常态。\n<\/li><li>\n要处理 k≥4 的等差数列，别试线性傅立叶，直接上 Gowers。\n<\/li><li>\n稀疏集合（如素数）别直接套 Szemerédi，先做转移。\n<\/li><li>\n有限域上的组合问题，优先想能不能写成多项式。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把&quot;存在&quot;当&quot;构造&quot;<\/strong>。概率方法给的是存在性，很多情形没有已知算法。\n<\/li><li>\n<strong>把&quot;子集结构&quot;当&quot;整体结构&quot;<\/strong>。BSG、逆 Littlewood–Offord 都只保证大多数。\n<\/li><li>\n<strong>把&quot;界很松&quot;当&quot;方法错了&quot;<\/strong>。Ramsey、Szemerédi 的界本来就巨大，能证存在就算成功。\n<\/li><li>\n<strong>在非域上套零点定理<\/strong>。这是最常见的硬错误。\n<\/li><li>\n<strong>忽略真化<\/strong>。GAP 不真时，所有基于体积的计数都会失效。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>记号<\/h2>\n<table><thead><tr><th>记号<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>A+B<\/td><td>{a+b : a∈A, b∈B}<\/td><\/tr><tr><td>A−B<\/td><td>{a−b : a∈A, b∈B}<\/td><\/tr><tr><td>kA<\/td><td>A+A+…+A（k 次）<\/td><\/tr><tr><td>σ[A]<\/td><td>\\<\/td><td>A+A\\<\/td><td>/\\<\/td><td>A\\<\/td><td><\/td><\/tr><tr><td>E(A,B)<\/td><td>满足 a+b=a&#x27;+b&#x27; 的四元组个数<\/td><\/tr><tr><td>Â(ξ)<\/td><td>Σ_{a∈A} ξ(a)，傅立叶系数<\/td><\/tr><tr><td>d(A,B)<\/td><td>log(\\<\/td><td>A−B\\<\/td><td>/√(\\<\/td><td>A\\<\/td><td>\\<\/td><td>B\\<\/td><td>))<\/td><\/tr><tr><td>U^k<\/td><td>Gowers k 阶范数<\/td><\/tr><tr><td>I(P,L)<\/td><td>点集 P 与线集 L 的关联数<\/td><\/tr><\/tbody><\/table>\n<h2>核心不等式<\/h2>\n<table><thead><tr><th>名称<\/th><th>内容<\/th><th>用在哪<\/th><\/tr><\/thead><tbody><tr><td>平凡下界<\/td><td>\\<\/td><td>A+B\\<\/td><td>≥ \\<\/td><td>A\\<\/td><td>+\\<\/td><td>B\\<\/td><td>−1（ℤ 中）<\/td><td>一维估计<\/td><\/tr><tr><td>柯西-能量<\/td><td>E(A,B) ≥ \\<\/td><td>A\\<\/td><td>²\\<\/td><td>B\\<\/td><td>²/\\<\/td><td>A+B\\<\/td><td><\/td><td>能量与和集互推<\/td><\/tr><tr><td>Ruzsa 三角<\/td><td>d(A,C) ≤ d(A,B)+d(B,C)<\/td><td>距离传递<\/td><\/tr><tr><td>Ruzsa 覆盖<\/td><td>\\<\/td><td>A+B\\<\/td><td>≤K\\<\/td><td>B\\<\/td><td>⟹ A ⊂ A&#x27;+B−B，\\<\/td><td>A&#x27;\\<\/td><td>≤K<\/td><td>局部化<\/td><\/tr><tr><td>Plünnecke<\/td><td>\\<\/td><td>A+B\\<\/td><td>≤K\\<\/td><td>B\\<\/td><td>⟹ \\<\/td><td>kA+lB\\<\/td><td>≤K^{k+l}\\<\/td><td>B\\<\/td><td><\/td><td>多次和集<\/td><\/tr><tr><td>Brunn–Minkowski<\/td><td>\\<\/td><td>A+B\\<\/td><td>^{1/d} ≥ \\<\/td><td>A\\<\/td><td>^{1/d}+\\<\/td><td>B\\<\/td><td>^{1/d}<\/td><td>凸体体积<\/td><\/tr><tr><td>Parseval<\/td><td>Σ\\<\/td><td>f\\<\/td><td>²=(1/\\<\/td><td>Z\\<\/td><td>)Σ\\<\/td><td>f̂\\<\/td><td>²<\/td><td>能量守恒<\/td><\/tr><tr><td>能量-傅立叶<\/td><td>E(A,A)=Σ\\<\/td><td>Â(ξ)\\<\/td><td>⁴<\/td><td>谱估计<\/td><\/tr><tr><td>Esséen<\/td><td>sup P(Σεv=x) ≤ C/√(Σ\\<\/td><td>v\\<\/td><td>²)<\/td><td>集中度<\/td><\/tr><tr><td>Turán<\/td><td>独立集 ≥ n²/(2e+n)<\/td><td>无和集<\/td><\/tr><tr><td>交叉数<\/td><td>交叉 ≥ m−3n+6（n≥3）<\/td><td>关联几何<\/td><\/tr><tr><td>S-T<\/td><td>I(P,L) ≲ \\<\/td><td>P\\<\/td><td>^{2/3}\\<\/td><td>L\\<\/td><td>^{2/3}+\\<\/td><td>P\\<\/td><td>+\\<\/td><td>L\\<\/td><td><\/td><td>点线关联<\/td><\/tr><\/tbody><\/table>\n<h2>常数与界<\/h2>\n<table><thead><tr><th>量<\/th><th>值或量级<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>最大无和子集（[1,n]）<\/td><td>⌈n/3⌉<\/td><td>奇数构造可达<\/td><\/tr><tr><td>秩 d 长度 N 的 GAP 体积<\/td><td>(N+1)^d<\/td><td>真时等于元素数<\/td><\/tr><tr><td>小倍增精确刻画阈值<\/td><td>σ&lt;2 或 σ&lt;3<\/td><td>视群结构而定<\/td><\/tr><tr><td>LO 集中度（步长全 1）<\/td><td>~2^d/√d<\/td><td>二项式系数峰值<\/td><\/tr><tr><td>随机 Bernoulli 矩阵奇异率<\/td><td>(1/2+o(1))^n<\/td><td>逆 LO 证明<\/td><\/tr><tr><td>Szemerédi k=3 定量界<\/td><td>log log N 起，改进到 (log N)^c<\/td><td>逐步优化<\/td><\/tr><\/tbody><\/table>\n<h2>证明路线速查<\/h2>\n<table><thead><tr><th>要证什么<\/th><th>首选工具<\/th><th>备选<\/th><\/tr><\/thead><tbody><tr><td>存在某对象<\/td><td>一阶矩<\/td><td>二阶矩、LLL<\/td><\/tr><tr><td>和集小 ⟹ 结构<\/td><td>覆盖引理 + Freiman<\/td><td>e-变换<\/td><\/tr><tr><td>表示多 ⟹ 结构<\/td><td>能量 + BSG<\/td><td>图论连通性<\/td><\/tr><tr><td>有偏差 ⟹ 子结构密度高<\/td><td>傅立叶 + Bohr 集<\/td><td>高阶范数<\/td><\/tr><tr><td>正密度 ⟹ 长 AP<\/td><td>密度增量<\/td><td>遍历、正则引理<\/td><\/tr><tr><td>稀疏集合 ⟹ 长 AP<\/td><td>转移原理<\/td><td>——<\/td><\/tr><tr><td>有限域组合下界<\/td><td>组合零点定理<\/td><td>Stepanov<\/td><\/tr><\/tbody><\/table>\n<h2>三个最常搞混的点<\/h2>\n<ul><li>\n<strong>和集小 ≠ 集合是等差数列<\/strong>：也可能是子群、陪集、低秩 GAP。\n<\/li><li>\n<strong>偏差大 ≠ 有等差数列<\/strong>：只说明偏向某频率，形状可能复杂。\n<\/li><li>\n<strong>能量大 ≠ 整个集合规整<\/strong>：只保证存在大子集规整。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452396126845186/加性组合学/01-加性组合学", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 0 章：导论", "href": "#/chapter/ch00"}, {"label": "第 1 章：概率方法", "href": "#/chapter/ch01"}, {"label": "第 2 章：和集估计", "href": "#/chapter/ch02"}, {"label": "第 3 章：加性几何", "href": "#/chapter/ch03"}, {"label": "第 4 章：傅立叶分析方法", "href": "#/chapter/ch04"}, {"label": "第 5 章：逆和集定理", "href": "#/chapter/ch05"}, {"label": "第 6 章：图论方法", "href": "#/chapter/ch06"}, {"label": "第 7 章：Littlewood–Offord 问题", "href": "#/chapter/ch07"}, {"label": "第 8 章：关联几何", "href": "#/chapter/ch08"}, {"label": "第 9 章：代数方法", "href": "#/chapter/ch09"}, {"label": "第 10 章：k=3 的 Szemerédi 定理", "href": "#/chapter/ch10"}, {"label": "第 11 章：k>3 的 Szemerédi 定理与 Gowers 范数", "href": "#/chapter/ch11"}, {"label": "第 12 章：和集中的长等差数列", "href": "#/chapter/ch12"}]}, {"label": "概念", "children": [{"label": "加性集与和集", "href": "#/concept/c01"}, {"label": "倍增常数", "href": "#/concept/c02"}, {"label": "Ruzsa 距离", "href": "#/concept/c03"}, {"label": "加性能量", "href": "#/concept/c04"}, {"label": "覆盖引理", "href": "#/concept/c05"}, {"label": "Balog–Szemerédi–Gowers 定理", "href": "#/concept/c06"}, {"label": "Freiman 同态与广义等差数列", "href": "#/concept/c07"}, {"label": "傅立叶系数与线性偏差", "href": "#/concept/c08"}, {"label": "Bohr 集", "href": "#/concept/c09"}, {"label": "Littlewood–Offord 集中", "href": "#/concept/c10"}, {"label": "Gowers 范数", "href": "#/concept/c11"}, {"label": "Szemerédi 正则引理", "href": "#/concept/c12"}, {"label": "组合零点定理", "href": "#/concept/c13"}, {"label": "和积问题", "href": "#/concept/c14"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 0 章：导论", "href": "#/quiz/ch00"}, {"label": "测验：第 1 章：概率方法", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：和集估计", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：加性几何", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：傅立叶分析方法", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：逆和集定理", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：图论方法", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：Littlewood–Offord 问题", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：关联几何", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：代数方法", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：k=3 的 Szemerédi 定理", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：k>3 的 Szemerédi 定理与 Gowers 范数", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：和集中的长等差数列", "href": "#/quiz/ch12"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch00": "<h1>第 0 章：这门学科在做什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：微积分、线性代数、概率论的基本概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清&quot;加性集&quot;和&quot;和集&quot;这两个词在本书里指什么\n<\/li><li>\n用一两句话解释为什么&quot;集合有多少加性结构&quot;可以用 |A+A| 来衡量\n<\/li><li>\n看懂全书十二章的组织逻辑，知道哪几章是主干、哪几章是专用工具\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>加性组合学研究的是&quot;一个集合在加法下有多大的结构&quot;，衡量方式是看 A+A 比 A 大多少；结构强就往等差数列方向走，结构弱就接近随机。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：加性集（additive set）<\/h3>\n<p>本书开头就规定：一个加性集是一对 (A, Z)，其中 Z 是一个交换群，A 是 Z 的有限非空子集。所有讨论都相对这个&quot;环境群&quot;进行。<\/p>\n<p><strong>为什么一定要带上 Z？<\/strong> 因为&quot;和&quot;这个运算要在某个群里才有意义。同样是 {1, 2, 3}，放在整数群里，1+2=3；放在模 5 的群里，2+3=0，结构完全不同。<\/p>\n<p><strong>例子<\/strong>：A = {1,2,3} ⊂ ℤ，则 A+A = {2,3,4,5,6}，五个元素。A = {0,1,2} ⊂ ℤ/3ℤ，则 A+A = {0,1,2}，还是三个元素。同一个大小的集合，第二个的加性结构明显更强。<\/p>\n<h3>概念 2：和集与差集<\/h3>\n<p>A+B = {a+b : a∈A, b∈B}，A−B = {a−b : a∈A, b∈B}。这两个是最基本的观察对象。<\/p>\n<p>直觉上，两个&quot;随机&quot;的集合相加，结果会铺开得很大，接近 |A||B| 的量级；两个&quot;有结构&quot;的集合（比如等差数列）相加，结果只比原来大一点。所以 |A+A| 与 |A| 的比值，可以当作结构强弱的温度计。<\/p>\n<h3>概念 3：倍增常数<\/h3>\n<p>σ[A] := |A+A| / |A|。<\/p>\n<ul><li>\nσ[A] = 1 只有一种情况：A 是子群（或子群的陪集）。\n<\/li><li>\nσ[A] 很小（比如小于 2、小于 3）时，A 的结构可以被完全刻画，这是第 5 章的内容。\n<\/li><li>\nσ[A] 接近 |A| 时，A 几乎是随机的，加性组合学的强定理基本管不到。\n<\/ul>\n<p>这条例题贯穿全书：<strong>结构越强，σ 越小；σ 越小，集合越像等差数列或者子群。<\/strong><\/p>\n<h3>概念 4：两种问法，正问题和反问题<\/h3>\n<p>正问题（第 2 章）：已知 A、B 的某些信息，能推出 |A+B| 至少多大、最多多大？<\/p>\n<p>反问题（第 5 章）：已知 |A+A| 很小，能反推出 A 长什么样？<\/p>\n<p>这两种问法在整本书里交替出现。第 7 章的 Littlewood–Offord 问题也是同样的正反结构：一边问&quot;子集和最多能集中到什么程度&quot;，一边问&quot;如果集中了，步长向量必须长什么样&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[加性集与和集] --&gt; B[和集估计 第2章]\n    A --&gt; C[加性几何 第3章]\n    B --&gt; D[傅立叶方法 第4章]\n    B --&gt; E[逆和集定理 第5章]\n    B --&gt; F[图论方法 第6章]\n    D --&gt; G[Littlewood-Offord 第7章]\n    E --&gt; H[关联几何 第8章]\n    E --&gt; I[代数方法 第9章]\n    D --&gt; J[Szemeredi k=3 第10章]\n    G --&gt; K[Szemeredi k&gt;3 第11章]\n    K --&gt; L[和集中的长等差数列 第12章]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把集合想成一群人，加法想成&quot;两人握手&quot;。<\/p>\n<ul><li>\n如果这群人来自同一个家族，彼此都认识，握手组合的种类很少——这就是子群或者等差数列，σ 小。\n<\/li><li>\n如果这群人是随机抽的陌生人，握手组合几乎两两不同——σ 大。\n<\/ul>\n<p><strong>注意类比的失效边界<\/strong>：现实中的&quot;认识&quot;不满足结合律也不满足交换律，而群运算满足。所以这个类比只能帮你记住&quot;结构 = 组合数量少&quot;，不能用来推导定理。<\/p>\n<p><strong>实例<\/strong>：取 A = {0,1,...,n−1} ⊂ ℤ。A+A = {0,1,...,2n−2}，大小 2n−1，σ[A] = (2n−1)/n ≈ 2。这就是最标准的&quot;有结构&quot;：一个等差数列，加倍后长度只翻了一倍。<\/p>\n<p>再取 B = {0,1,2,4,8,...,2^{n−1}}（等比数列）。B+B 里的元素是 2^i+2^j（i≤j），互不相同的有 n(n+1)/2 个，σ[B] ≈ n/2，几乎最大。等比数列在加法下毫无结构——这是最常用的反例。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 σ[A] 小就一定是等差数列。σ[A] &lt; 3 时确实能刻画，但刻画出来的是&quot;子群加小扰动&quot;或者&quot;低秩广义等差数列&quot;，形状比等差数列宽得多。\n<\/li><li>\n别以为 |A+A| 只能靠&quot;数一遍&quot;来算。对 n 很大的集合，直接枚举 A+A 是 O(n²)，定理的价值就在于不解方程也能给出上下界。\n<\/li><li>\n别以为环境群不重要。同一个 A 放在 ℤ 和 ℤ/pℤ 里，σ 可以差很远；本书很多定理都要求&quot;无挠&quot;（torsion-free）或&quot;特征大&quot;。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nA = {1,2,3} ⊂ ℤ，|A+A| 是多少？（答案：5；解析：2 到 6 共五个值，注意 1+3=2+2 这类重复会合并。）\n<\/li><li>\n为什么 σ[A] = 1 意味着 A 是子群或陪集？（答案：因为 |A+A| = |A| 表示 A+A 与 A 同大小，而 A+A 包含 A+a₀ 的平移，只能是整个集合对加法封闭；解析：取 a₀∈A，A+a₀ ⊂ A+A 且大小相同，故 A+A = A+a₀，推出 A 对加法封闭。）\n<\/li><li>\n等比数列为什么是&quot;加法下无结构&quot;的典型？（答案：指数不同的二进制和几乎不重复，|B+B| 接近 n²/2，σ 接近 n/2；解析：2^i + 2^j 的二进制表示唯一确定 i、j。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加性集 = 集合 + 环境群，两个都要说。\n<\/li><li>\nσ[A] = |A+A|/|A|，是全书的结构温度计。\n<\/li><li>\n正问题给界，反问题给形状，两条线交错推进。\n<\/ul>", "ch01": "<h1>第 1 章：概率方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 0 章；概率论的期望、方差、独立\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用一阶矩、二阶矩、指数矩三种手段证明&quot;满足某性质的对象存在&quot;\n<\/li><li>\n说出 FKG、BK、Harris 三个相关不等式的适用条件，知道它们为什么要求&quot;单调事件&quot;\n<\/li><li>\n用 Lovász 局部引理处理有依赖的坏事件，用 Janson 不等式处理弱相关的情形\n<\/li><li>\n解释为什么&quot;随机构造&quot;能给出确定性结论\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>想证明存在一个集合 B 具有性质 P，只要设计一个随机集合，证明它满足 P 的概率大于零；四种矩方法分别对应四种&quot;概率不为零&quot;的估计方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一阶矩方法<\/h3>\n<p>若 X 是非负整数值随机变量，则 P(X &gt; 0) ≤ E X。反过来，如果 E X &lt; 1，就必然存在一个样本使 X = 0。这是最简单的&quot;存在性&quot;工具。<\/p>\n<p><strong>典型用法<\/strong>：数&quot;坏对象&quot;的期望个数。如果坏对象的期望个数小于 1，就存在一个对象不是坏的。<\/p>\n<p><strong>例子（无和集）<\/strong>：从 {1,...,n} 里随机选一个子集，每个元素以概率 p 独立入选。计算&quot;含 x+y=z&quot;的三元组期望个数，取 p 使期望小于 1，就能找到一个大小约 n/3 的无和集。这就是 Erdős 的经典结论：最大无和子集至少有 ⌈n/3⌉ 个元素。<\/p>\n<h3>概念 2：二阶矩方法<\/h3>\n<p>只有期望不够时，看方差。切比雪夫不等式给出 P(|X − EX| ≥ t) ≤ Var(X)/t²。常用形式是<\/p>\n<p>P(X &gt; 0) ≥ (EX)² / E(X²)。<\/p>\n<p>这个式子比一阶矩强的地方在于：它要求随机变量&quot;通常不为零&quot;，而不只是&quot;平均不为零&quot;。<\/p>\n<p><strong>例子<\/strong>：随机图里的三角形个数、随机集合里的表示次数，都适合先用期望判断量级，再用二阶矩确认它不集中在零附近。<\/p>\n<h3>概念 3：指数矩方法与 Chernoff 界<\/h3>\n<p>对独立的 0-1 变量之和 S，用 Markov 不等式作用在 e^{tS} 上，再对 t 优化，得到<\/p>\n<p>P(S ≥ (1+δ)μ) ≤ exp(−μδ²/3)，P(S ≤ (1−δ)μ) ≤ exp(−μδ²/2)。<\/p>\n<p>关键在&quot;对 t 优化&quot;这个动作：直接对 S 用 Markov 只能得到多项式型的界，套上指数函数再优化就能得到指数型衰减。这是后面大量证明里估计尾部概率的标准动作。<\/p>\n<h3>概念 4：相关不等式<\/h3>\n<p>FKG、BK、Harris 说的是同一件事的不同版本：<strong>如果事件是单调增的，那么它们正相关<\/strong>。<\/p>\n<p>比如&quot;随机子集包含某个固定元素&quot;是单调增事件，两个这样的事件同时发生的概率，不小于各自概率的乘积。这样就能把复杂的联合概率拆成乘积来估算。<\/p>\n<p>用的时候要注意两点：事件必须单调（增加元素不会让事件从真变假），测度必须是乘积测度。少一个条件，不等式就不成立。<\/p>\n<h3>概念 5：Lovász 局部引理与 Janson 不等式<\/h3>\n<p>局部引理处理的是&quot;坏事件之间有依赖，但每个坏事件只和少数几个坏事件相关&quot;的情形：若每个坏事件概率不超过 p，且每个坏事件最多与 d 个其他坏事件相关，当 e·p·(d+1) ≤ 1 时，所有坏事件都不发生的概率为正。<\/p>\n<p>Janson 不等式是它的&quot;求和版本&quot;，给出坏事件至少发生一个的概率上界，适用于弱相关的情形。<\/p>\n<p>两者的差别：局部引理要&quot;依赖度有界&quot;，Janson 要&quot;依赖结构可以用图上的边来量化&quot;。做题时先看依赖图的度，度小用 LLL，度大但边少用 Janson。<\/p>\n<h3>概念 6：多项式集中<\/h3>\n<p>随机变量是低次多项式时（比如随机图的边数、随机集合的表示函数），可以用&quot;改变一个变量最多改变多少&quot;来度量集中程度。这类结果在本书里用来处理不能用独立性和给出的量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[要证存在] --&gt; B[设计随机对象]\n    B --&gt; C{坏事件多不多}\n    C --&gt;|期望小于1| D[一阶矩]\n    C --&gt;|通常不为0| E[二阶矩]\n    C --&gt;|尾部要指数小| F[指数矩]\n    C --&gt;|事件单调| G[相关不等式]\n    C --&gt;|依赖有界| H[局部引理]\n    C --&gt;|弱相关求和| I[Janson]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：想证明&quot;会场里存在一个不说话的人&quot;，不必挨个去问。可以随机点一个人，算他说话的概率；如果平均说话人数小于 1，就必然有沉默的人。二阶矩相当于再确认&quot;大多数人确实在说话&quot;，否则平均数小于 1 也可能只是少数人说了很多话。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只在&quot;人数有限、概率可算&quot;时成立。连续分布或者无限集合上，需要先做截断。<\/p>\n<p><strong>实例（薄基）<\/strong>：自然数的一个基是指 A+A 覆盖所有足够大的整数。用概率方法可以构造出&quot;薄&quot;的基：让 A 在 [1,N] 里随机选取，密度约 √(log N / N)，则几乎每个数都有表示，同时 |A| 远小于 N。这个构造的意义是：基可以很稀疏，稀疏到 |A| ≈ N^{1/2} 量级，而不是 N。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为概率方法给出了算法。它只证明存在，不给出构造；很多情况下确定性构造至今未知。\n<\/li><li>\n别以为&quot;期望小于 1&quot;就能推出&quot;一个坏对象都没有&quot;。它只能推出&quot;存在一个对象没有坏&quot;，这两个结论方向不同。\n<\/li><li>\n别以为相关不等式对任意事件都成立。去掉单调性，FKG 立刻失效，反例很容易构造。\n<\/li><li>\n别以为 Chernoff 界只对 0-1 变量有效。它有多种推广形式，但使用时必须核对独立性或负相关性条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 E X = 0.9 且 X 取非负整数，能推出什么？（答案：存在样本使 X=0；解析：若处处 X≥1，则 E X≥1，矛盾。）\n<\/li><li>\n为什么二阶矩方法比一阶矩&quot;更强&quot;？（答案：它估计的是 P(X&gt;0) 的下界，而一阶矩给的是上界；解析：两者方向不同，二阶矩用方差排除了&quot;集中在零附近&quot;的可能。）\n<\/li><li>\n局部引理中 e·p·(d+1) ≤ 1 这个条件在控制什么？（答案：控制依赖图的度数与坏事件概率的乘积；解析：每条依赖边贡献一份概率放大，度越大要求 p 越小。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四种矩：一阶给存在，二阶给不集中，指数矩给指数尾，相关不等式给联合概率。\n<\/li><li>\nLLL 看&quot;度&quot;，Janson 看&quot;边&quot;。\n<\/li><li>\n随机构造只证存在，不构造算法。\n<\/ul>", "ch02": "<h1>第 2 章：和集估计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 0、1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 Ruzsa 距离和加性能量这两个量描述和集的大小\n<\/li><li>\n说清覆盖引理在做什么，为什么它是&quot;局部化&quot;的工具\n<\/li><li>\n叙述 BSG 定理的结论，知道它把&quot;能量大&quot;翻译成&quot;存在大子集使和集小&quot;\n<\/li><li>\n用多项式方法证明一个基本的和积估计\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>|A+B| 小不是一个孤立事实，它会牵动 |A−B|、能量、子集结构；Ruzsa 距离把这种牵动整理成了一个度量空间，BSG 定理是其中最锋利的转换器。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：和集的基本界<\/h3>\n<p>最平凡的上界是 |A+B| ≤ |A||B|。最平凡的下界是 |A+B| ≥ |A| + |B| − 1（在整数群里）。<\/p>\n<p>真正有用的是&quot;反向&quot;：如果 |A+B| 明显小于 |A||B|，说明 A、B 之间有加法关系。这种关系可以传递：|A+B| 小，往往意味着 |A−B| 也小。<\/p>\n<h3>概念 2：Ruzsa 距离<\/h3>\n<p>定义 d(A,B) = log( |A−B| / √(|A||B|) )。<\/p>\n<p><strong>为什么用差集而不是和集？<\/strong> 因为差集有对称性：A−B 与 B−A 大小相同，而 A+B 与 B+A 虽然也相同，但差集在群里有更好的代数性质（A−A 包含 0，是&quot;对称&quot;的）。<\/p>\n<p>这个 d 满足三角不等式：<\/p>\n<p>d(A,C) ≤ d(A,B) + d(B,C)。<\/p>\n<p>于是所有有限加性集构成一个度量空间。很多证明的思路就是&quot;先在 d 意义下靠近，再用覆盖引理把靠近翻译成集合层面的包含&quot;。<\/p>\n<p><strong>例子<\/strong>：A = [0,n−1]，B = [0,m−1]，则 |A−B| = n+m−1，d ≈ ½log(n/m) + 常数。两个长度相近的区间，距离接近 0。<\/p>\n<h3>概念 3：加性能量<\/h3>\n<p>E(A,B) = #{ (a,b,a&#x27;,b&#x27;) : a+b = a&#x27;+b&#x27; }。<\/p>\n<p>它数的是&quot;和相同的四元组&quot;有多少。E 大，说明 A+B 里每个元素有很多种表示，也就是加法关系密集。<\/p>\n<p>几个基本事实：<\/p>\n<ul><li>\nE(A,B) ≥ |A|²|B|² / |A+B|（由柯西不等式）。\n<\/li><li>\nE(A,A) 与 |A+A| 的关系是&quot;能量大 ⟺ 和集小&quot;的一条定量版本。\n<\/li><li>\n能量的加法结构可以用傅立叶系数表示：E(A,A) = Σ |Â(ξ)|⁴（第 4 章会用）。\n<\/ul>\n<h3>概念 4：覆盖引理<\/h3>\n<p>Ruzsa 覆盖引理：若 |A+B| ≤ K|B|，则存在 A&#x27; ⊂ A，|A&#x27;| ≤ K，使得 A ⊂ A&#x27; + B − B（差集的平移覆盖）。<\/p>\n<p>它的作用是把&quot;和集小&quot;变成&quot;整个 A 可以被少数几个 B−B 的平移盖住&quot;。这是一个局部化动作：原来要处理整个 A，现在只要处理一个大小受控的&quot;骨架&quot; A&#x27;。<\/p>\n<p>Green–Ruzsa 覆盖引理处理的是&quot;近似子群&quot;的情形，Chang 覆盖引理处理的是傅立叶谱的情形（第 5 章会用到）。<\/p>\n<h3>概念 5：BSG 定理<\/h3>\n<p>Balog–Szemerédi–Gowers 定理的粗略表述：<\/p>\n<p>如果加性能量 E(A,B) 接近最大值（即 |A+B| 远小于 |A||B|），那么存在 A&#x27; ⊂ A、B&#x27; ⊂ B，两者都只损失一个常数因子的大小，而 |A&#x27;+B&#x27;| 只比 |B&#x27;| 大常数倍。<\/p>\n<p>一句话：<strong>能量大 ⟹ 存在大子集，其和集很小<\/strong>。<\/p>\n<p>这条定理是整本书使用频率最高的工具之一。它的证明有两个版本：一个用图论（第 6 章），一个用依赖随机变量的方法。<\/p>\n<h3>概念 6：对称集与不平衡部分和集<\/h3>\n<p>A 是对称集指 A = −A（在群里）。对称集的和集、差集行为比一般集合规整。书里用&quot;部分和集&quot;来衡量 A 在某个方向上的投影有多大，从而把一般集合的问题归约到对称情形。<\/p>\n<h3>概念 7：非交换版本<\/h3>\n<p>前面的定义可以搬到非交换群上，代价是 A+B 与 B+A 不再相同，所有不等式都要写成双边形式。第 2.7 节给出了一批这样的结果。<\/p>\n<h3>概念 8：初等和积估计<\/h3>\n<p>在实数域上，考虑 A+A 与 A·A 的大小。直观上，一个集合不可能在加法和乘法下同时都很小：要么加法有结构（A 接近等差数列），要么乘法有结构（A 接近等比数列）。初等版本用 |A+A| 与 |A·A| 的下界给出<\/p>\n<p>max(|A+A|, |A·A|) ≥ c |A|^{1+ε}。<\/p>\n<p>证明手法是&quot;把乘法通过对数变成加法&quot;再套用和集估计，或者用整除性做组合计数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[和集小] --&gt; B[差集也小]\n    B --&gt; C[Ruzsa距离近]\n    C --&gt; D[覆盖引理]\n    A --&gt; E[能量大]\n    E --&gt; F[BSG定理]\n    F --&gt; G[大子集 和集仍小]\n    D --&gt; G\n    G --&gt; H[结构性结论]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把 A 想成一栋楼的住户，B 想成快递柜。|A+B| 是&quot;住户能取到的快递位置&quot;数量。如果这个数量很少，说明快递柜的位置和住户的住址高度重合——于是住户们其实挤在少数几栋楼里。覆盖引理就是在说&quot;少数几栋楼&quot;这件事，BSG 则进一步说&quot;存在一批住户和一批柜子，彼此贴得很近&quot;。<\/p>\n<p><strong>失效边界<\/strong>：这个类比假设了&quot;位置&quot;可以相加，现实里地址不是向量，套不上群结构。<\/p>\n<p><strong>实例<\/strong>：取 A = B = {0,1,2,3} ⊂ ℤ。A+A = {0,...,6}，|A+A| = 7，σ = 1.75。能量 E(A,A)：每个和 s 的表示数依次是 1,2,3,4,3,2,1，平方和 = 1+4+9+16+9+4+1 = 44。而 |A|²|B|²/|A+B| = 256/7 ≈ 36.6，44 比它大，符合理论下界。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Ruzsa 距离是普通距离。它是&quot;对数尺度&quot;上的距离，d=0 只说明 |A−B| = √(|A||B|)，不说明 A=B。\n<\/li><li>\n别以为能量大就一定有强结构。能量大只保证&quot;存在大子集&quot;结构好，子集之外的少数元素可以很乱。\n<\/li><li>\n别以为覆盖引理给出了 A 的完整结构。它给的是&quot;覆盖&quot;，覆盖用的骨架 A&#x27; 本身可能仍然很复杂。\n<\/li><li>\n别以为和积估计对任意环都成立。实数域用序结构，有限域要用多项式方法（第 9 章），两者的证明路线完全不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 |A|=|B|=n 且 |A+B|=n，能推出什么？（答案：A+B 与 B 同大小，存在 A&#x27; 大小为常数使 A 被 B−B 的平移覆盖；解析：这是 σ 极小的情形，直接用 Ruzsa 覆盖引理，K=1。）\n<\/li><li>\nRuzsa 距离为什么用差集定义而不是和集？（答案：差集满足 A−A 含 0、A−B 与 B−A 同大小，能形成度量；解析：和集在非交换群里失去对称性，三角不等式也不好证。）\n<\/li><li>\nBSG 定理的结论里，为什么只能保证&quot;子集&quot;而不是整个 A？（答案：少数异常元素可能破坏和集大小，取子集才能把损失控制在常数因子；解析：定理的证明通过随机抽样或图匹配挑出&quot;规矩&quot;的部分。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|A+B| 小会牵动 |A−B|，用 Ruzsa 距离统一度量。\n<\/li><li>\n能量 E 数的是&quot;同一和的多种表示&quot;，大能量 ⟹ 大子集结构好（BSG）。\n<\/li><li>\n覆盖引理是局部化工具，骨架大小受 K 控制。\n<\/li><li>\n和积不可能同时小，这是加法结构与乘法结构的互斥。\n<\/ul>", "ch03": "<h1>第 3 章：加性几何<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 2 章；线性代数；一点凸几何\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出广义等差数列的定义，算出它的体积上界\n<\/li><li>\n说清&quot;真&quot;等差数列与&quot;非真&quot;的区别，知道非真会带来什么麻烦\n<\/li><li>\n用 Brunn–Minkowski 不等式解释&quot;凸体相加会变大但不会大太多&quot;\n<\/li><li>\n说明 Minkowski 格点定理和 Blichfeldt 引理在做什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>等差数列、格、凸体、有限子群看起来是四类对象，但在加性结构上它们是同一件事的不同外观：都可以用&quot;维数、体积、生成元&quot;三个参数来描述。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：广义等差数列<\/h3>\n<p>一维的等差数列是 a, a+v, a+2v, ...。多维版本是<\/p>\n<p>P = a + [0,N₁]·v₁ + [0,N₂]·v₂ + ... + [0,N_d]·v_d，<\/p>\n<p>其中 a 是起点，v_i 是方向，N_i 是每个方向的长度。这样的集合叫秩为 d 的广义等差数列（GAP）。<\/p>\n<p>它的元素个数最多是 ∏(N_i+1)。如果实际个数就等于这个乘积，称它是<strong>真<\/strong>的（proper）；否则叫非真。<\/p>\n<p><strong>为什么在乎真不真？<\/strong> 非真的 GAP 里，不同的系数组合会撞到同一个元素，集合比&quot;看起来&quot;小。很多定理（比如 Freiman 定理的结论）需要真 GAP，或者需要&quot;低秩&quot;来控制这种塌缩。<\/p>\n<p><strong>例子<\/strong>：P = [0,2]·1 + [0,2]·2 = {0,1,2,4,5,6,8,9,10}，共 9 个，等于 3×3，是真 GAP。若取 v₂ = 3，得到 {0,1,2,3,4,5,6,7,8}，也只有 9 个，仍是真；但取 v₂ = 1，就只有 {0,1,2,3}，缩成 4 个，非真。<\/p>\n<h3>概念 2：加性群与子群<\/h3>\n<p>加性群指带加法结构的交换群。有限子群是&quot;完全有结构&quot;的极端：σ = 1。理解子群是为了理解&quot;什么时候集合对加法封闭&quot;，这是反向定理的终点。<\/p>\n<h3>概念 3：凸体<\/h3>\n<p>凸体是有内点的紧凸集。在 ℝ^d 里，凸体的&quot;体积&quot;和&quot;格点个数&quot;通过 Minkowski 理论联系：体积大，就必然包含非零格点。<\/p>\n<p><strong>Brunn–Minkowski 不等式<\/strong>：<\/p>\n<p>|A+B|^{1/d} ≥ |A|^{1/d} + |B|^{1/d}。<\/p>\n<p>它说明凸体相加时，&quot;线性尺度&quot;是可加的，体积按 d 次方增长。这条不等式是&quot;几何直观&quot;和&quot;加性组合&quot;之间最直接的桥。<\/p>\n<h3>概念 4：格与格点定理<\/h3>\n<p>格是 ℝ^d 里由 d 个线性无关向量生成的离散子群。Minkowski 格点定理：若凸体 K 关于原点对称、体积大于 2^d det(Λ)，则 K 包含非零格点。<\/p>\n<p>Blichfeldt 引理是它的&quot;非对称版本&quot;：体积大于 det(Λ) 的集合，必有两个点差属于格。<\/p>\n<p>这两条定理在书里用来把&quot;连续体积&quot;转成&quot;离散个数&quot;，也是第 8 章关联几何的前置。<\/p>\n<h3>概念 5：真化与提升<\/h3>\n<p>给定一个非真 GAP，能不能换一组方向使它变真、同时体积不变太多？第 3.6 节讨论这个问题。结论大致是：可以用&quot;提升维数&quot;或者&quot;换基&quot;的方式真化，代价是维数或体积的常数因子。<\/p>\n<p>这个问题看起来技术性很强，但它是 Freiman 定理证明里的关键一步：结构定理给出的 GAP 未必真，必须真化才能做后续计数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[子群] --&gt; D[低维结构]\n    B[等差数列] --&gt; D\n    C[格] --&gt; D\n    E[凸体] --&gt; D\n    D --&gt; F[Freiman定理的结论形态]\n    F --&gt; G[真化与提升]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：GAP 像一张多维的网格纸，每个方向可以拉伸不同的倍数。真 GAP 是&quot;网格点没有重叠&quot;，非真 GAP 是&quot;纸被折起来，不同的格点叠到了一起&quot;。<\/p>\n<p><strong>失效边界<\/strong>：网格是离散的，凸体是连续的；类比只覆盖&quot;方向 + 长度&quot;这一层，不覆盖体积与格点的换算。<\/p>\n<p><strong>实例<\/strong>：d = 2，N = (2,2)，体积上界 9。取 v₁=(1,0)，v₂=(0,1)，得到 3×3 的方块，真。取 v₁=(1,0)，v₂=(1,1)，得到的是斜的平行四边形，仍然 9 个点，真。取 v₁=(1,0)，v₂=(2,0)，得到 {0,...,6} 里的一条线，只有 7 个点，非真——两个方向共线了。<\/p>\n<p>这个例子说明：真化本质上要求方向&quot;足够独立&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 GAP 的秩等于环境群的维数。秩是生成方向的个数，可以远小于环境群维数。\n<\/li><li>\n别以为真 GAP 的体积就等于元素个数。只有在方向&quot;整数独立&quot;且长度不冲突时才相等，一般只能给上界。\n<\/li><li>\n别以为 Brunn–Minkowski 对非凸集也成立。凸性是必要条件，去掉之后不等式反向都可能。\n<\/li><li>\n别以为格点定理只和数论有关。它在本章的作用是把几何体积翻译成组合计数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n秩为 3、长度各为 2 的 GAP 最多有多少个元素？（答案：27；解析：每个方向 0、1、2 三种取值，3³=27。）\n<\/li><li>\n为什么 Freiman 定理的结论要求&quot;低秩&quot;？（答案：秩低意味着结构简单、可用少量参数描述；解析：秩高时 GAP 体积指数增长，无法保证它不比 A 大太多。）\n<\/li><li>\nMinkowski 定理里&quot;对称&quot;这个条件能去掉吗？（答案：不能直接用，去掉后要用 Blichfeldt 引理或者其他版本；解析：对称性保证了若 x 在 K 内则 −x 也在，从而差属于 K+K。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nGAP = 起点 + 若干方向 + 各方向长度；真 = 不塌缩。\n<\/li><li>\n凸体相加，线性尺度可加：|A+B|^{1/d} ≥ |A|^{1/d}+|B|^{1/d}。\n<\/li><li>\n体积转个数靠 Minkowski 与 Blichfeldt。\n<\/li><li>\n真化是结构定理落地的最后一公里。\n<\/ul>", "ch04": "<h1>第 4 章：傅立叶分析方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：12 小时 | <strong>前置<\/strong>：第 1、2 章；复变函数与内积空间\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出有限交换群上的特征、傅立叶变换与 Parseval 恒等式\n<\/li><li>\n用线性偏差解释&quot;一个集合偏向某个方向&quot;是什么意思\n<\/li><li>\n说清 Bohr 集为什么是&quot;伪随机性&quot;的度量工具\n<\/li><li>\n用傅立叶系数表达加性能量，并解释它给出的和集下界\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>傅立叶变换把加法卷积变成逐点相乘，于是&quot;和集有多大&quot;&quot;能量有多高&quot;这些加法问题，变成了&quot;系数有多集中&quot;的乘法问题。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：特征与傅立叶系数<\/h3>\n<p>在有限交换群 Z 上，一个特征是从 Z 到单位圆的同态 ξ: Z → ℂ，满足 ξ(x+y) = ξ(x)ξ(y)。对 ℤ/Nℤ，特征就是 ξ_r(x) = e^{2πirx/N}。<\/p>\n<p>函数 f 的傅立叶变换是<\/p>\n<p>f̂(ξ) = Σ_x f(x) ξ(x) 的共轭，<\/p>\n<p>也就是 f 在每个频率上的投影。集合 A 的指示函数 1_A 的变换记作 Â(ξ)，它衡量 A 与频率 ξ 的&quot;对齐程度&quot;。<\/p>\n<h3>概念 2：三个基本恒等式<\/h3>\n<ul><li>\n<strong>逆变换<\/strong>：f 可以由所有 f̂ 重构。\n<\/li><li>\n<strong>Parseval<\/strong>：Σ_x |f(x)|² = (1/|Z|) Σ_ξ |f̂(ξ)|²。能量守恒。\n<\/li><li>\n<strong>卷积定理<\/strong>：(f * g)̂ = f̂ · ĝ。这条是把加法变乘法的关键。\n<\/ul>\n<p>有了卷积定理，A+B 的指示函数（本质是 1_A * 1_B）的傅立叶系数就是 Â·B̂，问题立刻从集合层面降到系数的乘积上。<\/p>\n<h3>概念 3：线性偏差<\/h3>\n<p>若 Â(ξ) 明显不为零，称 A 在频率 ξ 上有线性偏差。直观上，A 的元素在&quot;相位 ξ(x)&quot;这个圆周上分布不均匀，偏向某个方向。<\/p>\n<p>偏差的直接后果是：A 在某条&quot;模某个频率&quot;的等差结构上有超出随机的比例。这是第 10 章 Roth 定理的出发点。<\/p>\n<p><strong>例子<\/strong>：A 是 [1,N] 里的偶数，取 ξ(x) = (−1)^x，则 Â(ξ) = |A|，偏差最大。这说明&quot;全是偶数&quot;在频率 1 上是完全对齐的。<\/p>\n<h3>概念 4：Bohr 集<\/h3>\n<p>给定一组频率 Δ 和半径 ρ，Bohr 集是<\/p>\n<p>B(Δ, ρ) = { x : 对所有 ξ∈Δ，|ξ(x) − 1| ≤ ρ }。<\/p>\n<p>它是&quot;在若干频率上同时接近 1&quot;的元素的集合，可以理解为&quot;多条等差条件的交集&quot;。在 Z/NZ 里，Bohr 集就是低维 GAP 的傅立叶对偶。<\/p>\n<p>为什么需要它？因为在傅立叶证明里，偏差出现的频率集合往往不是独立的，直接当作独立方向会高估结构。Bohr 集给出了&quot;这些频率共同定义的子群&quot;的正确大小，从而把密度增量控制在可接受范围内。<\/p>\n<h3>概念 5：(p) 常数与 Bh[g] 集<\/h3>\n<p>(p) 常数衡量一个群里的&quot;加法随机性&quot;：对小整数 p，计数 p 元组 (x₁,...,x_p) 满足 x₁+...+x_p=0 的比例偏离 1/|Z| 多少。<\/p>\n<p>Bh[g] 集（也叫 B_h 集）是&quot;每种和最多有 g 种表示&quot;的集合，是 Sidon 集的推广（Sidon 对应 g=1）。它们刻画的是加法表示的稀疏程度，与和集大小是同一件事的两面。<\/p>\n<h3>概念 6：分离集与谱<\/h3>\n<p>分离集指元素之间没有短小的整数线性关系，类似&quot;加法意义上线性无关&quot;。集合 A 的谱是那些使 |Â(ξ)| 大的频率组成的集合。谱小 ⟹ A 的结构接近低维 GAP；谱大 ⟹ A 更随机。<\/p>\n<p>这条&quot;谱大小 ↔ 结构强弱&quot;的对应，是第 5 章反向定理的傅立叶版本。<\/p>\n<h3>概念 7：和集中的等差数列<\/h3>\n<p>本节的核心结论是：只要 A 的傅立叶偏差足够小，A+A 就几乎填满整个群；反过来，若 A+A 没有填满，就必然存在明显的频率偏差。<\/p>\n<p>证明套路是&quot;若没有偏差，则能量小，则和集大&quot;，逆否命题就是&quot;和集小则一定有偏差&quot;。这也是第 10 章密度增量论证的雏形。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n    A[集合A] --&gt; B[傅立叶系数]\n    B --&gt; C[Parseval 能量守恒]\n    B --&gt; D[卷积定理]\n    D --&gt; E[和集大小]\n    C --&gt; F[加性能量]\n    B --&gt; G[线性偏差]\n    G --&gt; H[Bohr集]\n    H --&gt; I[密度增量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把集合想成一段音频信号。时域里看是&quot;哪些位置有声音&quot;，频域里看是&quot;哪些音高在共振&quot;。傅立叶系数就是每个音高的音量。加法卷积在时域里是&quot;回声叠加&quot;，在频域里只是音量相乘——这是它好用的原因。<\/p>\n<p><strong>失效边界<\/strong>：音频是连续的，有限群上的频率是离散的；另外集合只有 0/1 值，没有振幅，类比丢掉了这一点。<\/p>\n<p><strong>实例<\/strong>：Z = ℤ/8ℤ，A = {0,1,2,3}。Â(0) = 4。Â(4) = Σ_x 1_A(x)(−1)^x = 1−1+1−1 = 0。Â(2) = Σ 1_A(x) i^x = 1+i−1−i = 0。Â(1) = 1 + e^{−iπ/4} + e^{−iπ/2} + e^{−i3π/4}，模长约为 2.6，偏差明显。<\/p>\n<p>这说明&quot;前一半&quot;这个集合在频率 1 上有偏差，符合直觉：它不是随机的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Â(ξ) 大就一定有等差数列。偏差只说明&quot;偏向某个频率&quot;，方向可能很复杂。\n<\/li><li>\n别以为 Parseval 是&quot;能量守恒&quot;的物理定律。它只是内积空间里的勾股定理在群上的写法。\n<\/li><li>\n别以为 Bohr 集就是 GAP。两者在特定群里有对应关系，但 Bohr 集的定义依赖频率集合，不总是能写成低维 GAP。\n<\/li><li>\n别以为傅立叶方法能处理 k≥4 的 Szemerédi 定理。线性傅立叶只能看到&quot;一维偏差&quot;，k≥4 需要 Gowers 范数（第 11 章）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出有限群上 Parseval 恒等式，并说明它为什么能用来估能量。（答案：Σ|f|² = (1/|Z|)Σ|f̂|²；解析：把 f 取成 1_A，左边是 |A|，右边给出系数的平方和，与能量的傅立叶表达相联。）\n<\/li><li>\n为什么 A 全是偶数时，Â 在频率 1 上最大？（答案：特征 (−1)^x 在偶数上取 1，所有项同号相加；解析：偏差等于&quot;每个元素都对齐同一个相位&quot;。）\n<\/li><li>\n傅立叶方法为什么对 k=4 失效？（答案：线性相位只能检测一维偏差，k≥4 需要更高阶的均匀性范数；解析：Gowers 范数本质上是高阶傅立叶，普通傅立叶是它的 k=2 情形。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n卷积定理是整章的发动机：加法变乘法。\n<\/li><li>\n偏差大 ⟹ 结构强；无偏差 ⟹ 和集大。\n<\/li><li>\nBohr 集是&quot;多频率对齐&quot;的正确几何。\n<\/li><li>\n能量的傅立叶形式是 Σ|Â|⁴。\n<\/ul>", "ch05": "<h1>第 5 章：逆和集定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>预估学时<\/strong>：14 小时 | <strong>前置<\/strong>：第 2、3、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清&quot;正向估计&quot;和&quot;逆向结构&quot;的分界：知道 σ 小到什么程度才能得到什么结论\n<\/li><li>\n用 e-变换解释为什么可以假设集合对称、且和集最小\n<\/li><li>\n写出 Freiman 同态的定义，并说明它为什么比群同态弱\n<\/li><li>\n叙述无挠情形下的 Freiman 定理：小倍增 ⟹ 低秩 GAP\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>第 2 章告诉我们&quot;和集小会牵动别的和集&quot;，本章要回答更硬的问题：和集小，A 本身长什么样？答案是无挠时 A 落在一个低秩等差数列里，有挠时要先把挠部分分离出去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题为什么难<\/h3>\n<p>&quot;|A+A| ≤ K|A|&quot;只是一个大小的约束。满足它的集合可以很不一样：子群、等差数列、GAP，甚至它们的并集加几个杂点。要从一个数量不等式反推出结构，必须找到一种&quot;只依赖加性关系&quot;的规范形式，把所有等价的外观统一掉。<\/p>\n<h3>概念 2：e-变换<\/h3>\n<p>给定集合 A 和元素 a∈A，e-变换把 A 换成 (A ∪ (A+a)) 或者 (A ∩ (A+a)) 的某种组合，目标是在保持 |A+A| 不增的前提下，让集合更&quot;对称&quot;、更&quot;规整&quot;。<\/p>\n<p>它的作用像&quot;整理房间&quot;：不改变房间总面积（和集大小），但把东西挪到该在的位置，方便后面描述。<\/p>\n<p>反复做 e-变换，可以假设 A 满足&quot;对称性&quot;和&quot;极小性&quot;，这是很多证明的第一步归约。<\/p>\n<h3>概念 3：Freiman 同态<\/h3>\n<p>φ: A → B 是 Freiman 同态，指它保持加法关系：若 a₁+a₂ = a₃+a₄（在 A 所在的群里），则 φ(a₁)+φ(a₂) = φ(a₃)+φ(a₄)。<\/p>\n<p>它比群同态弱得多：不需要对 A 之外的元素有定义，也不要求单射。但它足够强，能把&quot;加法结构&quot;从一个集合搬到另一个集合。<\/p>\n<p><strong>例子<\/strong>：A = {0,1,2}，B = {0,1,4}，φ(0)=0, φ(1)=1, φ(2)=4。A 里 0+2 = 1+1，映射后 0+4 = 1+1 不成立，所以 φ 不是 Freiman 同态。换 φ(2)=2 就行。<\/p>\n<h3>概念 4：无挠情形下的 Freiman 定理<\/h3>\n<p>定理大意：若 A ⊂ ℤ^d 且 |A+A| ≤ K|A|，则存在秩不超过 d(K)、大小不超过 C(K)|A| 的 GAP，包含 A。<\/p>\n<p>这里 d(K) 和 C(K) 只依赖 K，不依赖 |A|。这是&quot;小倍增 ⟹ 低秩结构&quot;的定量版本，也是全书最重要的结构定理。<\/p>\n<p>K 很小（σ &lt; 2 或 &lt; 3）时，结论可以精确到&quot;子群 + 小扰动&quot;或者&quot;低维 GAP&quot;。K 到 log|A| 量级时，只能给出 GAP，秩和体积都变大。<\/p>\n<h3>概念 5：挠与无挠<\/h3>\n<p>群里有元素满足 mx = 0（m 为正整数），叫有挠。ℤ/Nℤ 全是挠，ℤ^d 无挠。<\/p>\n<p>有挠时，A 可能落在&quot;子群 + GAP&quot;的混合结构里，比如 A 的一部分落在一个有限子群里，另一部分沿某个方向排开。这时不能指望单一 GAP 描述，必须先做&quot;挠部分分离&quot;。<\/p>\n<h3>概念 6：万能环境群<\/h3>\n<p>给定 A 的加法关系，可以构造一个&quot;最大&quot;的群，使 A 嵌入其中且所有加法关系保持。这叫万能环境群，作用是让&quot;结构定理&quot;不依赖具体的环境群：先把 A 搬到一个规范的大群里，再在里面找 GAP。<\/p>\n<p>这一步是技术性的，但很关键：没有它，定理在不同环境群里要分别陈述，没法统一。<\/p>\n<h3>概念 7：任意群里的 Freiman 定理<\/h3>\n<p>最终版本把&quot;无挠&quot;换成&quot;商掉挠子群&quot;：A 落在一个&quot;低秩 GAP + 有限子群&quot;的结构里，参数只依赖 K。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[小倍增] --&gt; B[e变换]\n    B --&gt; C[对称化与极小化]\n    C --&gt; D{有挠吗}\n    D --&gt;|无挠| E[低秩GAP]\n    D --&gt;|有挠| F[分离挠部分]\n    F --&gt; G[GAP加有限子群]\n    E --&gt; H[Freiman定理]\n    G --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：一堆散落的棋子，如果它们&quot;两两相加的结果很少&quot;，说明棋子其实排在一张规则的棋盘上。e-变换是把棋子挪到棋盘的格点上，Freiman 定理是说&quot;一定能找到这样一张棋盘，格子数不超过棋子数的常数倍&quot;。<\/p>\n<p><strong>失效边界<\/strong>：棋盘是二维的，定理里的秩可能很高；类比也看不出&quot;常数倍&quot;到底多大。<\/p>\n<p><strong>实例<\/strong>：A = {0,1,2,3,4} ⊂ ℤ。|A+A| = 9，σ = 1.8。A 本身就是秩 1、长度 4 的 GAP，定理结论平凡成立。<\/p>\n<p>再取 A = {0,1,2} ∪ {100,101,102}。|A+A| 比 6 大不少，σ ≈ 3 左右。它不是一个 GAP，但可以被两个长度 2 的 GAP 覆盖——这说明&quot;覆盖&quot;和&quot;包含&quot;是两回事，定理给的是包含于一个更大的 GAP。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Freiman 定理给出了 A 的精确形状。它只保证 A 落在一个 GAP 里，GAP 里可能有大量不属于 A 的点。\n<\/li><li>\n别以为常数 C(K) 很小。K 增大时 C(K) 增长很快，实际应用里经常只能得到&quot;存在但巨大&quot;的界。\n<\/li><li>\n别以为有挠只是技术细节。ℤ/Nℤ 里的结构可以完全是子群，跟整数情形差别很大。\n<\/li><li>\n别以为 Freiman 同态就是群同态。它只保持 A 内部的加法关系，定义域外的东西不管。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n为什么 e-变换要保持 |A+A| 不增？（答案：它是归约工具，若和集变大就失去了&quot;小倍增&quot;的前提；解析：所有后续估计都建立在 |A+A| ≤ K|A| 上。）\n<\/li><li>\nFreiman 定理的结论里，GAP 的秩依赖什么？（答案：只依赖倍增常数 K，不依赖 |A|；解析：这正是定理&quot;定量结构&quot;的体现。）\n<\/li><li>\n有挠群里为什么不能直接套无挠版本？（答案：子群部分会破坏&quot;单一 GAP 包含&quot;的结论；解析：需要先把挠部分分离，再对无挠商施用定理。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n正向给大小，逆向给形状；本章是逆向。\n<\/li><li>\ne-变换负责&quot;整理&quot;，不改变和集大小。\n<\/li><li>\nFreiman：小倍增 ⟹ 低秩 GAP，参数只依赖 K。\n<\/li><li>\n有挠先分离，无挠再套定理。\n<\/ul>", "ch06": "<h1>第 6 章：图论方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 2 章；基础图论\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 Turán 定理给出独立集的下界，并说明它怎么用来构造无和集\n<\/li><li>\n解释 Ramsey 定理与 van der Waerden 定理的关系\n<\/li><li>\n用图的连通性重述 BSG 定理的证明思路\n<\/li><li>\n写出 Plünnecke 不等式的适用条件，知道它为什么比 BSG 更&quot;正向&quot;\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把加法关系画成图，和集大小就变成了&quot;顶点覆盖&quot;或&quot;边密度&quot;；图论里的独立集、匹配、连通性，分别对应组合里的无和集、部分和、结构提取。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么加性组合学会用到图<\/h3>\n<p>很多加性问题可以先固定一侧：给定 A，把每个 a∈A 和它对应的&quot;伙伴&quot;用边连起来。于是&quot;存在一个没有某种和结构的子集&quot;等价于&quot;图里存在独立集&quot;；&quot;某个元素表示次数很多&
